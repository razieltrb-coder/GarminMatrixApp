<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEST</title>
<style>body{background:#050a05;color:#00ff41;font-family:monospace;padding:12px}#dbg{border:1px solid red;color:#ffaaaa;padding:10px;white-space:pre-wrap}</style></head><body>
<h3>GARMIN // MATRIX TEST</h3>
<div id="dbg">Avvio...</div>
<div id="out"></div>
<script>
(async function(){
  let dbg=document.getElementById('dbg');
  try{
    dbg.textContent='JS OK - provo fetch...\n';
    let urls=['database.json','./database.json','https://appassets.androidplatform.net/assets/database.json'];
    for(let u of urls){
      try{
        dbg.textContent+='> '+u+'\n';
        let r=await fetch(u,{cache:'no-store'});
        dbg.textContent+=' status '+r.status+'\n';
        if(r.ok){
          let j=await r.json();
          dbg.textContent+=' OK: '+j.attivita.length+' att / '+j.giorni.length+' giorni\n';
          document.getElementById('out').innerHTML='<h2 style="color:#00ff41">'+j.attivita.length+' ATT / '+j.giorni.length+' GG CARICATI</h2><p>Ana: '+j.bilancio_carico.anaerobico+' Alto: '+j.bilancio_carico.aerobico_alto+' Basso: '+j.bilancio_carico.aerobico_basso+'</p>';
          dbg.style.display='none';
          return;
        }
      }catch(e){ dbg.textContent+=' ERR '+e.message+'\n'; }
    }
    dbg.textContent+='\nNESSUN URL FUNZIONA';
  }catch(e){ dbg.textContent='CRASH: '+e.message+'\n'+e.stack; }
})();
</script></body></html>
