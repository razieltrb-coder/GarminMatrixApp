<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAZIL V34</title><style>:root{--g:#00ff41;--b:rgba(0,255,65,0.55)}*{box-sizing:border-box}body{margin:0;background:#030a03;color:#c8f0c8;font-family:monospace;font-size:10px}.top{padding:8px 12px;display:flex;justify-content:space-between;background:#081208;border-bottom:1px solid var(--b);color:var(--g);font-size:9px}.sec{margin:12px 8px}.t{color:var(--g);font-size:9px;letter-spacing:1px;margin-bottom:6px;font-weight:800}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}.card{background:linear-gradient(180deg,#0e1e0e,#081208);border:1px solid var(--b);border-radius:8px;padding:8px;overflow:hidden}.card.chart{padding:6px 6px 2px 6px;display:flex;flex-direction:column}.lb{font-size:7px;color:#6b8a6b;text-transform:uppercase;flex-shrink:0}.v{font-size:18px;font-weight:800;color:#fff;margin-top:2px}.sub{font-size:7px;color:#6b8a6b;word-break:break-all}.barH{height:8px;background:#051405;border:1px solid #143a15;border-radius:4px;overflow:hidden;margin-top:4px}.barH div{height:100%}canvas{width:100%;height:100%;display:block}.ch{height:135px;flex-shrink:0}.chBig{height:155px;flex-shrink:0}.volWrap{height:265px;flex-shrink:0}.row{display:flex;justify-content:space-between;padding:6px;border-bottom:1px solid #102410;font-size:10px}.bTop{font-size:7px;background:#0f1f0f;border:1px solid var(--g);padding:2px 6px;border-radius:10px;color:var(--g)}#dbg{border:1px solid red;color:#ffaaaa;padding:6px;margin:6px;white-space:pre-wrap;border-radius:6px}</style></head><body>
<div class="top"><div id="top">CARICAMENTO V34</div><div><span class="bTop" id="dBadge">--</span> <span class="bTop">Brazil V34</span></div></div>
<div id="dbg">Avvio V34...</div><div id="ui" style="display:none">
<div class="sec"><div class="t">● Ultime 10 Attività</div><div class="card" id="boxAtt">carico...</div></div>
<div id="chatBox" style="margin:20px 8px;background:#0f1e0f;border:1px solid var(--b);border-radius:12px;padding:12px">
<h3 style="color:#00ff41;margin:0;font-size:12px">💬 RAZIEL COACH - Chat Gemini V34 FIX</h3>
<div id="keyArea" style="display:none;margin:10px 0;padding:10px;background:#1a1a00;border:1px solid #ffcc00;border-radius:8px">
<div style="color:#ffcc00;font-size:10px;font-weight:800">🔑 Incolla key:</div>
<div style="display:flex;gap:6px;margin-top:6px"><input id="keyInput" placeholder="AIza..." style="flex:1;padding:10px;background:#000;color:#ff0;border:1px solid #ffcc00;border-radius:8px"><button onclick="saveKey()" style="padding:10px;background:#ffcc00;color:#000;border:none;border-radius:8px;font-weight:800">Salva</button></div>
</div>
<div id="chatLog" style="height:360px;overflow-y:auto;background:#020802;padding:10px;border-radius:8px;font-size:11px;margin:10px 0;border:1px solid #143a15;white-space:pre-wrap"></div>
<div style="display:flex;gap:6px"><input id="chatInput" placeholder="Ci sei?" style="flex:1;padding:10px;border-radius:8px;background:#081208;color:#e0ffe0;border:1px solid var(--b)"><button onclick="sendChat()" style="padding:10px 16px;background:#00ff41;color:#000;border:none;border-radius:8px;font-weight:800">Invia</button></div>
<div id="keyStatus" style="font-size:8px;margin-top:6px;color:#ffb84d"></div>
</div></div>
<script>
const INJECTED_GEMINI_KEY="__GEMINI_KEY__";
function getKey(){if(typeof INJECTED_GEMINI_KEY!=='undefined'&&INJECTED_GEMINI_KEY&&INJECTED_GEMINI_KEY!=="__GEMINI_KEY__"&&INJECTED_GEMINI_KEY.length>20)return INJECTED_GEMINI_KEY;let k=localStorage.getItem('GEMINI_API_KEY');if(k&&k.length>20)return k;return""}
function saveKey(){let k=document.getElementById('keyInput').value.trim();if(k.length<20){alert("Key corta");return}localStorage.setItem('GEMINI_API_KEY',k);document.getElementById('keyArea').style.display='none';document.getElementById('keyStatus').textContent="✅ Salvata len="+k.length;document.getElementById('keyStatus').style.color="#00ff41";document.getElementById('chatLog').innerHTML+="<div style='color:#ffcc00'>Key salvata. Scrivi.</div>";}
function checkKeyUI(){let k=getKey();let ks=document.getElementById('keyStatus');let ka=document.getElementById('keyArea');if(!k){ka.style.display='block';ks.textContent="⚠️ Nessuna key";ks.style.color="#ff2a2a"}else{ka.style.display='none';ks.textContent="✅ Key len "+k.length;ks.style.color="#00ff41"}}
(async function(){try{let r=await fetch('database.json',{cache:'no-store'});let DB=await r.json();let G=DB.giorni||[];let A=DB.attivita||[];document.getElementById('dbg').style.display='none';document.getElementById('ui').style.display='block';document.getElementById('top').textContent='GARMIN // '+(G[G.length-1]?.data||'').slice(0,10);document.getElementById('dBadge').textContent=(G[G.length-1]?.data||'').slice(0,10);let box=document.getElementById('boxAtt');let html='';for(let i=0;i<Math.min(10,A.length);i++){let a=A[i];html+=`<div class="row"><span>● ${(a.inizio||'').slice(5,10)} - ${a.tipo} - ${a.nome.slice(0,28)}</span><b>${(a.distanza_m/1000).toFixed(2)}km</b></div>`}box.innerHTML=html;checkKeyUI()}catch(e){document.getElementById('dbg').textContent='ERR: '+e.message}})();

async function sendChat(){
  const input=document.getElementById('chatInput'); const log=document.getElementById('chatLog'); const msg=input.value.trim(); if(!msg) return;
  let key=getKey(); if(!key){document.getElementById('keyArea').style.display='block'; return;}
  log.innerHTML+=`<div style="margin:8px 0"><b style="color:#00ff41">Tu:</b> ${msg}</div>`; input.value=''; log.scrollTop=log.scrollHeight;
  log.innerHTML+=`<div id="tmp" style="color:#888">Invio a Gemini 2.0 Flash...</div>`;
  try{
    const dbRes=await fetch('database.json'); const DB=await dbRes.json();
    const atti=(DB.attivita||[]).slice(0,15).map(a=>`${(a.inizio||'').slice(0,10)} ${a.nome?.slice(0,18)} ${(a.distanza_m/1000).toFixed(1)}km`).join('\n');
    const giorni=(DB.giorni||[]).slice(-5).map(g=>`${(g.data||'').slice(5,10)} FC${g.fc_riposo} HRV${g.hrv}`).join('\n');
    const prompt=`Sei Coach Garmin, rispondi in italiano breve. Dati:\n${atti}\nGiorni:\n${giorni}\nDomanda: ${msg}`;

    const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),15000);
    const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]}),signal:controller.signal});
    clearTimeout(timeout);
    const js=await resp.json();
    const tmp=document.getElementById('tmp');
    if(!resp.ok){ if(tmp) tmp.innerHTML=`<span style='color:#ff5555'>Errore ${resp.status}: ${js.error?.message||JSON.stringify(js).slice(0,300)}</span>`; return; }
    if(!js.candidates){ if(tmp) tmp.innerHTML=`<span style='color:#ff5555'>Nessuna risposta: ${JSON.stringify(js).slice(0,400)}</span>`; return; }
    const txt=js.candidates[0].content.parts[0].text;
    tmp.remove();
    log.innerHTML+=`<div style="margin:8px 0;background:#0a1a0a;padding:8px;border-radius:6px;border-left:2px solid #00ff41"><b>Coach:</b> ${txt.replace(/\n/g,'<br>')}</div>`;
  }catch(e){ let t=document.getElementById('tmp'); if(t) t.innerHTML=`<span style='color:#ff5555'>Errore rete/timeout: ${e.message} - prova a rifare Reset Key</span>`; }
  log.scrollTop=log.scrollHeight;
}
document.getElementById('chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat()});
</script></body></html>
