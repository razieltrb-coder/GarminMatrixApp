<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATRIX TEST OK</title>
<style>body{margin:0;background:#050a05;color:#00ff41;font-family:monospace;padding:12px}.card{background:#0f1a0f;border:1px solid #00ff41;border-radius:12px;padding:12px;margin:8px 0}.k{font-size:24px;color:#fff}</style></head><body>
<div id="dbg" style="border:1px solid red;color:#ffaaaa;padding:10px;white-space:pre-wrap">Avvio TEST...</div>
<div id="ui" style="display:none">
<div class="card"><div>FORMA // 437 ATT TEST</div><div class="k" id="k1">--</div><div id="k2"></div></div>
<div class="card"><div>BILANCIO CARICO</div><div class="k"><span id="a">--</span> / <span id="b">--</span> / <span id="c">--</span></div></div>
<div class="card"><div>ULTIME 3 ATTIVITA</div><div id="list"></div></div>
</div>
<script>
(async function(){
  var dbg=document.getElementById('dbg');
  try{
    dbg.textContent='JS OK - provo fetch...\n';
    var r=await fetch('database.json',{cache:'no-store'});
    dbg.textContent+='fetch status '+r.status+'\n';
    var DB=await r.json();
    dbg.style.display='none';
    document.getElementById('ui').style.display='block';
    document.getElementById('k1').textContent=DB.attivita.length+' ATT / '+DB.giorni.length+' GG';
    document.getElementById('k2').textContent=DB.bilancio_carico.feedback;
    document.getElementById('a').textContent=DB.bilancio_carico.anaerobico;
    document.getElementById('b').textContent=DB.bilancio_carico.aerobico_alto;
    document.getElementById('c').textContent=DB.bilancio_carico.aerobico_basso;
    var html=''; for(var i=0;i<3;i++){ var at=DB.attivita[i]; html+=at.inizio.slice(0,10)+' '+at.nome+' '+(at.distanza_m/1000).toFixed(2)+'km<br>'; }
    document.getElementById('list').innerHTML=html;
  }catch(e){ dbg.textContent='ERRORE: '+e.message+'\n'+e.stack; }
})();
</script></body></html>
