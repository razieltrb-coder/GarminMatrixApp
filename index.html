<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MATRIX V15.2</title><style>body{margin:0;background:#050a05;color:#e0ffe0;font-family:monospace;font-size:12px;padding:8px}.h{border:1px solid #00ff41;padding:8px;display:flex;justify-content:space-between}.c{border:1px solid #00ff41;border-radius:10px;padding:10px;margin:8px 0;background:#0f1a0f}.k{font-size:20px;color:#fff;font-weight:800}.lb{font-size:9px;color:#6b8a6b}.bar{height:12px;background:#0a1a0a;border:1px solid #143a15;margin:4px 0}.bar div{height:100%}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.r{padding:6px;border-bottom:1px solid #122212}</style></head><body>
<div class="h"><div id="top">GARMIN // MATRIX - CARICAMENTO...</div><div id="cnt"></div></div>
<div id="dbg" style="border:1px solid red;color:#ffaaaa;padding:8px;margin:8px 0;white-space:pre-wrap">Avvio...</div>
<div id="ui" style="display:none">
<div class="g2"><div class="c"><div class="lb">SOVRACCARICO</div><div class="k" id="sov">--</div><div class="lb" id="sov2"></div></div><div class="c"><div class="lb">PRONTEZZA</div><div class="k" id="pron">--</div></div><div class="c"><div class="lb">BILANCIO</div><div class="k" id="bil">--</div><div class="lb" id="bil2"></div></div><div class="c"><div class="lb">VO2MAX</div><div class="k" id="vo2">--</div></div></div>
<div class="c"><div class="lb">BILANCIO CARICO - <span id="per">28GG</span></div><div>ANA <span id="va">--</span><div class="bar"><div id="ba" style="background:#b084ff;width:0%"></div></div></div><div>ALTO <span id="vh">--</span><div class="bar"><div id="bh" style="background:#ffb84d;width:0%"></div></div></div><div>BASSO <span id="vb">--</span><div class="bar"><div id="bb" style="background:#7be8e8;width:0%"></div></div></div><div class="lb" id="msg"></div></div>
<div class="g2"><div class="c"><div class="lb">SLEEP</div><div class="k" id="sl">--</div><div class="lb" id="sl2"></div></div><div class="c"><div class="lb">HRV</div><div class="k" id="hr">--</div></div><div class="c"><div class="lb">RHR</div><div class="k" id="rh">--</div></div><div class="c"><div class="lb">BATT</div><div class="k" id="bt">--</div></div></div>
<div class="g3"><div class="c"><div class="lb">CORSA</div><div class="k" id="oc">--</div></div><div class="c"><div class="lb">BICI</div><div class="k" id="ob">--</div></div><div class="c"><div class="lb">KM TOT</div><div class="k" id="km">--</div></div></div>
<div class="c"><div class="lb">RECORD REALI</div><div id="rec"></div></div>
<div class="c"><div class="lb">ULTIME 10</div><div id="lst"></div></div>
</div>
<script>
(async function(){
var d=document.getElementById('dbg');
try{
d.textContent='JS OK fetch...';
var r=await fetch('database.json',{cache:'no-store'});
d.textContent+=' '+r.status;
var DB=await r.json();
var G=DB.giorni||[]; var A=DB.attivita||[]; var B=DB.bilancio_carico||{};
d.style.display='none'; document.getElementById('ui').style.display='block';
document.getElementById('top').textContent='GARMIN // '+A.length+' ATT / '+G.length+' GG - '+(G[G.length-1].data||'').slice(0,10);
document.getElementById('cnt').textContent=A.length+' ATT';
function last(k){for(var i=G.length-1;i>=0;i--) if(G[i][k]!=null) return G[i][k]; return null}
function fmt(s){if(!s)return'--';var m=Math.floor(s/60);var sec=m=Math.floor(s/60);var ss=Math.round(s%60); if(ss<10) ss='0'+ss; return m+':'+ss}
function oS(g){if(!g)return 0;if(g.sonno_ore)return parseFloat(g.sonno_ore);if(g.sonno_totale_s)return g.sonno_totale_s/3600;return 0}
var tot=(B.anaerobico||0)+(B.aerobico_alto||0)+(B.aerobico_basso||0);
document.getElementById('sov').textContent=(tot/100).toFixed(2); document.getElementById('sov2').textContent=B.messaggio||'';
document.getElementById('pron').textContent=last('readiness')||'--';
document.getElementById('bil').textContent=B.feedback||'OK'; document.getElementById('bil2').textContent=(B.anaerobico||0)+'/'+(B.aerobico_alto||0)+'/'+(B.aerobico_basso||0);
document.getElementById('vo2').textContent=last('vo2max')||'--';
document.getElementById('va').textContent=B.anaerobico||0; document.getElementById('vh').textContent=B.aerobico_alto||0; document.getElementById('vb').textContent=B.aerobico_basso||0;
var maxV=Math.max(B.anaerobico||1,B.aerobico_alto||1,B.aerobico_basso||1);
document.getElementById('ba').style.width=Math.round((B.anaerobico||0)/maxV*100)+'%';
document.getElementById('bh').style.width=Math.round((B.aerobico_alto||0)/maxV*100)+'%';
document.getElementById('bb').style.width=Math.round((B.aerobico_basso||0)/maxV*100)+'%';
document.getElementById('msg').textContent=B.messaggio||''; document.getElementById('per').textContent=B.periodo||'28GG';
var u=G[G.length-1]||{};
document.getElementById('sl').textContent=u.sonno_punteggio||'--'; document.getElementById('sl2').textContent=oS(u).toFixed(1)+'h';
document.getElementById('hr').textContent=(u.hrv||'--')+' ms';
document.getElementById('rh').textContent=(u.fc_riposo||'--')+' bpm';
document.getElementById('bt').textContent=(u.body_battery_max||'--')+'/'+(u.body_battery_min||'--');
var sumC=0,sumB=0,kmC=0,kmB=0; for(var i=0;i<A.length;i++){var a=A[i]; if(a.tipo==='running'){sumC+=(a.durata_s||0)/3600; kmC+=(a.distanza_m||0)/1000} if(a.tipo==='cycling'){sumB+=(a.durata_s||0)/3600; kmB+=(a.distanza_m||0)/1000}}
document.getElementById('oc').textContent=sumC.toFixed(1)+'h '+kmC.toFixed(0)+'km';
document.getElementById('ob').textContent=sumB.toFixed(1)+'h '+kmB.toFixed(0)+'km';
document.getElementById('km').textContent=(kmC+kmB).toFixed(0)+'km';
function best(dist,tol){var b=null; for(var i=0;i<A.length;i++){var a=A[i]; if(a.tipo!=='running')continue; if(Math.abs((a.distanza_m||0)-dist)>=tol)continue; if(!b||a.durata_s<b.durata_s) b=a} return b}
var r1=best(1000,150),r5=best(5000,400),r10=best(10000,800),r21=best(21097,1000),r42=best(42195,2000);
var recHtml=''; if(r1) recHtml+='1K '+fmt(r1.durata_s)+' '+r1.nome.slice(0,20)+'<br>'; if(r5) recHtml+='5K '+fmt(r5.durata_s)+' '+r5.nome.slice(0,20)+'<br>'; if(r10) recHtml+='10K '+fmt(r10.durata_s)+' '+r10.nome.slice(0,20)+'<br>'; if(r21) recHtml+='MEZZA '+fmt(r21.durata_s)+'<br>'; if(r42) recHtml+='MARA '+fmt(r42.durata_s)+'<br>';
var longest=null, maxEl=null, longestB=null, maxElB=null; for(var i=0;i<A.length;i++){var a=A[i]; if(a.tipo==='running'){if(!longest||a.distanza_m>longest.distanza_m) longest=a; if(!maxEl||(a.dislivello_positivo_m||0)>(maxEl.dislivello_positivo_m||0)) maxEl=a} if(a.tipo==='cycling'){if(!longestB||a.distanza_m>longestB.distanza_m) longestB=a; if(!maxElB||(a.dislivello_positivo_m||0)>(maxElB.dislivello_positivo_m||0)) maxElB=a}}
if(longest) recHtml+='Corsa lunga '+(longest.distanza_m/1000).toFixed(2)+'km<br>'; if(maxEl) recHtml+='Disl corsa '+maxEl.dislivello_positivo_m+'m<br>'; if(longestB) recHtml+='Bici lunga '+(longestB.distanza_m/1000).toFixed(2)+'km<br>';
document.getElementById('rec').innerHTML=recHtml;
var lst=''; for(var i=0;i<Math.min(10,A.length);i++){var a=A[i]; lst+='<div class=r>'+(a.inizio||'').slice(0,10)+' '+a.nome.slice(0,28)+' '+(a.distanza_m/1000).toFixed(2)+'km '+(Math.floor((a.durata_s||0)/60))+'m</div>'}
document.getElementById('lst').innerHTML=lst;
}catch(e){d.textContent='ERRORE: '+e.message+'\n'+e.stack; d.style.display='block';}
})();
</script></body></html>
