name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Install Pillow
        run: pip install Pillow

      - name: Generate project V57.16c - JPG TO PNG FIX
        shell: python
        run: |
          import os, textwrap, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw

          # SEMPRE crea le cartelle mipmap prima di tutto
          sizes = {"mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96, "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192}
          for folder in sizes:
              Path(f"app/src/main/res/{folder}").mkdir(parents=True, exist_ok=True)

          icon_created = False
          # Cerca qualsiasi file icona, anche se estensione sbagliata
          candidates = ["app_icon.png", "app_icon.jpg", "app_icon.jpeg", "app_icon.webp", "icon.png", "icon.jpg", "image_20261015_082447.webp"]
          icon_src = None
          for name in candidates:
              if os.path.exists(name):
                  icon_src = name
                  break

          if icon_src:
              try:
                  print(f"Converting icon: {icon_src} -> real PNGs")
                  # PIL apre JPG anche se chiamato .png
                  im = Image.open(icon_src).convert("RGBA")
                  w,h = im.size
                  side = min(w,h)
                  # crop centro
                  im = im.crop(((w-side)//2, (h-side)//2, (w-side)//2+side, (h-side)//2+side))
                  for folder, size in sizes.items():
                      dest = Path(f"app/src/main/res/{folder}")
                      resized = im.resize((size,size), Image.LANCZOS)
                      # SALVA SEMPRE COME PNG VERO
                      resized.save(dest/"ic_launcher.png", format="PNG")
                      resized.save(dest/"ic_launcher_round.png", format="PNG")
                  icon_created = True
                  print("Custom icon converted to real PNG")
              except Exception as e:
                  print(f"Convert failed: {e}")

          if not icon_created:
              print("Creating default green RAZIEL icon as fallback")
              for folder, size in sizes.items():
                  dest = Path(f"app/src/main/res/{folder}")
                  im = Image.new("RGBA", (size,size), (13, 26, 16, 255))
                  draw = ImageDraw.Draw(im)
                  draw.ellipse([size*0.08, size*0.08, size*0.92, size*0.92], fill=(90, 252, 122, 255))
                  # R stilizzata
                  draw.text((size*0.32, size*0.28), "R", fill=(0,0,0,255))
                  im.save(dest/"ic_launcher.png", format="PNG")
                  im.save(dest/"ic_launcher_round.png", format="PNG")

          os.makedirs("app/src/main/java/com/garminmatrix", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          open("settings.gradle","w").write("include ':app'\n")
          open("local.properties","w").write(f"sdk.dir={os.environ['ANDROID_HOME']}\n")
          open("gradle.properties","w").write("android.useAndroidX=true\n")
          open("build.gradle","w").write(textwrap.dedent('''
            buildscript {
                repositories { google(); mavenCentral() }
                dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
            }
            allprojects { repositories { google(); mavenCentral() } }
          '''))
          open("app/build.gradle","w").write(textwrap.dedent('''
            apply plugin: 'com.android.application'
            android {
                namespace 'com.garminmatrix'
                compileSdk 34
                defaultConfig {
                    applicationId "com.garminmatrix"
                    minSdk 24
                    targetSdk 34
                    versionCode 94
                    versionName "V57.16c-JPG-FIX"
                }
            }
            configurations.all {
                resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
            dependencies {
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation('androidx.webkit:webkit:1.6.1'){
                    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                }
                implementation 'androidx.core:core:1.12.0'
            }
          '''))
          open("app/src/main/res/xml/widget_raziel_info.xml","w").write('<?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="320dp" android:minHeight="420dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>')
          open("app/src/main/res/layout/widget_raziel.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content"><ImageView android:id="@+id/w_full" android:layout_width="match_parent" android:layout_height="wrap_content" android:adjustViewBounds="true"/></LinearLayout>')
          open("app/src/main/res/layout/activity_main.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0d1a0d"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp" android:background="#111f11"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL V57.16c JPG FIX" android:textColor="#5afc7a" android:textStyle="bold"/><TextView android:id="@+id/txt_status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--" android:textColor="#8acf8a"/><TextView android:id="@+id/txt_path" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--" android:textColor="#6b9a6b"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp"><Button android:id="@+id/btn_auto" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="AUTO ONEDRIVE" android:backgroundTint="#00e5ff"/><Button android:id="@+id/btn_import" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="SCEGLI JSON" android:backgroundTint="#5afc7a" android:layout_marginStart="6dp"/></LinearLayout></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>')
          open("app/src/main/AndroidManifest.xml","w").write('<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="RAZIEL" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver><provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.provider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_provider_paths"/></provider></application></manifest>')
          open("app/src/main/res/xml/file_provider_paths.xml","w").write('<?xml version="1.0" encoding="utf-8"?><paths><cache-path name="raziel_cache" path="."/><external-cache-path name="raziel_external_cache" path="."/><files-path name="raziel_files" path="."/></paths>')
          if os.path.exists("index.html"):
              shutil.copyfile("index.html","app/src/main/assets/index.html")
          else:
              open("app/src/main/assets/index.html","w").write("<html><body>RAZIEL V57.16c</body></html>")
          open("app/src/main/java/com/garminmatrix/MainActivity.java","w").write('package com.garminmatrix; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.widget.TextView; import android.content.Intent; import android.content.ComponentName; import android.content.SharedPreferences; import android.appwidget.AppWidgetManager; import android.net.Uri; import android.database.Cursor; import org.json.*; import java.io.*; import androidx.appcompat.app.AppCompatActivity; import androidx.webkit.WebViewAssetLoader; import androidx.core.content.FileProvider; import android.content.ClipData; import android.content.ClipboardManager; public class MainActivity extends AppCompatActivity { WebView wv; TextView st, pathTxt; static final int PICK_JSON=1001; SharedPreferences prefs; @Override protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); wv=findViewById(R.id.webview); st=findViewById(R.id.txt_status); pathTxt=findViewById(R.id.txt_path); prefs=getSharedPreferences("raziel",MODE_PRIVATE); findViewById(R.id.btn_auto).setOnClickListener(v->autoFromSavedUri()); findViewById(R.id.btn_import).setOnClickListener(v->manualImport()); WebSettings s=wv.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); s.setCacheMode(WebSettings.LOAD_NO_CACHE); final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).addPathHandler("/data/", new WebViewAssetLoader.InternalStoragePathHandler(this, getFilesDir())).build(); wv.addJavascriptInterface(new Object(){ @android.webkit.JavascriptInterface public void shareJsonToWhatsApp(String fileName, String jsonContent){ try{ File file=new File(getCacheDir(), fileName); FileWriter w=new FileWriter(file); w.write(jsonContent); w.close(); Uri uri=FileProvider.getUriForFile(MainActivity.this, getPackageName()+".provider", file); Intent intent=new Intent(Intent.ACTION_SEND); intent.setType("application/json"); intent.putExtra(Intent.EXTRA_STREAM, uri); intent.putExtra(Intent.EXTRA_TEXT, "RAZIEL - "+fileName); intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION); startActivity(Intent.createChooser(intent, "Condividi i tuoi allenamenti con...")); }catch(Exception e){ e.printStackTrace(); } } @android.webkit.JavascriptInterface public void shareToMetaAI(String fileName, String jsonContent){ try{ File file=new File(getCacheDir(), fileName); FileWriter fw=new FileWriter(file); fw.write(jsonContent); fw.close(); ClipboardManager cm=(ClipboardManager)getSystemService(CLIPBOARD_SERVICE); cm.setPrimaryClip(ClipData.newPlainText("RAZIEL JSON", jsonContent)); Intent intent=new Intent(Intent.ACTION_SEND); intent.setType("text/plain"); intent.putExtra(Intent.EXTRA_TEXT, jsonContent); intent.putExtra(Intent.EXTRA_SUBJECT, "RAZIEL - "+fileName); Intent chooser=Intent.createChooser(intent, "Interroga Meta AI - JSON copiato negli appunti"); startActivity(chooser); }catch(Exception e){ e.printStackTrace(); } } }, "Android"); wv.setWebViewClient(new androidx.webkit.WebViewClientCompat(){ @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest req){ android.webkit.WebResourceResponse r=loader.shouldInterceptRequest(req.getUrl()); return r!=null?r:super.shouldInterceptRequest(view,req); } @Override public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest request){ String url=request.getUrl().toString(); if(url.startsWith("whatsapp://") || url.startsWith("tg://") || url.startsWith("intent://") || url.startsWith("fb://") || url.startsWith("meta-ai://")){ try{ Intent i=new Intent(Intent.ACTION_VIEW, Uri.parse(url)); startActivity(i); }catch(Exception e){ if(url.startsWith("whatsapp://")){ view.loadUrl(url.replace("whatsapp://", "https://api.whatsapp.com/")); } } return true; } return false; } }); openDash(); String last=prefs.getString("last_uri",null); if(last!=null){ pathTxt.setText("Ultimo: "+prefs.getString("last_name","OneDrive")); wv.postDelayed(()->autoFromSavedUri(),800); } } void openDash(){ wv.clearCache(true); wv.loadUrl("https://appassets.androidplatform.net/assets/index.html?nocache="+System.currentTimeMillis()); } void autoFromSavedUri(){ String uriStr=prefs.getString("last_uri",null); if(uriStr==null){ st.setText("Nessun file salvato - SCEGLI JSON"); return; } try{ Uri uri=Uri.parse(uriStr); try{ getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION); }catch(Exception ignored){} InputStream is=getContentResolver().openInputStream(uri); BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); JSONObject db=new JSONObject(sb.toString()); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); st.setText("AUTO OK basso="+db.optJSONObject("bilancio_carico").optInt("aerobico_basso")); openDash(); updateWidget(); }catch(Exception e){ st.setText("Auto err: "+e.getMessage()); } } void manualImport(){ Intent it=new Intent(Intent.ACTION_OPEN_DOCUMENT); it.addCategory(Intent.CATEGORY_OPENABLE); it.setType("*/*"); it.addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION); startActivityForResult(it,PICK_JSON); } @Override protected void onActivityResult(int rc,int res,Intent data){ super.onActivityResult(rc,res,data); if(rc==PICK_JSON && res==RESULT_OK && data!=null){ Uri uri=data.getData(); try{ getContentResolver().takePersistableUriPermission(uri, data.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION)); InputStream is=getContentResolver().openInputStream(uri); BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); JSONObject db=new JSONObject(sb.toString()); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); String name=getFileName(uri); prefs.edit().putString("last_uri",uri.toString()).putString("last_name",name).apply(); st.setText("SALVATO basso="+db.optJSONObject("bilancio_carico").optInt("aerobico_basso")); pathTxt.setText(name); openDash(); updateWidget(); }catch(Exception e){ st.setText("Import err: "+e.getMessage()); } } } String getFileName(Uri uri){ try{ Cursor c=getContentResolver().query(uri,null,null,null,null); if(c!=null){ if(c.moveToFirst()){ int idx=c.getColumnIndex("_display_name"); if(idx>=0) return c.getString(idx); } c.close(); } return uri.getLastPathSegment(); }catch(Exception e){ return uri.toString(); } } void updateWidget(){ Intent it=new Intent(this,RazielWidgetProvider.class); it.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); it.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(it); } }')
          open("app/src/main/java/com/garminmatrix/RazielWidgetProvider.java","w").write('''
          package com.garminmatrix;
          import android.appwidget.*; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;
          public class RazielWidgetProvider extends AppWidgetProvider {
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){ for(int id:ids) upd(c,m,id); }
              void upd(Context ctx, AppWidgetManager mgr, int wid){
                  RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel);
                  try{
                      JSONObject db=load(ctx);
                      Bitmap bmp = (db==null)? drawNoData() : drawCyber(db);
                      v.setImageViewBitmap(R.id.w_full,bmp);
                      Intent open=new Intent(ctx, MainActivity.class);
                      PendingIntent pi=PendingIntent.getActivity(ctx,0,open,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);
                      v.setOnClickPendingIntent(R.id.w_full,pi);
                  }catch(Exception e){}
                  mgr.updateAppWidget(wid,v);
              }
              JSONObject load(Context ctx) throws Exception{
                  File f=new File(ctx.getFilesDir(),"database.json");
                  if(f.exists() && f.length()>100){
                      FileInputStream fis=new FileInputStream(f);
                      byte[] data=new byte[(int)f.length()];
                      fis.read(data); fis.close();
                      return new JSONObject(new String(data,"UTF-8"));
                  }
                  return null;
              }
              Bitmap drawNoData(){
                  int W=1080, H=1220; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas cv=new Canvas(bmp);
                  Paint bg=new Paint(); bg.setColor(Color.parseColor("#0a1210")); cv.drawRect(0,0,W,H,bg);
                  return bmp;
              }
              Bitmap drawCyber(JSONObject db){
                  int W=1080, H=1220; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas cv=new Canvas(bmp);
                  Paint bg=new Paint(); bg.setColor(Color.parseColor("#0a1210")); cv.drawRect(0,0,W,H,bg);
                  Paint border=new Paint(); border.setColor(Color.parseColor("#5afc7a")); border.setStyle(Paint.Style.STROKE); border.setStrokeWidth(6); cv.drawRoundRect(new android.graphics.RectF(6,6,W-6,H-6),26,26,border);
                  Paint title=new Paint(Paint.ANTI_ALIAS_FLAG); title.setColor(Color.parseColor("#7dff8a")); title.setTextSize(52); title.setFakeBoldText(true);
                  cv.drawText("RAZIEL",44,92,title);
                  return bmp;
              }
          }
          ''')

      - name: Assemble APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAZIEL-V57.16c-JPG-FIX
          path: app/build/outputs/apk/debug/*.apk
