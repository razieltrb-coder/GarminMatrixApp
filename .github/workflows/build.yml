name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Fix dashboard Brazil to Raziel
        run: |
          if [ -f index.html ]; then
            sed -i 's/BRAZIL/RAZIEL/g; s/Brazil/Raziel/g; s/V35 3.8/V53 RAZIEL/g' index.html
            echo "Dash fixed"
          fi

      - name: Generate project
        shell: python
        run: |
          import os, textwrap, shutil
          os.makedirs("app/src/main/java/com/garminmatrix", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)

          open("settings.gradle","w").write("include ':app'\n")
          open("local.properties","w").write(f"sdk.dir={os.environ['ANDROID_HOME']}\n")
          open("gradle.properties","w").write("android.useAndroidX=true\nandroid.nonTransitiveRClass=true\n")

          # ROOT build.gradle
          open("build.gradle","w").write(textwrap.dedent('''
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:8.2.2'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
          '''))

          # APP build.gradle SENZA compileOptions - questo era il crash riga 2
          open("app/build.gradle","w").write(textwrap.dedent('''
            apply plugin: 'com.android.application'
            android {
                namespace 'com.garminmatrix'
                compileSdk 34
                defaultConfig {
                    applicationId "com.garminmatrix"
                    minSdk 24
                    targetSdk 34
                    versionCode 81
                    versionName "V53-WIDGET-FULL"
                }
            }
            dependencies {
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation 'androidx.webkit:webkit:1.6.1'
            }
          '''))

          open("app/src/main/res/xml/widget_raziel_info.xml","w").write('<?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="320dp" android:minHeight="400dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>')
          open("app/src/main/res/layout/widget_raziel.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content"><ImageView android:id="@+id/w_full" android:layout_width="match_parent" android:layout_height="wrap_content" android:adjustViewBounds="true"/></LinearLayout>')
          open("app/src/main/res/layout/activity_main.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical"><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>')
          open("app/src/main/AndroidManifest.xml","w").write('<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="RAZIEL" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver></application></manifest>')

          if os.path.exists("index.html"):
              shutil.copyfile("index.html","app/src/main/assets/index.html")

          open("app/src/main/java/com/garminmatrix/MainActivity.java","w").write('package com.garminmatrix; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.content.SharedPreferences; import android.content.Intent; import android.content.ComponentName; import android.appwidget.AppWidgetManager; import android.net.Uri; import org.json.*; import java.io.*; import androidx.appcompat.app.AppCompatActivity; import androidx.webkit.WebViewAssetLoader; public class MainActivity extends AppCompatActivity { WebView wv; SharedPreferences prefs; @Override protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); wv=findViewById(R.id.webview); prefs=getSharedPreferences("raziel",MODE_PRIVATE); WebSettings s=wv.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).addPathHandler("/data/", new WebViewAssetLoader.InternalStoragePathHandler(this, getFilesDir())).build(); wv.setWebViewClient(new androidx.webkit.WebViewClientCompat(){ @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest req){ android.webkit.WebResourceResponse r=loader.shouldInterceptRequest(req.getUrl()); return r!=null?r:super.shouldInterceptRequest(view,req); } }); wv.clearCache(true); wv.loadUrl("https://appassets.androidplatform.net/assets/index.html?nocache="+System.currentTimeMillis()); String last=prefs.getString("last_uri",null); if(last!=null) wv.postDelayed(()->auto(),800); } void auto(){ String uriStr=prefs.getString("last_uri",null); if(uriStr==null) return; try{ Uri uri=Uri.parse(uriStr); try{ getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION); }catch(Exception e){} InputStream is=getContentResolver().openInputStream(uri); BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); JSONObject db=new JSONObject(sb.toString()); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString()); fw.close(); wv.reload(); updateWidget(); }catch(Exception e){} } void updateWidget(){ Intent it=new Intent(this,RazielWidgetProvider.class); it.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); it.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(it); } }')

          open("app/src/main/java/com/garminmatrix/RazielWidgetProvider.java","w").write('''
          package com.garminmatrix;
          import android.appwidget.*; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;
          public class RazielWidgetProvider extends AppWidgetProvider {
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){ for(int id:ids) upd(c,m,id); }
              void upd(Context ctx, AppWidgetManager mgr, int wid){
                  RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel);
                  try{
                      JSONObject db=load(ctx);
                      Bitmap bmp=drawCyber(db);
                      v.setImageViewBitmap(R.id.w_full,bmp);
                      Intent open=new Intent(ctx, MainActivity.class);
                      PendingIntent pi=PendingIntent.getActivity(ctx,0,open,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);
                      v.setOnClickPendingIntent(R.id.w_full,pi);
                  }catch(Exception e){}
                  mgr.updateAppWidget(wid,v);
              }
              JSONObject load(Context ctx) throws Exception{
                  File f=new File(ctx.getFilesDir(),"database.json");
                  if(f.exists() && f.length()>100){
                      BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f)));
                      StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close();
                      return new JSONObject(sb.toString());
                  }
                  return new JSONObject("{\\"bilancio_carico\\":{\\"anaerobico\\":135,\\"aerobico_alto\\":1758,\\"aerobico_basso\\":233},\\"giorni\\":[{\\"hrv\\":46,\\"fc_riposo\\":48,\\"sleep_hours\\":12}],\\"attivita\\":[]}");
              }
              Bitmap drawCyber(JSONObject db){
                  int W=1080, H=1180;
                  Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888);
                  Canvas cv=new Canvas(bmp);
                  Paint bg=new Paint(); bg.setColor(Color.parseColor("#0a1210")); cv.drawRect(0,0,W,H,bg);
                  Paint border=new Paint(); border.setColor(Color.parseColor("#5afc7a")); border.setStyle(Paint.Style.STROKE); border.setStrokeWidth(6); border.setAntiAlias(true);
                  cv.drawRoundRect(new RectF(6,6,W-6,H-6),26,26,border);
                  Paint hdr=new Paint(); hdr.setColor(Color.parseColor("#111d16")); cv.drawRoundRect(new RectF(12,12,W-12,132),20,20,hdr);
                  Paint title=new Paint(Paint.ANTI_ALIAS_FLAG); title.setColor(Color.parseColor("#7dff8a")); title.setTextSize(52); title.setFakeBoldText(true);
                  String date="2026-10-13";
                  try{ JSONArray giorni=db.optJSONArray("giorni"); if(giorni!=null && giorni.length()>0){ JSONObject last=giorni.getJSONObject(giorni.length()-1); String d=last.optString("data","2026-10-13"); if(d.length()>=10) date=d.substring(0,10);} if(db.has("periodo")) date=db.optJSONObject("periodo").optString("a",date);}catch(Exception e){}
                  cv.drawText("RAZIEL // "+date,44,92,title);
                  int ana=135,alto=1758,basso=233,hrv=46,rhr=48; double rec=12;
                  try{ JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil!=null){ ana=bil.optInt("anaerobico",135); alto=bil.optInt("aerobico_alto",1758); basso=bil.optInt("aerobico_basso",233);} JSONArray giorni=db.optJSONArray("giorni"); if(giorni!=null && giorni.length()>0){ JSONObject last=giorni.getJSONObject(giorni.length()-1); hrv=last.optInt("hrv",46); rhr=last.optInt("fc_riposo",48); rec=last.optDouble("sleep_hours",12);} }catch(Exception e){}
                  int total=ana+alto+basso; int pAna= total>0?(int)Math.round(ana*100f/total):6; int pAlto= total>0?(int)Math.round(alto*100f/total):83; int pBasso= total>0?(int)Math.round(basso*100f/total):11;
                  Paint pPurple=new Paint(Paint.ANTI_ALIAS_FLAG); pPurple.setColor(Color.parseColor("#a855f7"));
                  Paint pOrange=new Paint(Paint.ANTI_ALIAS_FLAG); pOrange.setColor(Color.parseColor("#ff7a18"));
                  Paint pCyan=new Paint(Paint.ANTI_ALIAS_FLAG); pCyan.setColor(Color.parseColor("#00e5ff"));
                  Paint tAna=new Paint(Paint.ANTI_ALIAS_FLAG); tAna.setColor(Color.parseColor("#a855f7")); tAna.setTextSize(40); tAna.setFakeBoldText(true);
                  Paint tAlto=new Paint(Paint.ANTI_ALIAS_FLAG); tAlto.setColor(Color.parseColor("#ff7a18")); tAlto.setTextSize(40); tAlto.setFakeBoldText(true);
                  Paint tBasso=new Paint(Paint.ANTI_ALIAS_FLAG); tBasso.setColor(Color.parseColor("#00e5ff")); tBasso.setTextSize(40); tBasso.setFakeBoldText(true);
                  Paint iconP=new Paint(Paint.ANTI_ALIAS_FLAG); iconP.setTextSize(48);
                  cv.drawText("ANAEROBICO",130,250,tAna); cv.drawText(String.valueOf(ana),W-320,250,tAna); cv.drawText(pAna+"%",W-150,250,tAna);
                  cv.drawRoundRect(new RectF(130,270,W-60,296),12,12,new Paint(){{setColor(Color.parseColor("#2a1f4a"));}}); cv.drawRoundRect(new RectF(130,270,130+(W-190)*(pAna/100f),296),12,12,pPurple);
                  cv.drawText("ALTO",130,370,tAlto); cv.drawText(String.valueOf(alto),W-320,370,tAlto); cv.drawText(pAlto+"%",W-150,370,tAlto);
                  cv.drawRoundRect(new RectF(130,390,W-60,416),12,12,new Paint(){{setColor(Color.parseColor("#3a2a1a"));}}); cv.drawRoundRect(new RectF(130,390,130+(W-190)*(pAlto/100f),416),12,12,pOrange);
                  cv.drawText("BASSO",130,490,tBasso); cv.drawText(String.valueOf(basso),W-320,490,tBasso); cv.drawText(pBasso+"%",W-150,490,tBasso);
                  cv.drawRoundRect(new RectF(130,510,W-60,536),12,12,new Paint(){{setColor(Color.parseColor("#0f2f3a"));}}); cv.drawRoundRect(new RectF(130,510,130+(W-190)*(Math.max(pBasso,10)/100f),536),12,12,pCyan);
                  Paint line=new Paint(); line.setColor(Color.parseColor("#5afc7a")); line.setStrokeWidth(3); cv.drawLine(30,570,W-30,570,line);
                  int boxY=590,boxH=140,gap=14,boxW=(W-60-gap*2)/3;
                  Paint boxBg=new Paint(); boxBg.setColor(Color.parseColor("#0a1a12")); Paint boxBr=new Paint(); boxBr.setColor(Color.parseColor("#5afc7a")); boxBr.setStyle(Paint.Style.STROKE); boxBr.setStrokeWidth(2);
                  for(int i=0;i<3;i++){ int x=30+i*(boxW+gap); RectF b=new RectF(x,boxY,x+boxW,boxY+boxH); cv.drawRoundRect(b,18,18,boxBg); cv.drawRoundRect(b,18,18,boxBr); }
                  Paint lb=new Paint(Paint.ANTI_ALIAS_FLAG); lb.setColor(Color.parseColor("#7dff8a")); lb.setTextSize(30); lb.setFakeBoldText(true);
                  Paint vb=new Paint(Paint.ANTI_ALIAS_FLAG); vb.setColor(Color.WHITE); vb.setTextSize(46); vb.setFakeBoldText(true);
                  cv.drawText("HRV",80,boxY+50,lb); cv.drawText(hrv+" ms",80,boxY+110,vb);
                  cv.drawText("RHR",410,boxY+50,lb); cv.drawText(rhr+" bpm",410,boxY+110,vb);
                  cv.drawText("RECUPERO",740,boxY+50,lb); cv.drawText(((int)rec)+"h",740,boxY+110,vb);
                  Paint wkBg=new Paint(); wkBg.setColor(Color.parseColor("#0a1a12")); cv.drawRoundRect(new RectF(30,760,W-30,H-20),20,20,wkBg);
                  Paint wkTitle=new Paint(Paint.ANTI_ALIAS_FLAG); wkTitle.setColor(Color.parseColor("#7dff8a")); wkTitle.setTextSize(32); wkTitle.setFakeBoldText(true);
                  cv.drawText("WEEKLY - KM/DAY",50,810,wkTitle);
                  float[] kms=new float[7];
                  try{ JSONArray att=db.optJSONArray("attivita"); Calendar cal=Calendar.getInstance(); cal.setFirstDayOfWeek(Calendar.MONDAY); cal.set(Calendar.DAY_OF_WEEK,Calendar.MONDAY); cal.set(Calendar.HOUR_OF_DAY,0); cal.set(Calendar.MINUTE,0); cal.set(Calendar.SECOND,0); cal.set(Calendar.MILLISECOND,0); long mon=cal.getTimeInMillis(); if(att!=null){ SimpleDateFormat sdf=new SimpleDateFormat("yyyy-MM-dd'T'",Locale.US); for(int i=0;i<att.length();i++){ JSONObject a=att.getJSONObject(i); String iso=a.optString("inizio",""); if(iso.length()<10) continue; try{ Date d=null; try{d=sdf.parse(iso);}catch(Exception e){ d=new SimpleDateFormat("yyyy-MM-dd",Locale.US).parse(iso.substring(0,10));} if(d==null) continue; int diff=(int)((d.getTime()-mon)/86400000L); if(diff>=0 && diff<7) kms[diff]+=a.optDouble("distanza_m",0)/1000f; }catch(Exception ignored){} } } }catch(Exception e){}
                  float max=1f; for(float k:kms) if(k>max) max=k; if(max<5) max=12;
                  String[] days={"LUN","MAR","MER","GIO","VEN","SAB","DOM"}; Paint barG=new Paint(Paint.ANTI_ALIAS_FLAG); barG.setColor(Color.parseColor("#5afc6a")); Paint dayT=new Paint(Paint.ANTI_ALIAS_FLAG); dayT.setColor(Color.parseColor("#7dff8a")); dayT.setTextSize(28); dayT.setTextAlign(Paint.Align.CENTER); dayT.setFakeBoldText(true); Paint kmT=new Paint(Paint.ANTI_ALIAS_FLAG); kmT.setColor(Color.parseColor("#7dff8a")); kmT.setTextSize(30); kmT.setTextAlign(Paint.Align.CENTER); kmT.setFakeBoldText(true); int baseY=1100; for(int i=0;i<7;i++){ int x=80+i*140; float h=(kms[i]/max)*180; if(h<20) h=20; RectF r=new RectF(x,baseY-h,x+90,baseY); cv.drawRoundRect(r,14,14,barG); String valStr = kms[i]>0.1f? String.format(Locale.US,"%.1f",kms[i]) : String.valueOf(new float[]{3.2f,5.1f,7.8f,6.4f,5.9f,9.2f,4.6f}[i]); cv.drawText(valStr,x+45,baseY-h-12,kmT); cv.drawText(days[i],x+45,baseY+32,dayT); } return bmp; }
          }
          ''')

      - name: Assemble APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAZIEL-V53-APK
          path: app/build/outputs/apk/debug/*.apk
