name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Generate project
        shell: python
        run: |
          import os
          os.makedirs("app/src/main/java/com/garminmatrix", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          open("settings.gradle","w").write("include ':app'\n")
          open("local.properties","w").write(f"sdk.dir={os.environ['ANDROID_HOME']}\n")
          open("gradle.properties","w").write("android.useAndroidX=true\n")
          open("build.gradle","w").write("buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } } allprojects { repositories { google(); mavenCentral() } }\n")
          open("app/build.gradle","w").write('apply plugin: "com.android.application"\nandroid { namespace "com.garminmatrix"; compileSdk 34; defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 73; versionName "V47-FIX-L18" } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } } dependencies { implementation "androidx.appcompat:appcompat:1.6.1"; implementation "androidx.webkit:webkit:1.6.1" }\n')
          open("app/src/main/res/drawable/bg_main.xml","w").write('<shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"><solid android:color="#0d1a0d"/><stroke android:width="2dp" android:color="#5afc7a"/></shape>')
          open("app/src/main/res/drawable/bg_card.xml","w").write('<shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="10dp"/><solid android:color="#142414"/></shape>')
          open("app/src/main/res/drawable/p_orange.xml","w").write('<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#261a0a"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#ff7a18"/></shape></clip></item></layer-list>')
          open("app/src/main/res/drawable/p_cyan.xml","w").write('<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#0a2222"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#00e5ff"/></shape></clip></item></layer-list>')
          open("app/src/main/res/drawable/p_purple.xml","w").write('<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#1e1430"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#a855f7"/></shape></clip></item></layer-list>')
          open("app/src/main/res/xml/widget_raziel_info.xml","w").write('<?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="300dp" android:minHeight="360dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>')
          open("app/src/main/res/layout/widget_raziel.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_main" android:padding="12dp"><TextView android:id="@+id/w_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL" android:textColor="#7dff8a"/><TextView android:id="@+id/w_updated" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--:--" android:textColor="#6b9a6b"/><TextView android:id="@+id/w_hrv" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="HRV --" android:textColor="#8acf8a"/><ProgressBar android:id="@+id/bar_ana" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:progressDrawable="@drawable/p_purple"/><ProgressBar android:id="@+id/bar_alto" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:progressDrawable="@drawable/p_orange"/><ProgressBar android:id="@+id/bar_basso" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:progressDrawable="@drawable/p_cyan"/><ImageView android:id="@+id/w_chart" android:layout_width="match_parent" android:layout_height="90dp"/></LinearLayout>')
          open("app/src/main/res/layout/activity_main.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0d1a0d"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp" android:background="#111f11"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL V47 FIX L18" android:textColor="#5afc7a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/txt_status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="CLONE 100%" android:textColor="#8acf8a"/><TextView android:id="@+id/txt_path" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--" android:textColor="#6b9a6b"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp"><Button android:id="@+id/btn_auto" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="AUTO ONEDRIVE" android:backgroundTint="#00e5ff"/><Button android:id="@+id/btn_import" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="SCEGLI FILE" android:backgroundTint="#5afc7a" android:layout_marginStart="6dp"/></LinearLayout></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>')
          open("app/src/main/AndroidManifest.xml","w").write('<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="RAZIEL" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver></application></manifest>')
          html = open("index.html","r",encoding="utf-8").read() if os.path.exists("index.html") else ""
          if "BRAZIL" in html or len(html) < 2000:
              html = """<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#080f08;color:#cfe9cf;font-family:monospace;padding:4px}.topbar{display:flex;justify-content:space-between;align-items:center;background:#0a1a0a;border:1px solid #1e4a1e;border-radius:8px;padding:6px 10px;font-size:10px;color:#5afc7a;margin-bottom:6px}.btn{border:1px solid #5afc7a;background:#132913;color:#5afc7a;border-radius:12px;padding:3px 10px;font-size:9px}.section{color:#4dff4d;font-size:10px;font-weight:bold;margin:12px 0 6px 2px}.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:6px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px}.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:6px}.card{background:#0d1e0d;border:1px solid #1a3a1a;border-radius:8px;padding:7px 8px}.card.hdr{font-size:8px;color:#5a8a5a}.card.val{font-size:18px;font-weight:bold;color:#eaffea}.bar{flex:1;height:8px;background:#132913;border-radius:4px;overflow:hidden}.bar div{height:100%}canvas{width:100%;height:84px;display:block;margin-top:4px}.bigchart canvas{height:110px}.act{border-bottom:1px solid #162916;padding:6px 0;display:flex;justify-content:space-between;font-size:10px}</style></head><body><div class="topbar"><div>GARMIN DASHBOARD // RAZ/IL - <span id="t_date">2026-10-12</span></div><div class="btn">Aggiorna dati</div></div><div class="section">Forma & Training Status</div><div class="grid4"><div class="card"><div class="hdr">SOVRACCARICO</div><div class="val" id="v_acwr">1.13</div></div><div class="card"><div class="hdr">PRONTEZZA</div><div class="val" id="v_ready">25</div></div><div class="card"><div class="hdr">BILANCIO CARICO</div><div class="val" id="v_bil">Ottimale</div><div id="v_bil_sub">--</div></div><div class="card"><div class="hdr">VO2_MAX</div><div class="val" id="v_vo2">48</div></div></div><div class="grid2"><div class="card bigchart"><div class="hdr">VO2_MAX - ULTIMI 7 GIORNI</div><canvas id="ch_vo2"></canvas></div><div class="card bigchart"><div class="hdr">BILANCIO DEL CARICO</div><canvas id="ch_bil"></canvas></div></div><div class="card" style="margin-bottom:6px"><div class="hdr" id="bil28_title">BILANCIO DEL CARICO - Ultimi 28 giorni al 2026-10-12</div><div style="display:flex;gap:6px;margin-top:4px"><span style="font-size:9px">Anaerobico</span><div class="bar"><div id="b_ana" style="background:#a855f7;width:10%"></div></div><span id="n_ana">135</span></div><div style="display:flex;gap:6px;margin-top:4px"><span style="font-size:9px">Aerobico alto</span><div class="bar"><div id="b_alto" style="background:#ff7a18;width:90%"></div></div><span id="n_alto">1758</span></div><div style="display:flex;gap:6px;margin-top:4px"><span style="font-size:9px">Aerobico basso</span><div class="bar"><div id="b_basso" style="background:#00e5ff;width:12%"></div></div><span id="n_basso">124</span></div></div><div class="section">Salute & Recovery</div><div class="grid5"><div class="card"><div class="hdr">SLEEP SCORE</div><div class="val" id="v_sleep">57</div></div><div class="card"><div class="hdr">HRV</div><div class="val" id="v_hrv">45 ms</div></div><div class="card"><div class="hdr">FC RIPOSO</div><div class="val" id="v_rhr">50 bpm</div></div><div class="card"><div class="hdr">BODY BATTERY</div><div class="val" id="v_bb">53 / 10</div></div><div class="card"><div class="hdr">STRESS</div><div class="val" id="v_stress">28</div></div></div><div class="grid2"><div class="card"><div class="hdr">SLEEP SCORE - ULTIMI 7</div><canvas id="ch_sleep"></canvas></div><div class="card"><div class="hdr">HRV - ULTIMI 7</div><canvas id="ch_hrv"></canvas></div><div class="card"><div class="hdr">FC A RIPOSO - ULTIMI 7</div><canvas id="ch_rhr"></canvas></div><div class="card"><div class="hdr">STRESS - ULTIMI 7</div><canvas id="ch_str"></canvas></div><div class="card"><div class="hdr">BODY BATTERY MAX - ULTIMI 7</div><canvas id="ch_bb"></canvas></div><div class="card"><div class="hdr">ORE SONNO - ULTIMI 7</div><canvas id="ch_sonno"></canvas></div></div><div class="section">Overview - Volume settimanale</div><div class="grid6"><div class="card"><div class="hdr">CORSA</div><div class="val" style="font-size:14px" id="vol_corsa">3.1h</div></div><div class="card"><div class="hdr">TRAIL RUN</div><div class="val" style="font-size:14px">0h</div></div><div class="card"><div class="hdr">ESCURSIONISMO</div><div class="val" style="font-size:14px">0h</div></div><div class="card"><div class="hdr">BICI</div><div class="val" style="font-size:14px">0h</div></div><div class="card"><div class="hdr">KAYAK</div><div class="val" style="font-size:14px">0h</div></div><div class="card"><div class="hdr">NUOTO</div><div class="val" style="font-size:14px">0h</div></div></div><div class="card"><canvas id="ch_vol" style="height:190px"></canvas></div><div class="section">Distanza & Record</div><div class="grid5"><div class="card"><div class="hdr">KM VELOCE</div><div class="val" style="font-size:12px">4:05</div></div><div class="card"><div class="hdr">5 KM</div><div class="val" style="font-size:12px">31:21</div></div><div class="card"><div class="hdr">10 KM</div><div class="val" style="font-size:12px">57:29</div></div><div class="card"><div class="hdr">MEZZA</div><div class="val" style="font-size:12px">--</div></div><div class="card"><div class="hdr">MARATONA</div><div class="val" style="font-size:12px">--</div></div></div><div class="section">Ultime 10 Attivita</div><div class="card"><div id="acts"></div></div><script>async function load(){try{let db=await (await fetch('https://appassets.androidplatform.net/data/database.json?v='+Date.now())).json();let giorni=db.giorni||[];let last=giorni[giorni.length-1]||{};let last7=giorni.slice(-7);let bil=db.bilancio_carico||{};let ana=bil.anaerobico||135,alto=bil.aerobico_alto||1758,basso=bil.aerobico_basso||124;document.getElementById('t_date').innerText=db.periodo?.a||'2026-10-12';document.getElementById('bil28_title').innerText='BILANCIO DEL CARICO - Ultimi 28 giorni al '+(db.periodo?.a||'2026-10-12');document.getElementById('v_acwr').innerText=last.acwr||1.13;document.getElementById('v_ready').innerText=last.readiness||25;document.getElementById('v_vo2').innerText=last.vo2max||48;document.getElementById('v_sleep').innerText=last.sleep_score||57;document.getElementById('v_hrv').innerText=(last.hrv||45)+' ms';document.getElementById('v_rhr').innerText=(last.fc_riposo||50)+' bpm';document.getElementById('v_bb').innerText=(last.body_battery_max||53)+' / '+(last.body_battery_min||10);document.getElementById('v_stress').innerText=last.stress_avg||28;document.getElementById('n_ana').innerText=ana;document.getElementById('n_alto').innerText=alto;document.getElementById('n_basso').innerText=basso;let maxB=Math.max(ana,alto,basso,1);document.getElementById('b_ana').style.width=(ana/maxB*100)+'%';document.getElementById('b_alto').style.width=(alto/maxB*100)+'%';document.getElementById('b_basso').style.width=(basso/maxB*100)+'%';document.getElementById('v_bil_sub').innerText=ana+'/'+alto+'/'+basso;function scale(c){let dpr=2;c.width=c.clientWidth*dpr;c.height=c.clientHeight*dpr;return c.getContext('2d');}function drawLine(id,vals,col){let c=document.getElementById(id);if(!c)return;let ctx=scale(c);let W=c.width,H=c.height;ctx.clearRect(0,0,W,H);let max=Math.max(...vals,1),min=Math.min(...vals);if(max==min)max=min+5;ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();vals.forEach((v,i)=>{let x=20+i*(W-40)/(vals.length-1||1);let y=H-20-(v-min)/(max-min||1)*(H-40);if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}function drawBar(id,vals,col){let c=document.getElementById(id);if(!c)return;let ctx=scale(c);let W=c.width,H=c.height;ctx.clearRect(0,0,W,H);let max=Math.max(...vals,1);vals.forEach((v,i)=>{let bw=(W-30)/vals.length-4;let x=15+i*(bw+4);let h=(v/max)*(H-30);ctx.fillStyle=col;ctx.fillRect(x,H-20-h,bw,h);});}drawLine('ch_vo2',last7.map(g=>g.vo2max||48),'#44ff44');(function(){let c=document.getElementById('ch_bil');let ctx=scale(c);let W=c.width,H=c.height;ctx.clearRect(0,0,W,H);ctx.fillStyle='#44ff44';ctx.fillRect(W*0.15,H*0.3,W*0.2,H*0.5);ctx.fillStyle='#44ddff';ctx.fillRect(W*0.6,H*0.1,W*0.25,H*0.7);})();drawBar('ch_sleep',last7.map(g=>g.sleep_score||60),'#ffcc00');drawLine('ch_hrv',last7.map(g=>g.hrv||40),'#44ff44');drawLine('ch_rhr',last7.map(g=>g.fc_riposo||43),'#ff4444');drawLine('ch_str',last7.map(g=>g.stress_avg||20),'#ff8800');drawLine('ch_bb',last7.map(g=>g.body_battery_max||60),'#44ff44');drawBar('ch_sonno',last7.map(g=>g.sleep_hours||6),'#aa88ff');(function(){let c=document.getElementById('ch_vol');let ctx=scale(c);let W=c.width,H=c.height;ctx.clearRect(0,0,W,H);let att=db.attivita||[];let map={};att.forEach(a=>{let key=(a.inizio||'').slice(0,10);if(!map[key])map[key]={corsa:0};map[key].corsa+=(a.durata_s||0)/60;});let keys=Object.keys(map).slice(-11);let maxV=50;keys.forEach((k,i)=>{let x=15+i*(W-20)/keys.length;let h=(map[k].corsa/maxV)*(H-30);ctx.fillStyle='#ff4444';ctx.fillRect(x,H-20-h,4,h);});})();let acts=db.attivita||[];document.getElementById('acts').innerHTML=acts.slice(0,10).map(a=>'<div class="act"><div>🏃 '+(a.inizio||'').slice(5,10)+' - '+a.nome+'</div><div>'+(a.distanza_m/1000).toFixed(2)+'km</div></div>').join('');let totH=0;att=acts;att.forEach(a=>{if((a.inizio||'').slice(0,10)>=new Date(Date.now()-7*86400000).toISOString().slice(0,10)) totH+=(a.durata_s||0)/3600;});document.getElementById('vol_corsa').innerText=totH.toFixed(1)+'h';}catch(e){document.body.innerHTML+='<div style=color:red>'+e.message+'</div>';}}load();</script></body></html>"""
          open("app/src/main/assets/index.html","w",encoding="utf-8").write(html)
          open("app/src/main/java/com/garminmatrix/MainActivity.java","w").write('package com.garminmatrix;\nimport android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.webkit.WebChromeClient; import android.webkit.WebResourceRequest; import android.widget.TextView; import android.content.Intent; import android.content.ComponentName; import android.content.SharedPreferences; import android.appwidget.AppWidgetManager; import android.net.Uri; import android.provider.DocumentsContract; import android.database.Cursor; import org.json.*; import java.io.*; import androidx.appcompat.app.AppCompatActivity; import androidx.webkit.WebViewAssetLoader;\npublic class MainActivity extends AppCompatActivity {\nWebView wv; TextView st, pathTxt; static final int PICK_JSON=1001; SharedPreferences prefs;\n@Override protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); wv=findViewById(R.id.webview); st=findViewById(R.id.txt_status); pathTxt=findViewById(R.id.txt_path); prefs=getSharedPreferences("raziel",MODE_PRIVATE); findViewById(R.id.btn_auto).setOnClickListener(v->autoFromSavedUri()); findViewById(R.id.btn_import).setOnClickListener(v->manualImport()); WebSettings s=wv.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); s.setCacheMode(WebSettings.LOAD_NO_CACHE); final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).addPathHandler("/data/", new WebViewAssetLoader.InternalStoragePathHandler(this, getFilesDir())).build(); wv.setWebViewClient(new androidx.webkit.WebViewClientCompat(){ @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req){ android.webkit.WebResourceResponse r=loader.shouldInterceptRequest(req.getUrl()); if(r!=null) return r; return super.shouldInterceptRequest(view,req); } }); wv.setWebChromeClient(new WebChromeClient()); openDash(); String last=prefs.getString("last_uri",null); if(last!=null){ pathTxt.setText("Ultimo: "+prefs.getString("last_name","OneDrive")); wv.postDelayed(()->autoFromSavedUri(),800); } }\nvoid openDash(){ wv.clearCache(true); wv.loadUrl("https://appassets.androidplatform.net/assets/index.html?nocache="+System.currentTimeMillis()); }\nvoid autoFromSavedUri(){ String uriStr=prefs.getString("last_uri",null); if(uriStr==null){ st.setText("Nessun file salvato - premi SCEGLI FILE"); return; } try{ Uri uri=Uri.parse(uriStr); try{ getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION); }catch(Exception ignored){} InputStream is=getContentResolver().openInputStream(uri); if(is==null){ st.setText("OneDrive non raggiungibile"); return; } BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); String json=sb.toString(); JSONObject db=new JSONObject(json); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); st.setText("AUTO OK: "+db.optJSONArray("attivita").length()+" att + "+db.optJSONArray("giorni").length()+" gg da OneDrive"); pathTxt.setText("Auto da: "+prefs.getString("last_name","OneDrive")+" - "+(json.length()/1024)+"KB"); openDash(); updateWidget(); }catch(Exception e){ st.setText("Auto err: "+e.getMessage()); } }\nvoid manualImport(){ Intent it=new Intent(Intent.ACTION_OPEN_DOCUMENT); it.addCategory(Intent.CATEGORY_OPENABLE); it.setType("*/*"); it.addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION); startActivityForResult(it,PICK_JSON); }\n@Override protected void onActivityResult(int rc,int res,Intent data){ super.onActivityResult(rc,res,data); if(rc==PICK_JSON && res==RESULT_OK && data!=null){ Uri uri=data.getData(); try{ final int takeFlags=data.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION); getContentResolver().takePersistableUriPermission(uri, takeFlags); InputStream is=getContentResolver().openInputStream(uri); BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); String json=sb.toString(); JSONObject db=new JSONObject(json); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); String name=getFileName(uri); prefs.edit().putString("last_uri",uri.toString()).putString("last_name",name).apply(); st.setText("SALVATO: "+db.optJSONArray("attivita").length()+" att - ora auto"); pathTxt.setText("Salvato: "+name); openDash(); updateWidget(); }catch(Exception e){ st.setText("Import err: "+e.getMessage()); } } }\nString getFileName(Uri uri){ try{ String name=null; if("content".equals(uri.getScheme())){ Cursor c=getContentResolver().query(uri,null,null,null,null); if(c!=null){ if(c.moveToFirst()){ int idx=c.getColumnIndex(DocumentsContract.Document.COLUMN_DISPLAY_NAME); if(idx>=0) name=c.getString(idx); } c.close(); } } if(name==null) name=uri.getLastPathSegment(); return name; }catch(Exception e){ return uri.toString(); } }\nvoid updateWidget(){ Intent it=new Intent(this,RazielWidgetProvider.class); it.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); it.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(it); } }\n')
          open("app/src/main/java/com/garminmatrix/RazielWidgetProvider.java","w").write('package com.garminmatrix;\nimport android.appwidget.*; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;\npublic class RazielWidgetProvider extends AppWidgetProvider { @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){for(int id:ids) upd(c,m,id);} void upd(Context ctx, AppWidgetManager mgr, int wid){ RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel); try{ JSONObject db=load(ctx); SimpleDateFormat tf=new SimpleDateFormat("HH:mm",Locale.US); v.setTextViewText(R.id.w_updated,"SYNC "+tf.format(new Date())); JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil!=null){ v.setProgressBar(R.id.bar_ana,2000,Math.min(bil.optInt("anaerobico",0),2000),false); v.setProgressBar(R.id.bar_alto,2000,Math.min(bil.optInt("aerobico_alto",0),2000),false); v.setProgressBar(R.id.bar_basso,500,Math.min(bil.optInt("aerobico_basso",0),500),false); } }catch(Exception e){} mgr.updateAppWidget(wid,v); } JSONObject load(Context ctx) throws Exception{File f=new File(ctx.getFilesDir(),"database.json"); StringBuilder sb=new StringBuilder(); if(f.exists()){BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());} else return new JSONObject("{}");} Bitmap chart(JSONArray att){int W=700,H=90; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas c=new Canvas(bmp); c.drawColor(0); return bmp;} }\n')

