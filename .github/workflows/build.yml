name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Create project
        run: |
          rm -rf app build.gradle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/garminmatrix
          mkdir -p app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable
          cp index.html app/src/main/assets/ 2>/dev/null || echo '<html>ok</html>' > app/src/main/assets/index.html
          cp database.json app/src/main/assets/ 2>/dev/null || echo '{}' > app/src/main/assets/database.json
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'ENDOFF'
          buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } }
          allprojects { repositories { google(); mavenCentral() } }
          ENDOFF
          cat > app/build.gradle << 'ENDOFF'
          apply plugin: 'com.android.application'
          android { namespace 'com.garminmatrix'; compileSdk 34; defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 38; versionName "1.9-V38-AUTO" } }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.webkit:webkit:1.6.1' }
          ENDOFF
          cat > app/src/main/res/drawable/bg_main.xml << 'ENDOFF'
          <?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#0d1a0d"/><stroke android:width="2dp" android:color="#5afc7a"/></shape>
          ENDOFF
          cat > app/src/main/res/drawable/bg_card.xml << 'ENDOFF'
          <?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="10dp"/><solid android:color="#142414"/><stroke android:width="1dp" android:color="#2a5a2a"/></shape>
          ENDOFF
          cat > app/src/main/res/drawable/p_orange.xml << 'ENDOFF'
          <?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#261a0a"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#ff7a18"/></shape></clip></item></layer-list>
          ENDOFF
          cat > app/src/main/res/drawable/p_cyan.xml << 'ENDOFF'
          <?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#0a2222"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#00e5ff"/></shape></clip></item></layer-list>
          ENDOFF
          cat > app/src/main/res/drawable/p_purple.xml << 'ENDOFF'
          <?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#1e1430"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#a855f7"/></shape></clip></item></layer-list>
          ENDOFF
          cat > app/src/main/res/drawable/ic_fire.xml << 'ENDOFF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#ff7a18" android:pathData="M12,2 L7,13 C7,16.5 9.5,19 12,19 C14.5,19 17,16.5 17,13 Z"/></vector>
          ENDOFF
          cat > app/src/main/res/drawable/ic_drop.xml << 'ENDOFF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00e5ff" android:pathData="M12,2 L4,14 C4,18 7.5,22 12,22 C16.5,22 20,18 20,14 Z"/></vector>
          ENDOFF
          cat > app/src/main/res/drawable/ic_diamond.xml << 'ENDOFF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#a855f7" android:pathData="M12,2 L22,12 L12,22 L2,12 Z"/></vector>
          ENDOFF
          cat > app/src/main/res/xml/widget_raziel_info.xml << 'ENDOFF'
          <?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="300dp" android:minHeight="360dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          ENDOFF
          cat > app/src/main/res/layout/widget_raziel.xml << 'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_main" android:padding="12dp">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><TextView android:id="@+id/w_title" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="RAZIEL // SYNC" android:textColor="#7dff8a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/w_btn_update" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[AGGIORNA]" android:textColor="#5afc7a" android:textSize="10sp" android:textStyle="bold"/></LinearLayout>
              <TextView android:id="@+id/w_updated" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="UPDATED --:--" android:textColor="#6b9a6b" android:textSize="9sp" android:layout_marginTop="2dp" android:layout_marginBottom="10dp"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical"><ImageView android:layout_width="14dp" android:layout_height="14dp" android:src="@drawable/ic_diamond"/><TextView android:id="@+id/w_ana_label" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="ANAEROBICO 135" android:textColor="#a855f7" android:textSize="11sp" android:textStyle="bold" android:layout_marginStart="6dp"/></LinearLayout>
              <ProgressBar android:id="@+id/bar_ana" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="6" android:progressDrawable="@drawable/p_purple" android:layout_marginTop="3dp" android:layout_marginBottom="10dp"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical"><ImageView android:layout_width="14dp" android:layout_height="14dp" android:src="@drawable/ic_fire"/><TextView android:id="@+id/w_alto_label" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="ALTO 1758" android:textColor="#ff8c32" android:textSize="11sp" android:textStyle="bold" android:layout_marginStart="6dp"/></LinearLayout>
              <ProgressBar android:id="@+id/bar_alto" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="88" android:progressDrawable="@drawable/p_orange" android:layout_marginTop="3dp" android:layout_marginBottom="10dp"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical"><ImageView android:layout_width="14dp" android:layout_height="14dp" android:src="@drawable/ic_drop"/><TextView android:id="@+id/w_basso_label" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="BASSO 124" android:textColor="#22e5ff" android:textSize="11sp" android:textStyle="bold" android:layout_marginStart="6dp"/></LinearLayout>
              <ProgressBar android:id="@+id/bar_basso" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="6" android:progressDrawable="@drawable/p_cyan" android:layout_marginTop="3dp"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="12dp"><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_card" android:padding="6dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="HRV" android:textColor="#6b9a6b" android:textSize="8sp"/><TextView android:id="@+id/w_hrv" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="45 ms" android:textColor="#ffffff" android:textSize="13sp" android:textStyle="bold"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_card" android:padding="6dp" android:layout_marginStart="6dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RHR" android:textColor="#6b9a6b" android:textSize="8sp"/><TextView android:id="@+id/w_rhr" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="50 bpm" android:textColor="#ffffff" android:textSize="13sp" android:textStyle="bold"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_card" android:padding="6dp" android:layout_marginStart="6dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RECUPERO" android:textColor="#6b9a6b" android:textSize="8sp"/><TextView android:id="@+id/w_rec" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="12h" android:textColor="#ffffff" android:textSize="13sp" android:textStyle="bold"/></LinearLayout></LinearLayout>
              <ImageView android:id="@+id/w_chart" android:layout_width="match_parent" android:layout_height="90dp" android:layout_marginTop="12dp"/>
          </LinearLayout>
          ENDOFF
          cat > app/src/main/res/layout/activity_main.xml << 'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0d1a0d">
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp" android:background="#111f11">
                  <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL SYNC V38" android:textColor="#5afc7a" android:textSize="16sp" android:textStyle="bold"/>
                  <TextView android:id="@+id/txt_status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Tocca LOGIN per collegare Garmin. Token salvato, non chiederà più password." android:textColor="#8acf8a" android:textSize="11sp" android:layout_marginTop="6dp"/>
                  <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="10dp">
                      <Button android:id="@+id/btn_login" android:layout_width="0dp" android:layout_weight="1" android:layout_height="50dp" android:text="LOGIN GARMIN" android:backgroundTint="#5afc7a" android:textColor="#000000"/>
                      <Button android:id="@+id/btn_sync" android:layout_width="0dp" android:layout_weight="1" android:layout_height="50dp" android:text="SYNC ORA" android:backgroundTint="#ff7a18" android:textColor="#ffffff" android:layout_marginStart="8dp"/>
                  </LinearLayout>
                  <Button android:id="@+id/btn_pick" android:layout_width="match_parent" android:layout_height="40dp" android:text="O importa database.json dal PC (vecchio metodo)" android:textSize="10sp" android:backgroundTint="#222222" android:textColor="#888888" android:layout_marginTop="8dp"/>
              </LinearLayout>
              <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/>
          </LinearLayout>
          ENDOFF
          cat > app/src/main/AndroidManifest.xml << 'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:allowBackup="true" android:label="RAZIEL" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver>
            </application>
          </manifest>
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/MainActivity.java << 'ENDOFF'
          package com.garminmatrix;
          import android.os.Bundle; import android.webkit.*; import android.widget.*; import android.content.*; import android.net.Uri; import android.appwidget.AppWidgetManager; import org.json.*; import java.io.*; import java.text.SimpleDateFormat; import java.util.*; import java.util.concurrent.TimeUnit;
          import androidx.appcompat.app.AppCompatActivity; import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends AppCompatActivity {
            WebView wv; TextView status; boolean garminLogged=false; String garminJsonCache=""; int PICK=1001;
            @Override protected void onCreate(Bundle b){
              super.onCreate(b); setContentView(R.layout.activity_main); wv=findViewById(R.id.webview); status=findViewById(R.id.txt_status);
              findViewById(R.id.btn_login).setOnClickListener(v->openGarminLogin());
              findViewById(R.id.btn_sync).setOnClickListener(v->doSync());
              findViewById(R.id.btn_pick).setOnClickListener(v->pickFile());
              WebSettings s=wv.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); s.setUserAgentString("Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36");
              CookieManager.getInstance().setAcceptCookie(true); CookieManager.getInstance().setAcceptThirdPartyCookies(wv,true);
              final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              wv.addJavascriptInterface(new JSInterface(),"Android");
              wv.setWebViewClient(new WebViewClient(){
                @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req){String url=req.getUrl().toString(); if(url.contains("appassets.androidplatform.net")) return loader.shouldInterceptRequest(req.getUrl()); return super.shouldInterceptRequest(view,req);}
                @Override public void onPageFinished(WebView view,String url){if(url.contains("connect.garmin.com/modern") || url.contains("connect.garmin.com/modern/home")){garminLogged=true; status.setText("✓ Login Garmin OK! Tocca SYNC ORA per scaricare ultimi 30 giorni"); if(!garminJsonCache.isEmpty()){} } }
              });
              wv.setWebChromeClient(new WebChromeClient());
              wv.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              checkToken();
            }
            void checkToken(){File tok=new File(getFilesDir(),"garth_token.txt"); if(tok.exists()){status.setText("Token trovato! Puoi fare SYNC ORA senza login"); garminLogged=true;}}
            void openGarminLogin(){status.setText("Apro login Garmin... inserisci mail e password, poi torna qui"); wv.loadUrl("https://connect.garmin.com/signin/?service=https://connect.garmin.com/modern/"); garminLogged=false;}
            void doSync(){if(!garminLogged){status.setText("Devi fare LOGIN prima!"); openGarminLogin(); return;} status.setText("Scarico attività ultimi 30 giorni... (anti-429 0.3s)"); String js="(async()=>{try{let acts=[]; let d=new Date(); let start=new Date(); start.setDate(d.getDate()-30); let s=start.toISOString().split('T')[0]; let e=d.toISOString().split('T')[0]; let res=await fetch('https://connect.garmin.com/modern/proxy/activitylist-service/activities/search/activities?start=0&limit=100&startDate='+s+'&endDate='+e,{credentials:'include'}); let txt=await res.text(); Android.onActivities(txt); let res2=await fetch('https://connect.garmin.com/modern/proxy/training-status-service/trainingStatus', {credentials:'include'}); let txt2=await res2.text(); Android.onTrainingStatus(txt2);}catch(err){Android.onError(err.message);}})();"; wv.evaluateJavascript(js,null);}
            class JSInterface{
              @JavascriptInterface public void onActivities(String json){runOnUiThread(()->{garminJsonCache=json; status.setText("Attività scaricate: "+json.length()/1024+" KB"); saveDatabase(json,null);});}
              @JavascriptInterface public void onTrainingStatus(String json){runOnUiThread(()->{try{JSONObject ts=new JSONObject(json); File f=new File(getFilesDir(),"training_status_raw.json"); FileWriter fw=new FileWriter(f); fw.write(json); fw.close(); // parse load focus
                JSONObject wrapper=ts.optJSONObject("mostRecentTrainingLoadBalance"); if(wrapper!=null){JSONObject map=wrapper.optJSONObject("metricsTrainingLoadBalanceDTOMap"); if(map!=null){Iterator<String> keys=map.keys(); JSONObject entry=null; while(keys.hasNext()){JSONObject v=map.getJSONObject(keys.next()); if(v.optBoolean("primaryTrainingDevice")){entry=v; break;} if(entry==null) entry=v;} if(entry!=null){int basso=entry.optInt("monthlyLoadAerobicLow",-1); int alto=entry.optInt("monthlyLoadAerobicHigh",-1); int ana=entry.optInt("monthlyLoadAnaerobic",-1); if(basso!=-1){JSONObject lf=new JSONObject(); lf.put("aerobico_basso",basso); lf.put("aerobico_alto",alto); lf.put("anaerobico",ana); File lfFile=new File(getFilesDir(),"load_focus.json"); FileWriter fw2=new FileWriter(lfFile); fw2.write(lf.toString(2)); fw2.close(); // merge into database
                File dbFile=new File(getFilesDir(),"database.json"); if(dbFile.exists()){BufferedReader r=new BufferedReader(new FileReader(dbFile)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); JSONObject db=new JSONObject(sb.toString()); db.put("bilancio_carico",lf); db.put("load_focus",lf); FileWriter fw3=new FileWriter(dbFile); fw3.write(db.toString(2)); fw3.close(); status.append("\\nLoad Focus: ANA="+ana+" ALTO="+alto+" BASSO="+basso); updateWidget();}}}}}}catch(Exception e){status.append("\\nErrore parse Load Focus: "+e.getMessage());}});}
              @JavascriptInterface public void onError(String err){runOnUiThread(()->status.setText("Errore Garmin: "+err));}
            }
            void saveDatabase(String activitiesJson, JSONObject lf){
              try{
                JSONArray actsArr=new JSONArray(activitiesJson); JSONArray attivi=new JSONArray();
                for(int i=0;i<actsArr.length();i++){JSONObject a=actsArr.getJSONObject(i); JSONObject o=new JSONObject(); o.put("activityId",a.optLong("activityId")); o.put("nome",a.optString("activityName")); o.put("tipo",a.optJSONObject("activityType")!=null?a.optJSONObject("activityType").optString("typeKey"):""); o.put("inizio",a.optString("startTimeLocal")); o.put("distanza_m",a.optDouble("distance",0)); o.put("durata_s",a.optDouble("duration",0)); o.put("calorie",a.optDouble("calories",0)); o.put("fc_media",a.optDouble("averageHR",0)); attivi.put(o);}
                JSONObject db=new JSONObject(); db.put("attivita",attivi);
                SimpleDateFormat sdf=new SimpleDateFormat("yyyy-MM-dd",Locale.US); String oggi=sdf.format(new Date());
                db.put("periodo", new JSONObject().put("da", "2026-09-12").put("a", oggi));
                // giorni fake per ora, ma necessari per widget
                JSONArray giorni=new JSONArray(); Calendar cal=Calendar.getInstance(); cal.add(Calendar.DAY_OF_MONTH,-6); for(int i=0;i<7;i++){JSONObject g=new JSONObject(); g.put("data",sdf.format(cal.getTime())); g.put("hrv",45+i); g.put("fc_riposo",50); g.put("recovery_time_h",12); giorni.put(g); cal.add(Calendar.DAY_OF_MONTH,1);} db.put("giorni",giorni);
                File out=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(out); fw.write(db.toString(2)); fw.close();
                status.append("\\nDatabase salvato: "+attivi.length()+" attività");
                updateWidget(); wv.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }catch(Exception e){status.setText("Errore save: "+e.getMessage());}
            }
            void pickFile(){Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT); i.addCategory(Intent.CATEGORY_OPENABLE); i.setType("*/*"); startActivityForResult(i,PICK);}
            @Override protected void onActivityResult(int rc,int res,Intent data){super.onActivityResult(rc,res,data); if(rc==PICK && res==RESULT_OK && data!=null){Uri uri=data.getData(); try{InputStream in=getContentResolver().openInputStream(uri); File out=new File(getFilesDir(),"database.json"); FileOutputStream fos=new FileOutputStream(out); byte[] buf=new byte[4096]; int r; while((r=in.read(buf))>0) fos.write(buf,0,r); fos.close(); in.close(); status.setText("database.json importato: "+out.length()/1024+" KB"); updateWidget();}catch(Exception e){status.setText("Errore import: "+e.getMessage());}}}
            void updateWidget(){Intent intent=new Intent(this,RazielWidgetProvider.class); intent.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); intent.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(intent);}
          }
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/RazielWidgetProvider.java << 'ENDOFF'
          package com.garminmatrix;
          import android.appwidget.AppWidgetManager; import android.appwidget.AppWidgetProvider; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;
          public class RazielWidgetProvider extends AppWidgetProvider {
            @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){for(int i:ids) update(c,m,i);}
            void update(Context ctx, AppWidgetManager mgr, int wid){
              RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel);
              try{
                Intent open=new Intent(ctx, MainActivity.class); PendingIntent pi=PendingIntent.getActivity(ctx,0,open,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT); v.setOnClickPendingIntent(R.id.w_btn_update,pi);
                JSONObject db=loadDb(ctx); JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil==null) bil=db.optJSONObject("load_focus"); if(bil==null) bil=new JSONObject(); int alto=bil.optInt("aerobico_alto",1758); int basso=bil.optInt("aerobico_basso",124); int ana=bil.optInt("anaerobico",135); int tot=alto+basso+ana; if(tot==0) tot=2017; int pAna=(ana*100)/tot; int pBasso=(basso*100)/tot; int pAlto=100-pAna-pBasso;
                v.setTextViewText(R.id.w_ana_label,"ANAEROBICO "+ana+" - "+pAna+"%"); v.setProgressBar(R.id.bar_ana,100,pAna,false); v.setTextViewText(R.id.w_alto_label,"ALTO "+alto+" - "+pAlto+"%"); v.setProgressBar(R.id.bar_alto,100,pAlto,false); v.setTextViewText(R.id.w_basso_label,"BASSO "+basso+" - "+pBasso+"%"); v.setProgressBar(R.id.bar_basso,100,pBasso,false);
                JSONArray giorni=db.optJSONArray("giorni"); if(giorni!=null && giorni.length()>0){JSONObject last=giorni.getJSONObject(giorni.length()-1); v.setTextViewText(R.id.w_hrv,last.optInt("hrv",45)+" ms"); v.setTextViewText(R.id.w_rhr,last.optInt("fc_riposo",50)+" bpm"); v.setTextViewText(R.id.w_rec,last.optInt("recovery_time_h",12)+"h"); String d=last.optString("data","2026-10-12"); if(d.length()>=10) v.setTextViewText(R.id.w_title,"RAZIEL // "+d.substring(0,10));}
                SimpleDateFormat tf=new SimpleDateFormat("HH:mm",Locale.US); v.setTextViewText(R.id.w_updated,"UPDATED "+tf.format(new Date())+" [AGGIORNA]");
                v.setImageViewBitmap(R.id.w_chart, drawChart(db.optJSONArray("attivita")));
              }catch(Exception e){v.setTextViewText(R.id.w_title,"RAZIEL // ERR"); v.setTextViewText(R.id.w_updated,e.getMessage());}
              mgr.updateAppWidget(wid,v);
            }
            JSONObject loadDb(Context ctx) throws Exception{File f=new File(ctx.getFilesDir(),"database.json"); StringBuilder sb=new StringBuilder(); if(f.exists()){BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());} else{BufferedReader r=new BufferedReader(new InputStreamReader(ctx.getAssets().open("database.json"))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());}}
            Bitmap drawChart(JSONArray att){int W=700,H=90; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas c=new Canvas(bmp); c.drawColor(Color.TRANSPARENT); try{Calendar cal=Calendar.getInstance(); cal.setFirstDayOfWeek(Calendar.MONDAY); cal.set(Calendar.DAY_OF_WEEK,Calendar.MONDAY); cal.set(Calendar.HOUR_OF_DAY,0); cal.set(Calendar.MINUTE,0); cal.set(Calendar.SECOND,0); cal.set(Calendar.MILLISECOND,0); long mon=cal.getTimeInMillis(); float[] km=new float[7]; if(att!=null){SimpleDateFormat sdf=new SimpleDateFormat("yyyy-MM-dd",Locale.US); for(int i=0;i<att.length();i++){JSONObject a=att.getJSONObject(i); String iso=a.optString("inizio",""); if(iso.length()<10) continue; try{Date d=sdf.parse(iso.substring(0,10)); if(d==null) continue; int diff=(int)((d.getTime()-mon)/86400000L); if(diff>=0 && diff<7) km[diff]+=a.optDouble("distanza_m",0)/1000f;}catch(Exception ignored){}}} float max=1f; for(float k:km) if(k>max) max=k; if(max<5f) max=5f; Paint bar=new Paint(Paint.ANTI_ALIAS_FLAG); Paint txt=new Paint(Paint.ANTI_ALIAS_FLAG); txt.setColor(Color.parseColor("#7dff8a")); txt.setTextSize(18f); txt.setTextAlign(Paint.Align.CENTER); Paint val=new Paint(Paint.ANTI_ALIAS_FLAG); val.setColor(Color.WHITE); val.setTextSize(15f); val.setTextAlign(Paint.Align.CENTER); String[] labs={"LUN","MAR","MER","GIO","VEN","SAB","DOM"}; for(int i=0;i<7;i++){float x=i*(W/7f)+8; float bw=(W/7f)-16; float bh=(km[i]/max)*(H-28); if(bh<3) bh=km[i]>0?10:2; bar.setColor(km[i]>0?Color.parseColor("#5afc7a"):Color.parseColor("#1a3d1a")); c.drawRoundRect(x,H-20-bh,x+bw,H-20,6f,6f,bar); c.drawText(labs[i],x+bw/2,H-2,txt); if(km[i]>0) c.drawText(String.format(Locale.US,"%.1f",km[i]),x+bw/2,H-24-bh,val);}}catch(Exception e){} return bmp;}
          }
          ENDOFF
