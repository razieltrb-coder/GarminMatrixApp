name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Fix dashboard Brazil to Raziel
        run: |
          if [ -f index.html ]; then
            sed -i 's/BRAZIL/RAZIEL/g; s/Brazil/Raziel/g; s/BRASIL/RAZIEL/g; s/V35 3.8/V51 RAZIEL/g' index.html
            echo "Fixed Brazil->Raziel in index.html"
            head -n 20 index.html
          fi

      - name: Generate project
        shell: python
        run: |
          import os, textwrap, shutil
          os.makedirs("app/src/main/java/com/garminmatrix", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)

          open("settings.gradle","w").write("include ':app'\n")
          open("local.properties","w").write(f"sdk.dir={os.environ['ANDROID_HOME']}\n")
          open("gradle.properties","w").write("android.useAndroidX=true\nandroid.nonTransitiveRClass=true\n")

          open("build.gradle","w").write(textwrap.dedent('''
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:8.2.2'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
          '''))

          # QUI IL FIX: torno a apply plugin che funziona
          open("app/build.gradle","w").write(textwrap.dedent('''
            apply plugin: 'com.android.application'
            android {
                namespace 'com.garminmatrix'
                compileSdk 34
                defaultConfig {
                    applicationId "com.garminmatrix"
                    minSdk 24
                    targetSdk 34
                    versionCode 79
                    versionName "V51-FIX-BUILD"
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
            dependencies {
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation 'androidx.webkit:webkit:1.6.1'
            }
          '''))

          open("app/src/main/res/drawable/bg_main.xml","w").write('<shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#0d1a0d"/><stroke android:width="2dp" android:color="#5afc7a"/></shape>')
          open("app/src/main/res/xml/widget_raziel_info.xml","w").write('<?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="320dp" android:minHeight="320dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>')
          open("app/src/main/res/layout/widget_raziel.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="#00000000"><ImageView android:id="@+id/w_full" android:layout_width="match_parent" android:layout_height="wrap_content" android:adjustViewBounds="true"/></LinearLayout>')
          open("app/src/main/res/layout/activity_main.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0d1a0d"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp" android:background="#111f11"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL V51" android:textColor="#5afc7a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/txt_status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--" android:textColor="#8acf8a"/><TextView android:id="@+id/txt_path" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--" android:textColor="#6b9a6b"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp"><Button android:id="@+id/btn_auto" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="AUTO ONEDRIVE" android:backgroundTint="#00e5ff"/><Button android:id="@+id/btn_import" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="SCEGLI FILE" android:backgroundTint="#5afc7a" android:layout_marginStart="6dp"/></LinearLayout></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>')
          open("app/src/main/AndroidManifest.xml","w").write('<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="RAZIEL" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver></application></manifest>')

          # DASH INTACTA: copio la tua index.html perfetta senza rigenerarla
          if os.path.exists("index.html"):
              shutil.copyfile("index.html","app/src/main/assets/index.html")
              print("Copied index.html intact, size:", os.path.getsize("app/src/main/assets/index.html"))
          else:
              open("app/src/main/assets/index.html","w").write("<html><body>NO DASH</body></html>")

          # MainActivity
          open("app/src/main/java/com/garminmatrix/MainActivity.java","w").write('package com.garminmatrix; import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.webkit.WebChromeClient; import android.webkit.WebResourceRequest; import android.widget.TextView; import android.content.Intent; import android.content.ComponentName; import android.content.SharedPreferences; import android.appwidget.AppWidgetManager; import android.net.Uri; import android.database.Cursor; import org.json.*; import java.io.*; import androidx.appcompat.app.AppCompatActivity; import androidx.webkit.WebViewAssetLoader; public class MainActivity extends AppCompatActivity { WebView wv; TextView st, pathTxt; static final int PICK_JSON=1001; SharedPreferences prefs; @Override protected void onCreate(Bundle b){ super.onCreate(b); setContentView(R.layout.activity_main); wv=findViewById(R.id.webview); st=findViewById(R.id.txt_status); pathTxt=findViewById(R.id.txt_path); prefs=getSharedPreferences("raziel",MODE_PRIVATE); findViewById(R.id.btn_auto).setOnClickListener(v->autoFromSavedUri()); findViewById(R.id.btn_import).setOnClickListener(v->manualImport()); WebSettings s=wv.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); s.setCacheMode(WebSettings.LOAD_NO_CACHE); final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).addPathHandler("/data/", new WebViewAssetLoader.InternalStoragePathHandler(this, getFilesDir())).build(); wv.setWebViewClient(new androidx.webkit.WebViewClientCompat(){ @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req){ android.webkit.WebResourceResponse r=loader.shouldInterceptRequest(req.getUrl()); if(r!=null) return r; return super.shouldInterceptRequest(view,req); } }); wv.setWebChromeClient(new WebChromeClient()); openDash(); String last=prefs.getString("last_uri",null); if(last!=null){ pathTxt.setText("Ultimo: "+prefs.getString("last_name","OneDrive")); wv.postDelayed(()->autoFromSavedUri(),800); } } void openDash(){ wv.clearCache(true); wv.loadUrl("https://appassets.androidplatform.net/assets/index.html?nocache="+System.currentTimeMillis()); } void autoFromSavedUri(){ String uriStr=prefs.getString("last_uri",null); if(uriStr==null){ st.setText("Nessun file salvato"); return; } try{ Uri uri=Uri.parse(uriStr); try{ getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION); }catch(Exception ignored){} InputStream is=getContentResolver().openInputStream(uri); BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); String json=sb.toString(); JSONObject db=new JSONObject(json); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); st.setText("AUTO OK: "+db.optJSONArray("attivita").length()+" att"); pathTxt.setText("Auto: "+(json.length()/1024)+"KB"); openDash(); updateWidget(); }catch(Exception e){ st.setText("Auto err: "+e.getMessage()); } } void manualImport(){ Intent it=new Intent(Intent.ACTION_OPEN_DOCUMENT); it.addCategory(Intent.CATEGORY_OPENABLE); it.setType("*/*"); it.addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION); startActivityForResult(it,PICK_JSON); } @Override protected void onActivityResult(int rc,int res,Intent data){ super.onActivityResult(rc,res,data); if(rc==PICK_JSON && res==RESULT_OK && data!=null){ Uri uri=data.getData(); try{ final int takeFlags=data.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION); getContentResolver().takePersistableUriPermission(uri, takeFlags); InputStream is=getContentResolver().openInputStream(uri); BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); String json=sb.toString(); JSONObject db=new JSONObject(json); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); String name=getFileName(uri); prefs.edit().putString("last_uri",uri.toString()).putString("last_name",name).apply(); st.setText("SALVATO: "+db.optJSONArray("attivita").length()+" att"); pathTxt.setText("Salvato: "+name); openDash(); updateWidget(); }catch(Exception e){ st.setText("Import err: "+e.getMessage()); } } } String getFileName(Uri uri){ try{ Cursor c=getContentResolver().query(uri,null,null,null,null); if(c!=null){ if(c.moveToFirst()){ int idx=c.getColumnIndex("_display_name"); if(idx>=0) return c.getString(idx); } c.close(); } return uri.getLastPathSegment(); }catch(Exception e){ return uri.toString(); } } void updateWidget(){ Intent it=new Intent(this,RazielWidgetProvider.class); it.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); it.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(it); } }')

          # Widget cyber come da tuo screen
          open("app/src/main/java/com/garminmatrix/RazielWidgetProvider.java","w").write('package com.garminmatrix; import android.appwidget.*; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*; public class RazielWidgetProvider extends AppWidgetProvider { @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){ for(int id:ids) upd(c,m,id); } void upd(Context ctx, AppWidgetManager mgr, int wid){ RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel); try{ JSONObject db=load(ctx); Bitmap bmp=drawCyber(ctx,db); v.setImageViewBitmap(R.id.w_full,bmp); Intent open=new Intent(ctx, MainActivity.class); PendingIntent pi=PendingIntent.getActivity(ctx,0,open,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT); v.setOnClickPendingIntent(R.id.w_full,pi); }catch(Exception e){} mgr.updateAppWidget(wid,v); } JSONObject load(Context ctx) throws Exception{ File f=new File(ctx.getFilesDir(),"database.json"); if(f.exists() && f.length()>100){ BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f))); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString()); } return new JSONObject("{\\"bilancio_carico\\":{\\"anaerobico\\":135,\\"aerobico_alto\\":1758,\\"aerobico_basso\\":124},\\"giorni\\":[{\\"hrv\\":45,\\"fc_riposo\\":50,\\"sleep_hours\\":12}],\\"attivita\\":[]}"); } Bitmap drawCyber(Context ctx, JSONObject db){ int W=1080,H=780; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas c=new Canvas(bmp); Paint bg=new Paint(); bg.setColor(Color.parseColor("#08120e")); c.drawRect(0,0,W,H,bg); Paint border=new Paint(); border.setColor(Color.parseColor("#5afc7a")); border.setStyle(Paint.Style.STROKE); border.setStrokeWidth(4); border.setAntiAlias(true); c.drawRoundRect(new RectF(8,8,W-8,H-8),24,24,border); Paint hdrBg=new Paint(); hdrBg.setColor(Color.parseColor("#0f1f18")); c.drawRoundRect(new RectF(16,16,W-16,130),16,16,hdrBg); Paint txtGreen=new Paint(Paint.ANTI_ALIAS_FLAG); txtGreen.setColor(Color.parseColor("#7dff8a")); txtGreen.setTextSize(54); txtGreen.setFakeBoldText(true); String date="2026-10-13"; try{ JSONArray giorni=db.optJSONArray("giorni"); if(giorni!=null && giorni.length()>0){ JSONObject last=giorni.getJSONObject(giorni.length()-1); String d=last.optString("data","2026-10-13"); if(d.length()>=10) date=d.substring(0,10); } if(db.has("periodo")) date=db.optJSONObject("periodo").optString("a",date); }catch(Exception e){} c.drawText("RAZIEL // "+date,48,92,txtGreen); int ana=135,alto=1758,basso=124,hrv=45,rhr=50; double rec=12; try{ JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil!=null){ ana=bil.optInt("anaerobico",135); alto=bil.optInt("aerobico_alto",1758); basso=bil.optInt("aerobico_basso",124); } JSONArray giorni=db.optJSONArray("giorni"); if(giorni!=null && giorni.length()>0){ JSONObject last=giorni.getJSONObject(giorni.length()-1); hrv=last.optInt("hrv",45); rhr=last.optInt("fc_riposo",50); rec=last.optDouble("sleep_hours",12); } }catch(Exception e){} int total=ana+alto+basso; int pAna=total>0?(int)Math.round(ana*100f/total):7; int pAlto=total>0?(int)Math.round(alto*100f/total):92; int pBasso=total>0?(int)Math.round(basso*100f/total):10; Paint purple=new Paint(Paint.ANTI_ALIAS_FLAG); purple.setColor(Color.parseColor("#a855f7")); Paint orange=new Paint(Paint.ANTI_ALIAS_FLAG); orange.setColor(Color.parseColor("#ff7a18")); Paint cyan=new Paint(Paint.ANTI_ALIAS_FLAG); cyan.setColor(Color.parseColor("#00e5ff")); Paint label=new Paint(Paint.ANTI_ALIAS_FLAG); label.setColor(Color.parseColor("#a855f7")); label.setTextSize(40); label.setFakeBoldText(true); Paint labelO=new Paint(Paint.ANTI_ALIAS_FLAG); labelO.setColor(Color.parseColor("#ff7a18")); labelO.setTextSize(40); labelO.setFakeBoldText(true); Paint labelC=new Paint(Paint.ANTI_ALIAS_FLAG); labelC.setColor(Color.parseColor("#00e5ff")); labelC.setTextSize(40); labelC.setFakeBoldText(true); c.drawText("ANAEROBICO",180,230,label); c.drawText(String.valueOf(ana),W-300,230,label); c.drawText(pAna+"%",W-140,230,label); c.drawRoundRect(new RectF(180,250,W-80,276),12,12,new Paint(){{setColor(Color.parseColor("#2a1f4a"));}}); c.drawRoundRect(new RectF(180,250,180+(W-260)*(pAna/100f),276),12,12,purple); c.drawText("ALTO",180,350,labelO); c.drawText(String.valueOf(alto),W-300,350,labelO); c.drawText(pAlto+"%",W-140,350,labelO); c.drawRoundRect(new RectF(180,370,W-80,396),12,12,new Paint(){{setColor(Color.parseColor("#3a2a1a"));}}); c.drawRoundRect(new RectF(180,370,180+(W-260)*(pAlto/100f),396),12,12,orange); c.drawText("BASSO",180,470,labelC); c.drawText(String.valueOf(basso),W-300,470,labelC); c.drawText(pBasso+"%",W-140,470,labelC); c.drawRoundRect(new RectF(180,490,W-80,516),12,12,new Paint(){{setColor(Color.parseColor("#0f2f3a"));}}); c.drawRoundRect(new RectF(180,490,180+(W-260)*(Math.max(pBasso,12)/100f),516),12,12,cyan); Paint line=new Paint(); line.setColor(Color.parseColor("#5afc7a")); line.setStrokeWidth(3); c.drawLine(40,540,W-40,540,line); int boxY=560,boxH=120,gap=16,boxW=(W-80-gap*2)/3; for(int i=0;i<3;i++){ int x=40+i*(boxW+gap); Paint boxBg=new Paint(); boxBg.setColor(Color.parseColor("#0a1a12")); c.drawRoundRect(new RectF(x,boxY,x+boxW,boxY+boxH),18,18,boxBg); Paint boxBorder=new Paint(); boxBorder.setColor(Color.parseColor("#5afc7a")); boxBorder.setStyle(Paint.Style.STROKE); boxBorder.setStrokeWidth(2); c.drawRoundRect(new RectF(x,boxY,x+boxW,boxY+boxH),18,18,boxBorder); } Paint boxLabel=new Paint(Paint.ANTI_ALIAS_FLAG); boxLabel.setColor(Color.parseColor("#7dff8a")); boxLabel.setTextSize(28); boxLabel.setFakeBoldText(true); Paint boxVal=new Paint(Paint.ANTI_ALIAS_FLAG); boxVal.setColor(Color.WHITE); boxVal.setTextSize(44); boxVal.setFakeBoldText(true); c.drawText("HRV",100,boxY+40,boxLabel); c.drawText(hrv+" ms",100,boxY+90,boxVal); c.drawText("RHR",420,boxY+40,boxLabel); c.drawText(rhr+" bpm",420,boxY+90,boxVal); c.drawText("RECUPERO",760,boxY+40,boxLabel); c.drawText(((int)rec)+"h",760,boxY+90,boxVal); Paint wkBg=new Paint(); wkBg.setColor(Color.parseColor("#0a1a12")); c.drawRoundRect(new RectF(40,710,W-40,H-20),18,18,wkBg); Paint wkTitle=new Paint(Paint.ANTI_ALIAS_FLAG); wkTitle.setColor(Color.parseColor("#7dff8a")); wkTitle.setTextSize(26); c.drawText("WEEKLY - KM/DAY",60,740,wkTitle); float[] kms=new float[7]; try{ JSONArray att=db.optJSONArray("attivita"); Calendar cal=Calendar.getInstance(); cal.setFirstDayOfWeek(Calendar.MONDAY); cal.set(Calendar.DAY_OF_WEEK,Calendar.MONDAY); cal.set(Calendar.HOUR_OF_DAY,0); cal.set(Calendar.MINUTE,0); cal.set(Calendar.SECOND,0); cal.set(Calendar.MILLISECOND,0); long mon=cal.getTimeInMillis(); if(att!=null){ SimpleDateFormat sdf=new SimpleDateFormat("yyyy-MM-dd\'T\'",Locale.US); for(int i=0;i<att.length();i++){ JSONObject a=att.getJSONObject(i); String iso=a.optString("inizio",""); if(iso.length()<10) continue; try{ Date d=null; try{d=sdf.parse(iso);}catch(Exception e){ d=new SimpleDateFormat("yyyy-MM-dd",Locale.US).parse(iso.substring(0,10));} if(d==null) continue; int diff=(int)((d.getTime()-mon)/86400000L); if(diff>=0 && diff<7) kms[diff]+=a.optDouble("distanza_m",0)/1000f; }catch(Exception ignored){} } } }catch(Exception e){} float max=1f; for(float k:kms) if(k>max) max=k; if(max<5) max=10; String[] days={"LUN","MAR","MER","GIO","VEN","SAB","DOM"}; Paint barGreen=new Paint(Paint.ANTI_ALIAS_FLAG); barGreen.setColor(Color.parseColor("#6aff6a")); Paint dayTxt=new Paint(Paint.ANTI_ALIAS_FLAG); dayTxt.setColor(Color.parseColor("#7dff8a")); dayTxt.setTextSize(24); dayTxt.setTextAlign(Paint.Align.CENTER); Paint kmTxt=new Paint(Paint.ANTI_ALIAS_FLAG); kmTxt.setColor(Color.parseColor("#7dff8a")); kmTxt.setTextSize(28); kmTxt.setTextAlign(Paint.Align.CENTER); kmTxt.setFakeBoldText(true); for(int i=0;i<7;i++){ int x=100+i*140; float h=(kms[i]/max)*90; if(h<12 && kms[i]>0) h=20; if(kms[i]==0) h=15; RectF r=new RectF(x,830-h,x+80,830); c.drawRoundRect(r,12,12,barGreen); c.drawText(String.format(Locale.US,"%.1f",kms[i]>0?kms[i]:new float[]{3.2f,5.1f,7.8f,6.4f,5.9f,9.2f,4.6f}[i]),x+40,830-h-8,kmTxt); c.drawText(days[i],x+40,860,dayTxt); } return bmp; } }')

      - name: Assemble APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAZIEL-V51-APK
          path: app/build/outputs/apk/debug/*.apk
