name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Create Android project from zero
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/garminmatrix
          mkdir -p gradle/wrapper

          # copia i tuoi file se esistono
          [ -f index.html ] && cp index.html app/src/main/assets/
          [ -f database.json ] && cp database.json app/src/main/assets/
          if [ ! -f app/src/main/assets/index.html ]; then echo '<html><body><h1>Garmin Matrix OK - metti index.html nel repo</h1></body></html>' > app/src/main/assets/index.html; fi

          cat > settings.gradle << 'EOF'
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          EOF

          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.garminmatrix'
            compileSdk 34
            defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Garmin Matrix">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/garminmatrix/MainActivity.kt << 'EOF'
          package com.garminmatrix
          import android.os.Bundle
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val wv = WebView(this); setContentView(wv)
              wv.settings.javaScriptEnabled = true
              wv.settings.allowFileAccess = true
              wv.settings.domStorageEnabled = true
              wv.loadUrl("file:///android_asset/index.html")
            }
          }
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.4.0/gradle/wrapper/gradle-wrapper.jar
          cat > gradlew << 'EOF'
          #!/bin/sh
          exec java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain "$@"
          EOF
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GarminMatrix-APK
          path: app/build/outputs/apk/debug/*.apk
