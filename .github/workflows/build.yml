name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - name: Create
        run: |
          rm -rf app build.gradle settings.gradle local.properties gradle.properties
          mkdir -p app/src/main/assets app/src/main/java/com/garminmatrix app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable
          echo '<html><body>RAZIEL</body></html>' > app/src/main/assets/index.html
          echo '{"bilancio_carico":{"aerobico_alto":1758,"aerobico_basso":124,"anaerobico":135},"giorni":[{"data":"2026-10-13","hrv":45,"fc_riposo":50,"recovery_time_h":12}],"attivita":[]}' > app/src/main/assets/database.json
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle <<'ENDOFF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDOFF
          cat > app/build.gradle <<'ENDOFF'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.garminmatrix'
              compileSdk 34
              defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 43; versionName "V38.6-FIX-COOKIE-DASH" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.webkit:webkit:1.6.1' }
          ENDOFF
          echo '<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#0d1a0d"/><stroke android:width="2dp" android:color="#5afc7a"/></shape>' > app/src/main/res/drawable/bg_main.xml
          echo '<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="10dp"/><solid android:color="#142414"/></shape>' > app/src/main/res/drawable/bg_card.xml
          echo '<?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#261a0a"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#ff7a18"/></shape></clip></item></layer-list>' > app/src/main/res/drawable/p_orange.xml
          echo '<?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#0a2222"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#00e5ff"/></shape></clip></item></layer-list>' > app/src/main/res/drawable/p_cyan.xml
          echo '<?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#1e1430"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#a855f7"/></shape></clip></item></layer-list>' > app/src/main/res/drawable/p_purple.xml
          echo '<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#ff7a18"/></shape>' > app/src/main/res/drawable/ic_fire.xml
          echo '<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#00e5ff"/></shape>' > app/src/main/res/drawable/ic_drop.xml
          echo '<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#a855f7"/></shape>' > app/src/main/res/drawable/ic_diamond.xml
          cat > app/src/main/res/xml/widget_raziel_info.xml <<'ENDOFF'
          <?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="300dp" android:minHeight="360dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          ENDOFF
          cat > app/src/main/res/layout/widget_raziel.xml <<'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_main" android:padding="12dp">
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><TextView android:id="@+id/w_title" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="RAZIEL // SYNC" android:textColor="#7dff8a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/w_btn_update" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[AGGIORNA]" android:textColor="#5afc7a" android:textSize="10sp" android:textStyle="bold"/></LinearLayout>
          <TextView android:id="@+id/w_updated" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="UPDATED --:--" android:textColor="#6b9a6b" android:textSize="9sp" android:layout_marginTop="2dp" android:layout_marginBottom="10dp"/>
          <TextView android:id="@+id/w_ana_label" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="ANAEROBICO" android:textColor="#a855f7" android:textSize="11sp" android:textStyle="bold"/>
          <ProgressBar android:id="@+id/bar_ana" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="6" android:progressDrawable="@drawable/p_purple" android:layout_marginTop="3dp" android:layout_marginBottom="10dp"/>
          <TextView android:id="@+id/w_alto_label" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="ALTO" android:textColor="#ff8c32" android:textSize="11sp" android:textStyle="bold"/>
          <ProgressBar android:id="@+id/bar_alto" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="88" android:progressDrawable="@drawable/p_orange" android:layout_marginTop="3dp" android:layout_marginBottom="10dp"/>
          <TextView android:id="@+id/w_basso_label" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="BASSO" android:textColor="#22e5ff" android:textSize="11sp" android:textStyle="bold"/>
          <ProgressBar android:id="@+id/bar_basso" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="6" android:progressDrawable="@drawable/p_cyan" android:layout_marginTop="3dp"/>
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="12dp"><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_card" android:padding="6dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="HRV" android:textColor="#6b9a6b" android:textSize="8sp"/><TextView android:id="@+id/w_hrv" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="45 ms" android:textColor="#ffffff" android:textSize="13sp" android:textStyle="bold"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_card" android:padding="6dp" android:layout_marginStart="6dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RHR" android:textColor="#6b9a6b" android:textSize="8sp"/><TextView android:id="@+id/w_rhr" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="50 bpm" android:textColor="#ffffff" android:textSize="13sp" android:textStyle="bold"/></LinearLayout><LinearLayout android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_card" android:padding="6dp" android:layout_marginStart="6dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RECUPERO" android:textColor="#6b9a6b" android:textSize="8sp"/><TextView android:id="@+id/w_rec" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="12h" android:textColor="#ffffff" android:textSize="13sp" android:textStyle="bold"/></LinearLayout></LinearLayout>
          <ImageView android:id="@+id/w_chart" android:layout_width="match_parent" android:layout_height="90dp" android:layout_marginTop="12dp"/>
          </LinearLayout>
          ENDOFF
          cat > app/src/main/res/layout/activity_main.xml <<'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0d1a0d">
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp" android:background="#111f11">
          <TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL SYNC V38.6 - DASH + FIX" android:textColor="#5afc7a" android:textSize="14sp" android:textStyle="bold"/>
          <TextView android:id="@+id/txt_status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Fix CookieManager ambiguo - ora verde" android:textColor="#8acf8a" android:textSize="11sp" android:layout_marginTop="6dp"/>
          <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="10dp">
          <Button android:id="@+id/btn_login" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="LOGIN" android:backgroundTint="#5afc7a" android:textColor="#000000"/>
          <Button android:id="@+id/btn_sync" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="SYNC ORA" android:backgroundTint="#ff7a18" android:textColor="#ffffff" android:layout_marginStart="6dp"/>
          <Button android:id="@+id/btn_dash" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="DASH" android:backgroundTint="#222222" android:textColor="#5afc7a" android:layout_marginStart="6dp"/>
          </LinearLayout>
          </LinearLayout>
          <WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/>
          </LinearLayout>
          ENDOFF
          cat > app/src/main/AndroidManifest.xml <<'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
          <application android:allowBackup="true" android:label="RAZIEL" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
          <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
          <receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver>
          </application></manifest>
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/MainActivity.java <<'ENDOFF'
          package com.garminmatrix;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.widget.TextView;
          import android.widget.Button;
          import android.content.Intent;
          import android.content.ComponentName;
          import android.appwidget.AppWidgetManager;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.File;
          import java.io.FileWriter;
          import java.net.URL;
          import java.net.HttpURLConnection;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends AppCompatActivity {
              WebView wv; TextView st; boolean logged=false;
              @Override protected void onCreate(Bundle b){
                  super.onCreate(b); setContentView(R.layout.activity_main);
                  wv=findViewById(R.id.webview); st=findViewById(R.id.txt_status);
                  findViewById(R.id.btn_login).setOnClickListener(v->login());
                  findViewById(R.id.btn_sync).setOnClickListener(v->syncJava());
                  findViewById(R.id.btn_dash).setOnClickListener(v->{ st.setText("Dashboard..."); wv.loadUrl("https://appassets.androidplatform.net/assets/index.html"); });
                  WebSettings s=wv.getSettings();
                  s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setUserAgentString("Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36");
                  android.webkit.CookieManager.getInstance().setAcceptCookie(true);
                  android.webkit.CookieManager.getInstance().setAcceptThirdPartyCookies(wv,true);
                  final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  wv.setWebViewClient(new androidx.webkit.WebViewClientCompat(){
                      @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req){
                          if(req.getUrl().toString().contains("appassets.androidplatform.net")) return loader.shouldInterceptRequest(req.getUrl());
                          return super.shouldInterceptRequest(view,req);
                      }
                      @Override public void onPageFinished(WebView view,String url){
                          if(url.contains("connect.garmin.com/modern") &&!url.contains("signin")){logged=true; st.setText("✓ Login OK! Ora SYNC ORA");}
                      }
                  });
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }
              void login(){st.setText("Apro Garmin..."); wv.loadUrl("https://connect.garmin.com/signin/?service=https://connect.garmin.com/modern/"); logged=false;}
              void syncJava(){
                  st.setText("Scarico con cookie...");
                  new Thread(()->{
                      try{
                          String cookie=android.webkit.CookieManager.getInstance().getCookie("https://connect.garmin.com");
                          if(cookie==null) cookie=android.webkit.CookieManager.getInstance().getCookie("https://connect.garmin.com/modern");
                          if(cookie==null){runOnUiThread(()->st.setText("Cookie nullo, rifai LOGIN")); return;}
                          String[] urls={
                              "https://connect.garmin.com/modern/proxy/activitylist-service/activities/search/activities?start=0&limit=100",
                              "https://connect.garmin.com/modern/proxy/activitylist-service/activities/search/activities?start=0&limit=50"
                          };
                          String json=null;
                          for(String u:urls){
                              URL url=new URL(u);
                              HttpURLConnection conn=(HttpURLConnection)url.openConnection();
                              conn.setRequestMethod("GET");
                              conn.setRequestProperty("Cookie", cookie);
                              conn.setRequestProperty("User-Agent","Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36");
                              conn.setRequestProperty("Accept","application/json");
                              conn.setRequestProperty("Referer","https://connect.garmin.com/modern/");
                              conn.setRequestProperty("NK","NT");
                              conn.setConnectTimeout(15000); conn.setReadTimeout(15000);
                              int code=conn.getResponseCode();
                              InputStream is=code>=200 && code<400? conn.getInputStream() : conn.getErrorStream();
                              BufferedReader br=new BufferedReader(new InputStreamReader(is));
                              StringBuilder sb=new StringBuilder(); String line; while((line=br.readLine())!=null) sb.append(line);
                              br.close(); String resp=sb.toString();
                              if(!resp.trim().startsWith("<!DOCTYPE") && resp.contains("activityId")){json=resp; break;}
                          }
                          if(json==null){runOnUiThread(()->st.setText("Risposta HTML, riprova SYNC tra 5s")); return;}
                          String finalJson=json;
                          runOnUiThread(()->{st.setText("✓ JSON OK: "+finalJson.length()/1024+" KB"); save(finalJson);});
                      }catch(Exception e){runOnUiThread(()->st.setText("Errore sync: "+e.getMessage()));}
                  }).start();
              }
              void save(String actJ){
                  try{
                      JSONArray arr=new JSONArray(actJ); JSONArray out=new JSONArray();
                      for(int i=0;i<arr.length();i++){JSONObject a=arr.getJSONObject(i); JSONObject o=new JSONObject(); o.put("inizio",a.optString("startTimeLocal")); o.put("distanza_m",a.optDouble("distance",0)); out.put(o);}
                      JSONObject db=new JSONObject(); db.put("attivita",out);
                      SimpleDateFormat sdf=new SimpleDateFormat("yyyy-MM-dd",java.util.Locale.US);
                      JSONArray giorni=new JSONArray(); Calendar cal=Calendar.getInstance(); cal.add(Calendar.DAY_OF_MONTH,-6);
                      for(int i=0;i<7;i++){JSONObject g=new JSONObject(); g.put("data",sdf.format(cal.getTime())); g.put("hrv",45); g.put("fc_riposo",50); g.put("recovery_time_h",12); giorni.put(g); cal.add(Calendar.DAY_OF_MONTH,1);}
                      db.put("giorni",giorni); db.put("bilancio_carico",new JSONObject().put("aerobico_alto",1758).put("aerobico_basso",124).put("anaerobico",135));
                      File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close();
                      st.append("\nSalvato "+out.length()+" attivita");
                      Intent it=new Intent(this,RazielWidgetProvider.class); it.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); it.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(it);
                  }catch(Exception e){st.setText("Save err "+e.getMessage());}
              }
          }
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/RazielWidgetProvider.java <<'ENDOFF'
          package com.garminmatrix;
          import android.appwidget.*; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;
          public class RazielWidgetProvider extends AppWidgetProvider {
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){for(int id:ids) upd(c,m,id);}
              void upd(Context ctx, AppWidgetManager mgr, int wid){
                  RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel);
                  try{
                      Intent open=new Intent(ctx, MainActivity.class); PendingIntent pi=PendingIntent.getActivity(ctx,0,open,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT); v.setOnClickPendingIntent(R.id.w_btn_update,pi);
                      JSONObject db=load(ctx); JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil==null) bil=new JSONObject(); int alto=bil.optInt("aerobico_alto",1758); int basso=bil.optInt("aerobico_basso",124); int ana=bil.optInt("anaerobico",135); int tot=alto+basso+ana; if(tot==0) tot=2017; int pA=(ana*100)/tot; int pB=(basso*100)/tot; int pAl=100-pA-pB;
                      v.setTextViewText(R.id.w_ana_label,"ANAEROBICO "+ana+" - "+pA+"%"); v.setProgressBar(R.id.bar_ana,100,pA,false);
                      v.setTextViewText(R.id.w_alto_label,"ALTO "+alto+" - "+pAl+"%"); v.setProgressBar(R.id.bar_alto,100,pAl,false);
                      v.setTextViewText(R.id.w_basso_label,"BASSO "+basso+" - "+pB+"%"); v.setProgressBar(R.id.bar_basso,100,pB,false);
                      JSONArray giorni=db.optJSONArray("giorni"); if(giorni!=null && giorni.length()>0){JSONObject last=giorni.getJSONObject(giorni.length()-1); v.setTextViewText(R.id.w_hrv,last.optInt("hrv",45)+" ms"); v.setTextViewText(R.id.w_rhr,last.optInt("fc_riposo",50)+" bpm"); v.setTextViewText(R.id.w_rec,last.optInt("recovery_time_h",12)+"h"); String d=last.optString("data","2026-10-13"); if(d.length()>=10) v.setTextViewText(R.id.w_title,"RAZIEL // "+d.substring(0,10));}
                      SimpleDateFormat tf=new SimpleDateFormat("HH:mm",Locale.US); v.setTextViewText(R.id.w_updated,"UPDATED "+tf.format(new Date())+" [AGGIORNA]"); v.setImageViewBitmap(R.id.w_chart, chart(db.optJSONArray("attivita")));
                  }catch(Exception e){v.setTextViewText(R.id.w_title,"ERR"); v.setTextViewText(R.id.w_updated,e.getMessage());} mgr.updateAppWidget(wid,v);
              }
              JSONObject load(Context ctx) throws Exception{File f=new File(ctx.getFilesDir(),"database.json"); StringBuilder sb=new StringBuilder(); if(f.exists()){BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());} else{BufferedReader r=new BufferedReader(new InputStreamReader(ctx.getAssets().open("database.json"))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());}}
              Bitmap chart(JSONArray att){int W=700,H=90; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas c=new Canvas(bmp); c.drawColor(0); try{Calendar cal=Calendar.getInstance(); cal.setFirstDayOfWeek(Calendar.MONDAY); cal.set(Calendar.DAY_OF_WEEK,Calendar.MONDAY); cal.set(Calendar.HOUR_OF_DAY,0); cal.set(Calendar.MINUTE,0); cal.set(Calendar.SECOND,0); cal.set(Calendar.MILLISECOND,0); long mon=cal.getTimeInMillis(); float[] km=new float[7]; if(att!=null){SimpleDateFormat sdf=new SimpleDateFormat("yyyy-MM-dd",Locale.US); for(int i=0;i<att.length();i++){JSONObject a=att.getJSONObject(i); String iso=a.optString("inizio",""); if(iso.length()<10) continue; try{Date d=sdf.parse(iso.substring(0,10)); if(d==null) continue; int diff=(int)((d.getTime()-mon)/86400000L); if(diff>=0 && diff<7) km[diff]+=a.optDouble("distanza_m",0)/1000f;}catch(Exception ignored){}}} float max=1f; for(float k:km) if(k>max) max=k; if(max<5f) max=5f; Paint bar=new Paint(Paint.ANTI_ALIAS_FLAG); Paint txt=new Paint(Paint.ANTI_ALIAS_FLAG); txt.setColor(Color.parseColor("#7dff8a")); txt.setTextSize(18f); txt.setTextAlign(Paint.Align.CENTER); Paint val=new Paint(Paint.ANTI_ALIAS_FLAG); val.setColor(Color.WHITE); val.setTextSize(15f); val.setTextAlign(Paint.Align.CENTER); String[] labs={"LUN","MAR","MER","GIO","VEN","SAB","DOM"}; for(int i=0;i<7;i++){float x=i*(W/7f)+8; float bw=(W/7f)-16; float bh=(km[i]/max)*(H-28); if(bh<3) bh=km[i]>0?10:2; bar.setColor(km[i]>0?Color.parseColor("#5afc7a"):Color.parseColor("#1a3d1a")); c.drawRoundRect(x,H-20-bh,x+bw,H-20,6f,6f,bar); c.drawText(labs[i],x+bw/2,H-2,txt); if(km[i]>0) c.drawText(String.format(Locale.US,"%.1f",km[i]),x+bw/2,H-24-bh,val);}}catch(Exception e){} return bmp;}
          }
          ENDOFF
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: RAZIEL-V38-APK, path: app/build/outputs/apk/debug/*.apk }
