name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - name: Create
        run: |
          rm -rf app build.gradle settings.gradle local.properties gradle.properties
          mkdir -p app/src/main/assets app/src/main/java/com/garminmatrix app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable
          if [ -f index.html ]; then cp index.html app/src/main/assets/; echo "DASH COPIATA"; else echo "<html><body>NO DASH</body></html>" > app/src/main/assets/index.html; fi
          echo '{"periodo":{"da":"","a":""},"bilancio_carico":{"aerobico_alto":0,"aerobico_basso":0,"anaerobico":0},"giorni":[],"attivita":[],"hrv_oggi":null,"fc_riposo_oggi":null,"vo2max_oggi":null}' > app/src/main/assets/database.json
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle <<'ENDOFF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDOFF
          cat > app/build.gradle <<'ENDOFF'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.garminmatrix'
              compileSdk 34
              defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 66; versionName "V43-AUTO-ONEDRIVE" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.webkit:webkit:1.6.1' }
          ENDOFF
          echo '<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#0d1a0d"/><stroke android:width="2dp" android:color="#5afc7a"/></shape>' > app/src/main/res/drawable/bg_main.xml
          echo '<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="10dp"/><solid android:color="#142414"/></shape>' > app/src/main/res/drawable/bg_card.xml
          echo '<?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#261a0a"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#ff7a18"/></shape></clip></item></layer-list>' > app/src/main/res/drawable/p_orange.xml
          echo '<?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#0a2222"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#00e5ff"/></shape></clip></item></layer-list>' > app/src/main/res/drawable/p_cyan.xml
          echo '<?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#1e1430"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#a855f7"/></shape></clip></item></layer-list>' > app/src/main/res/drawable/p_purple.xml
          cat > app/src/main/res/xml/widget_raziel_info.xml <<'ENDOFF'
          <?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="300dp" android:minHeight="360dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          ENDOFF
          cat > app/src/main/res/layout/widget_raziel.xml <<'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_main" android:padding="12dp"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><TextView android:id="@+id/w_title" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="RAZIEL" android:textColor="#7dff8a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/w_btn_update" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[AGGIORNA]" android:textColor="#5afc7a" android:textSize="10sp" android:textStyle="bold"/></LinearLayout><TextView android:id="@+id/w_updated" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--:--" android:textColor="#6b9a6b" android:textSize="9sp"/><TextView android:id="@+id/w_hrv" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="HRV -- FC -- VO2 --" android:textColor="#8acf8a" android:textSize="9sp" android:layout_marginTop="4dp"/><ProgressBar android:id="@+id/bar_ana" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="0" android:progressDrawable="@drawable/p_purple" android:layout_marginTop="8dp"/><ProgressBar android:id="@+id/bar_alto" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="0" android:progressDrawable="@drawable/p_orange" android:layout_marginTop="4dp"/><ProgressBar android:id="@+id/bar_basso" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="0" android:progressDrawable="@drawable/p_cyan" android:layout_marginTop="4dp"/><ImageView android:id="@+id/w_chart" android:layout_width="match_parent" android:layout_height="90dp" android:layout_marginTop="10dp"/></LinearLayout>
          ENDOFF
          cat > app/src/main/res/layout/activity_main.xml <<'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0d1a0d"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp" android:background="#111f11"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL V43 AUTO ONEDRIVE" android:textColor="#5afc7a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/txt_status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Import automatico da OneDrive/Garmin" android:textColor="#8acf8a" android:textSize="11sp"/><TextView android:id="@+id/txt_path" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Percorso: --" android:textColor="#6b9a6b" android:textSize="9sp" android:layout_marginTop="4dp"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp"><Button android:id="@+id/btn_auto" android:layout_width="0dp" android:layout_weight="1.5" android:layout_height="50dp" android:text="AUTO IMPORT ONEDRIVE" android:backgroundTint="#00e5ff" android:textSize="11sp"/><Button android:id="@+id/btn_import" android:layout_width="0dp" android:layout_weight="1" android:layout_height="50dp" android:text="MANUALE" android:backgroundTint="#5afc7a" android:layout_marginStart="6dp" android:textSize="11sp"/></LinearLayout><Button android:id="@+id/btn_dash" android:layout_width="match_parent" android:layout_height="44dp" android:text="APRI DASH" android:backgroundTint="#222" android:textColor="#5afc7a" android:layout_marginTop="6dp"/></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>
          ENDOFF
          cat > app/src/main/AndroidManifest.xml <<'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/><uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/><uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/><application android:allowBackup="true" android:label="RAZIEL" android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver></application></manifest>
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/MainActivity.java <<'ENDOFF'
          package com.garminmatrix;
          import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.webkit.WebChromeClient; import android.webkit.WebResourceRequest; import android.widget.TextView; import android.content.Intent; import android.content.ComponentName; import android.appwidget.AppWidgetManager; import android.net.Uri; import android.provider.DocumentsContract; import android.database.Cursor; import org.json.*; import java.io.*; import androidx.appcompat.app.AppCompatActivity; import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends AppCompatActivity {
              WebView wv; TextView st, pathTxt; static final int PICK_JSON=1001;
              @Override protected void onCreate(Bundle b){
                  super.onCreate(b); setContentView(R.layout.activity_main);
                  wv=findViewById(R.id.webview); st=findViewById(R.id.txt_status); pathTxt=findViewById(R.id.txt_path);
                  findViewById(R.id.btn_auto).setOnClickListener(v->autoImport());
                  findViewById(R.id.btn_import).setOnClickListener(v->manualImport());
                  findViewById(R.id.btn_dash).setOnClickListener(v->openDash());
                  WebSettings s=wv.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  wv.addJavascriptInterface(new Bridge(),"Android");
                  wv.setWebViewClient(new androidx.webkit.WebViewClientCompat(){
                      @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req){ if(req.getUrl().toString().contains("appassets.androidplatform.net")) return loader.shouldInterceptRequest(req.getUrl()); return super.shouldInterceptRequest(view,req); }
                      @Override public void onPageFinished(WebView view,String url){ if(url.contains("appassets")) st.setText("DASH caricata"); }
                  });
                  wv.setWebChromeClient(new WebChromeClient());
                  openDash();
                  // Auto import all'avvio dopo 1 sec
                  wv.postDelayed(()->autoImport(),1200);
              }
              void openDash(){ wv.clearCache(true); wv.loadUrl("https://appassets.androidplatform.net/assets/index.html"); }
              void autoImport(){
                  st.setText("Cerco database.json in OneDrive/Garmin...");
                  String[] paths={
                      "/storage/emulated/0/OneDrive/Garmin/database.json",
                      "/storage/emulated/0/OneDrive/GarminMatrix/database.json",
                      "/storage/emulated/0/Documents/Garmin/database.json",
                      "/storage/emulated/0/Documents/GarminMatrix/database.json",
                      "/storage/emulated/0/Download/Garmin/database.json",
                      "/storage/emulated/0/Download/database.json",
                      "/storage/emulated/0/Garmin/database.json",
                      "/storage/emulated/0/Documents/database.json"
                  };
                  File found=null;
                  for(String p:paths){
                      File f=new File(p);
                      if(f.exists() && f.length()>100){ found=f; break; }
                  }
                  if(found!=null){
                      try{
                          BufferedReader r=new BufferedReader(new FileReader(found));
                          StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close();
                          String json=sb.toString();
                          JSONObject db=new JSONObject(json);
                          File outf=new File(getFilesDir(),"database.json");
                          FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close();
                          int nAtt=db.optJSONArray("attivita")!=null?db.optJSONArray("attivita").length():0;
                          int nGiorni=db.optJSONArray("giorni")!=null?db.optJSONArray("giorni").length():0;
                          st.setText("AUTO IMPORT OK: "+nAtt+" att + "+nGiorni+" gg");
                          pathTxt.setText("Da: "+found.getAbsolutePath()+" - "+(found.length()/1024)+"KB");
                          openDash();
                          updateWidget();
                          return;
                      }catch(Exception e){ st.setText("AUTO ERR: "+e.getMessage()); }
                  }
                  // Fallback: cerca via MediaStore / cerca file piu recente in Download
                  try{
                      File dl=new File("/storage/emulated/0/Download/");
                      File[] files=dl.listFiles((dir,name)->name.toLowerCase().endsWith(".json"));
                      if(files!=null){ File newest=null; long max=0; for(File f:files){ if(f.lastModified()>max){max=f.lastModified(); newest=f;}} if(newest!=null && newest.length()>100){ BufferedReader r=new BufferedReader(new FileReader(newest)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); JSONObject db=new JSONObject(sb.toString()); if(db.has("attivita")||db.has("giorni")){ File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); st.setText("AUTO IMPORT da Download OK: "+newest.getName()); pathTxt.setText("Da: "+newest.getAbsolutePath()); openDash(); updateWidget(); return; } } }
                  }catch(Exception e){}
                  st.setText("Nessun database.json trovato - usa MANUALE o metti file in OneDrive/Garmin/");
                  pathTxt.setText("Cercato in: OneDrive/Garmin/, Documents/Garmin/, Download/");
              }
              void manualImport(){
                  Intent it=new Intent(Intent.ACTION_OPEN_DOCUMENT); it.addCategory(Intent.CATEGORY_OPENABLE); it.setType("*/*"); String[] mime={"application/json","text/plain","*/*"}; it.putExtra(Intent.EXTRA_MIME_TYPES,mime); startActivityForResult(it,PICK_JSON);
              }
              @Override protected void onActivityResult(int rc,int res,Intent data){ super.onActivityResult(rc,res,data); if(rc==PICK_JSON && res==RESULT_OK && data!=null){ Uri uri=data.getData(); try{ getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION); InputStream is=getContentResolver().openInputStream(uri); BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); String json=sb.toString(); JSONObject db=new JSONObject(json); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); int nAtt=db.optJSONArray("attivita")!=null?db.optJSONArray("attivita").length():0; st.setText("MANUALE OK: "+nAtt+" att importate - DASH aggiornata"); pathTxt.setText("Da: "+getFileName(uri)); openDash(); updateWidget(); }catch(Exception e){ st.setText("Import manuale err: "+e.getMessage()); } } }
              String getFileName(Uri uri){ try{ String name=null; if(uri.getScheme().equals("content")){ Cursor c=getContentResolver().query(uri,null,null,null,null); if(c!=null){ c.moveToFirst(); int idx=c.getColumnIndex(DocumentsContract.Document.COLUMN_DISPLAY_NAME); if(idx>=0) name=c.getString(idx); c.close(); } } if(name==null) name=uri.getPath(); return name; }catch(Exception e){ return uri.toString(); } }
              void updateWidget(){ Intent it=new Intent(this,RazielWidgetProvider.class); it.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); it.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(it); }
              public class Bridge{
                  @android.webkit.JavascriptInterface public String getDb(){ try{ File f=new File(getFilesDir(),"database.json"); if(f.exists() && f.length()>50){ BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f))); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return sb.toString(); } }catch(Exception e){} try{ BufferedReader ar=new BufferedReader(new InputStreamReader(getAssets().open("database.json"))); StringBuilder sb2=new StringBuilder(); String l2; while((l2=ar.readLine())!=null) sb2.append(l2); ar.close(); return sb2.toString(); }catch(Exception e){ return "{\"bilancio_carico\":{\"anaerobico\":0,\"aerobico_alto\":0,\"aerobico_basso\":0},\"giorni\":[],\"attivita\":[]}"; } }
              }
          }
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/RazielWidgetProvider.java <<'ENDOFF'
          package com.garminmatrix;
          import android.appwidget.*; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;
          public class RazielWidgetProvider extends AppWidgetProvider {
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){for(int id:ids) upd(c,m,id);}
              void upd(Context ctx, AppWidgetManager mgr, int wid){
                  RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel);
                  try{
                      Intent open=new Intent(ctx, MainActivity.class); PendingIntent pi=PendingIntent.getActivity(ctx,0,open,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT); v.setOnClickPendingIntent(R.id.w_btn_update,pi);
                      JSONObject db=load(ctx); SimpleDateFormat tf=new SimpleDateFormat("HH:mm",Locale.US); v.setTextViewText(R.id.w_updated,"SYNC "+tf.format(new Date()));
                      JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil==null) bil=db.optJSONObject("load_focus");
                      if(bil!=null){ int ana=bil.optInt("anaerobico",0); int alto=bil.optInt("aerobico_alto",0); int basso=bil.optInt("aerobico_basso",0); v.setProgressBar(R.id.bar_ana,2000,Math.min(ana,2000),false); v.setProgressBar(R.id.bar_alto,2000,Math.min(alto,2000),false); v.setProgressBar(R.id.bar_basso,500,Math.min(basso,500),false); }
                      String hrvTxt="HRV "+(db.has("hrv_oggi")?String.format(Locale.US,"%.0f",db.optDouble("hrv_oggi")): (db.optJSONArray("giorni")!=null&&db.optJSONArray("giorni").length()>0? db.optJSONArray("giorni").getJSONObject(db.optJSONArray("giorni").length()-1).optString("hrv","--"):"--"))+" FC "+(db.has("fc_riposo_oggi")?String.format(Locale.US,"%.0f",db.optDouble("fc_riposo_oggi")):"--")+" VO2 "+(db.has("vo2max_oggi")?String.format(Locale.US,"%.1f",db.optDouble("vo2max_oggi")):"--"); v.setTextViewText(R.id.w_hrv,hrvTxt);
                      v.setImageViewBitmap(R.id.w_chart, chart(db.optJSONArray("attivita")));
                  }catch(Exception e){ v.setTextViewText(R.id.w_updated,"ERR "+e.getMessage()); } mgr.updateAppWidget(wid,v);
              }
              JSONObject load(Context ctx) throws Exception{File f=new File(ctx.getFilesDir(),"database.json"); StringBuilder sb=new StringBuilder(); if(f.exists() && f.length()>50){BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());} else{BufferedReader r=new BufferedReader(new InputStreamReader(ctx.getAssets().open("database.json"))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());}}
              Bitmap chart(JSONArray att){int W=700,H=90; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas c=new Canvas(bmp); c.drawColor(0); try{Calendar cal=Calendar.getInstance(); cal.setFirstDayOfWeek(Calendar.MONDAY); cal.set(Calendar.DAY_OF_WEEK,Calendar.MONDAY); cal.set(Calendar.HOUR_OF_DAY,0); cal.set(Calendar.MINUTE,0); cal.set(Calendar.SECOND,0); cal.set(Calendar.MILLISECOND,0); long mon=cal.getTimeInMillis(); float[] km=new float[7]; if(att!=null){SimpleDateFormat sdf=new SimpleDateFormat("yyyy-MM-dd'T'",Locale.US); for(int i=0;i<att.length();i++){JSONObject a=att.getJSONObject(i); String iso=a.optString("inizio",""); if(iso.length()<10) continue; try{Date d=null; try{d=sdf.parse(iso);}catch(Exception e){d=new SimpleDateFormat("yyyy-MM-dd",Locale.US).parse(iso.substring(0,10));} if(d==null) continue; int diff=(int)((d.getTime()-mon)/86400000L); if(diff>=0 && diff<7) km[diff]+=a.optDouble("distanza_m",0)/1000f;}catch(Exception ignored){}}} float max=1f; for(float k:km) if(k>max) max=k; if(max<5f) max=5f; Paint bar=new Paint(Paint.ANTI_ALIAS_FLAG); Paint txt=new Paint(Paint.ANTI_ALIAS_FLAG); txt.setColor(Color.parseColor("#7dff8a")); txt.setTextSize(18f); txt.setTextAlign(Paint.Align.CENTER); Paint val=new Paint(Paint.ANTI_ALIAS_FLAG); val.setColor(Color.WHITE); val.setTextSize(15f); val.setTextAlign(Paint.Align.CENTER); String[] labs={"LUN","MAR","MER","GIO","VEN","SAB","DOM"}; for(int i=0;i<7;i++){float x=i*(W/7f)+8; float bw=(W/7f)-16; float bh=(km[i]/max)*(H-28); if(bh<3) bh=km[i]>0?10:2; bar.setColor(km[i]>0?Color.parseColor("#5afc7a"):Color.parseColor("#1a3d1a")); c.drawRoundRect(x,H-20-bh,x+bw,H-20,6f,6f,bar); c.drawText(labs[i],x+bw/2,H-2,txt); if(km[i]>0) c.drawText(String.format(Locale.US,"%.1f",km[i]),x+bw/2,H-24-bh,val);}}catch(Exception e){} return bmp;}
          }
          ENDOFF
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with: { name: RAZIEL-V43-APK, path: app/build/outputs/apk/debug/*.apk }
