name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Create project
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/garminmatrix
          [ -f index.html ] && cp index.html app/src/main/assets/ || echo '<html><body><h1>Garmin Matrix</h1></body></html>' > app/src/main/assets/index.html
          [ -f database.json ] && cp database.json app/src/main/assets/ || echo '{"giorni":[]}' > app/src/main/assets/database.json
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.garminmatrix'
            compileSdk 34
            defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 2; versionName "1.1" }
          }
          dependencies { 
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.9.0'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:allowBackup="true" android:label="Garmin Matrix">
              <activity android:name=".MainActivity" android:exported="true" android:theme="@android:style/Theme.NoTitleBar">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/garminmatrix/MainActivity.java << 'EOF'
          package com.garminmatrix;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebView;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;

          public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView wv = new WebView(this);
              setContentView(wv);
              wv.getSettings().setJavaScriptEnabled(true);
              wv.getSettings().setDomStorageEnabled(true);
              wv.getSettings().setAllowFileAccess(true);
              wv.getSettings().setAllowFileAccessFromFileURLs(true);
              wv.getSettings().setAllowUniversalAccessFromFileURLs(true);

              final WebViewAssetLoader assetLoader = new WebViewAssetLoader.Builder()
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                  .build();

              wv.setWebViewClient(new WebViewClientCompat() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                  return assetLoader.shouldInterceptRequest(request.getUrl());
                }
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView view, String url) {
                  return assetLoader.shouldInterceptRequest(android.net.Uri.parse(url));
                }
              });
              wv.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
          }
          EOF
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GarminMatrix-APK
          path: app/build/outputs/apk/debug/*.apk
