          open("app/src/main/java/com/garminmatrix/RazielWidgetProvider.java","w").write(r'''
          package com.garminmatrix;
          import android.appwidget.*; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;
          public class RazielWidgetProvider extends AppWidgetProvider {
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){for(int id:ids) upd(c,m,id);}
              void upd(Context ctx, AppWidgetManager mgr, int wid){
                  RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel);
                  try{
                      JSONObject db=load(ctx); SimpleDateFormat tf=new SimpleDateFormat("HH:mm",Locale.US); v.setTextViewText(R.id.w_updated,"SYNC "+tf.format(new Date()));
                      JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil!=null){ int ana=bil.optInt("anaerobico",0); int alto=bil.optInt("aerobico_alto",0); int basso=bil.optInt("aerobico_basso",0); v.setProgressBar(R.id.bar_ana,2000,Math.min(ana,2000),false); v.setProgressBar(R.id.bar_alto,2000,Math.min(alto,2000),false); v.setProgressBar(R.id.bar_basso,500,Math.min(basso,500),false); }
                      JSONArray giorni=db.optJSONArray("giorni"); JSONObject last=giorni!=null&&giorni.length()>0?giorni.getJSONObject(giorni.length()-1):null; String hrv=last!=null?last.optString("hrv","--"):"--"; v.setTextViewText(R.id.w_hrv,"HRV "+hrv);
                      v.setImageViewBitmap(R.id.w_chart, chart(db.optJSONArray("attivita")));
                  }catch(Exception e){} mgr.updateAppWidget(wid,v);
              }
              JSONObject load(Context ctx) throws Exception{File f=new File(ctx.getFilesDir(),"database.json"); StringBuilder sb=new StringBuilder(); if(f.exists()){BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());} else return new JSONObject("{}");}
              Bitmap chart(JSONArray att){int W=700,H=90; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas c=new Canvas(bmp); c.drawColor(0); try{Calendar cal=Calendar.getInstance(); cal.setFirstDayOfWeek(Calendar.MONDAY); cal.set(Calendar.DAY_OF_WEEK,Calendar.MONDAY); cal.set(Calendar.HOUR_OF_DAY,0); cal.set(Calendar.MINUTE,0); cal.set(Calendar.SECOND,0); cal.set(Calendar.MILLISECOND,0); long mon=cal.getTimeInMillis(); float[] km=new float[7]; if(att!=null){for(int i=0;i<att.length();i++){JSONObject a=att.getJSONObject(i); String iso=a.optString("inizio",""); if(iso.length()<10) continue; try{Date d=new SimpleDateFormat("yyyy-MM-dd'T'",Locale.US).parse(iso); int diff=(int)((d.getTime()-mon)/86400000L); if(diff>=0&&diff<7) km[diff]+=a.optDouble("distanza_m",0)/1000f;}catch(Exception ignored){}}} float max=1f; for(float k:km) if(k>max) max=k; Paint bar=new Paint(Paint.ANTI_ALIAS_FLAG); bar.setColor(Color.parseColor("#5afc7a")); for(int i=0;i<7;i++){float x=i*(W/7f)+8; float bw=(W/7f)-16; float bh=(km[i]/max)*(H-28); c.drawRect(x,H-20-bh,x+bw,H-20,bar);}}catch(Exception e){} return bmp;}
          }
          ''')
