name: Build APK

on:
  push:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Create minimal Android project if missing
        run: |
          if [ ! -f "app/build.gradle" ]; then
            mkdir -p app/src/main/assets
            mkdir -p app/src/main/java/com/garminmatrix
            cp -r *.json app/src/main/assets/ 2>/dev/null || true
            cp -r *.html app/src/main/assets/ 2>/dev/null || true
            cp -r database.json app/src/main/assets/ 2>/dev/null || true
            cp -r index.html app/src/main/assets/ 2>/dev/null || true
          fi
          ls -R

      - name: Build with Gradle (fallback)
        run: |
          if [ -f "./gradlew" ]; then chmod +x gradlew && ./gradlew assembleDebug; else gradle wrapper --gradle-version 8.4; chmod +x gradlew; ./gradlew assembleDebug; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GarminMatrix-APK
          path: app/build/outputs/apk/debug/*.apk
