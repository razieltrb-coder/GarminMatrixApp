name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Create project
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          rm -rf app build.gradle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/garminmatrix
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          if [ -f index.html ]; then cp index.html app/src/main/assets/; else echo '<html><body>Garmin</body></html>' > app/src/main/assets/index.html; fi
          if [ -f database.json ]; then cp database.json app/src/main/assets/; fi
          if [ -n "$GEMINI_KEY" ]; then sed -i "s|__GEMINI_KEY__|${GEMINI_KEY}|g" app/src/main/assets/index.html; else sed -i "s|__GEMINI_KEY__||g" app/src/main/assets/index.html; fi
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'ENDOFF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDOFF
          cat > app/build.gradle << 'ENDOFF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.garminmatrix'
            compileSdk 34
            defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 35; versionName "1.9-V35-FIX" }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.6.1'
          }
          ENDOFF
          cat > app/src/main/res/drawable/bg_main.xml << 'ENDOFF'
          <?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#0f1a0f"/><stroke android:width="2dp" android:color="#5afc7a"/></shape>
          ENDOFF
          cat > app/src/main/res/drawable/bg_card.xml << 'ENDOFF'
          <?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="12dp"/><solid android:color="#111f11"/><stroke android:width="1dp" android:color="#2a5a2a"/></shape>
          ENDOFF
          cat > app/src/main/res/drawable/p_orange.xml << 'ENDOFF'
          <?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#2a1f0f"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#ff7a18"/></shape></clip></item></layer-list>
          ENDOFF
          cat > app/src/main/res/drawable/p_cyan.xml << 'ENDOFF'
          <?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#102a2a"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#00e5ff"/></shape></clip></item></layer-list>
          ENDOFF
          cat > app/src/main/res/drawable/p_purple.xml << 'ENDOFF'
          <?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#201a30"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#a855f7"/></shape></clip></item></layer-list>
          ENDOFF
          cat > app/src/main/res/xml/widget_raziel_info.xml << 'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="280dp" android:minHeight="320dp"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget_raziel"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          ENDOFF
          cat > app/src/main/res/layout/widget_raziel.xml << 'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="wrap_content"
              android:orientation="vertical" android:background="@drawable/bg_main" android:padding="12dp">
              <TextView android:id="@+id/w_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL // 2026-10-13" android:textColor="#7dff8a" android:textSize="14sp" android:textStyle="bold"/>
              <TextView android:id="@+id/w_updated" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="UPDATED 18:04" android:textColor="#6b8a6b" android:textSize="9sp" android:layout_marginTop="2dp" android:layout_marginBottom="8dp"/>
              <TextView android:id="@+id/w_ana_label" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="ANAEROBICO 135 - 7%" android:textColor="#a855f7" android:textSize="12sp" android:textStyle="bold"/>
              <ProgressBar android:id="@+id/bar_ana" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="10dp" android:max="100" android:progress="7" android:progressDrawable="@drawable/p_purple" android:layout_marginTop="2dp" android:layout_marginBottom="10dp"/>
              <TextView android:id="@+id/w_alto_label" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="ALTO 1758 - 92%" android:textColor="#ff8c32" android:textSize="12sp" android:textStyle="bold"/>
              <ProgressBar android:id="@+id/bar_alto" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="10dp" android:max="100" android:progress="92" android:progressDrawable="@drawable/p_orange" android:layout_marginTop="2dp" android:layout_marginBottom="10dp"/>
              <TextView android:id="@+id/w_basso_label" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="BASSO 124 - 10%" android:textColor="#22e5ff" android:textSize="12sp" android:textStyle="bold"/>
              <ProgressBar android:id="@+id/bar_basso" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="10dp" android:max="100" android:progress="10" android:progressDrawable="@drawable/p_cyan" android:layout_marginTop="2dp"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="14dp">
                  <LinearLayout android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_card" android:padding="6dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="HRV" android:textColor="#6b8a6b" android:textSize="9sp"/><TextView android:id="@+id/w_hrv" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="45 ms" android:textColor="#ffffff" android:textSize="14sp" android:textStyle="bold"/></LinearLayout>
                  <LinearLayout android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_card" android:padding="6dp" android:layout_marginStart="6dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RHR" android:textColor="#6b8a6b" android:textSize="9sp"/><TextView android:id="@+id/w_rhr" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="50 bpm" android:textColor="#ffffff" android:textSize="14sp" android:textStyle="bold"/></LinearLayout>
                  <LinearLayout android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_card" android:padding="6dp" android:layout_marginStart="6dp"><TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="RECUPERO" android:textColor="#6b8a6b" android:textSize="9sp"/><TextView android:id="@+id/w_rec" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="12h" android:textColor="#ffffff" android:textSize="14sp" android:textStyle="bold"/></LinearLayout>
              </LinearLayout>
              <ImageView android:id="@+id/w_chart" android:layout_width="match_parent" android:layout_height="80dp" android:layout_marginTop="10dp"/>
              <TextView android:id="@+id/w_km_row" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="LUN MAR MER GIO VEN SAB DOM" android:textColor="#6b8a6b" android:textSize="8sp" android:layout_marginTop="4dp"/>
          </LinearLayout>
          ENDOFF
          cat > app/src/main/AndroidManifest.xml << 'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:allowBackup="true" android:label="RAZIEL" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              <receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver>
            </application>
          </manifest>
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/MainActivity.java << 'ENDOFF'
          package com.garminmatrix;
          import android.os.Bundle; import android.webkit.*; import android.widget.EditText; import android.app.AlertDialog; import androidx.appcompat.app.AppCompatActivity; import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends AppCompatActivity {
            @Override protected void onCreate(Bundle b){super.onCreate(b); WebView wv=new WebView(this); setContentView(wv); WebSettings s=wv.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build(); wv.setWebViewClient(new androidx.webkit.WebViewClientCompat(){@Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest req){return loader.shouldInterceptRequest(req.getUrl());}}); wv.setWebChromeClient(new WebChromeClient(){@Override public boolean onJsPrompt(WebView view, String url, String message, String defaultValue, final JsPromptResult result){final EditText input=new EditText(MainActivity.this); input.setText(defaultValue!=null?defaultValue:""); new AlertDialog.Builder(MainActivity.this).setTitle("Gemini Key").setMessage(message).setView(input).setPositiveButton("OK",(d,w)->result.confirm(input.getText().toString())).setNegativeButton("Annulla",(d,w)->result.cancel()).setCancelable(false).show(); return true;}}); wv.loadUrl("https://appassets.androidplatform.net/assets/index.html");}
          }
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/RazielWidgetProvider.java << 'ENDOFF'
          package com.garminmatrix;
          import android.appwidget.AppWidgetManager; import android.appwidget.AppWidgetProvider; import android.content.Context; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;
          public class RazielWidgetProvider extends AppWidgetProvider {
            @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){for(int id:ids) doUpdate(c,m,id);}
            private void doUpdate(Context ctx, AppWidgetManager mgr, int wid){
              RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel);
              try{
                StringBuilder sb=new StringBuilder(); BufferedReader r=new BufferedReader(new InputStreamReader(ctx.getAssets().open("database.json"))); String l; while((l=r.readLine())!=null) sb.append(l); r.close();
                JSONObject db=new JSONObject(sb.toString()); JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil==null) bil=new JSONObject();
                int alto=bil.optInt("aerobico_alto",1758); int basso=bil.optInt("aerobico_basso",124); int ana=bil.optInt("anaerobico",135);
                int tot=alto+basso+ana; if(tot==0) tot=1;
                int pa=(ana*100)/tot; int pb=(basso*100)/tot; int ph=100-pa-pb;
                if(ph<0) ph=92; if(ph>100) ph=92; if(pa<0) pa=7; if(pb<0) pb=10;
                v.setTextViewText(R.id.w_ana_label,"ANAEROBICO "+ana+" - "+pa+"%"); v.setProgressBar(R.id.bar_ana,100,pa,false);
                v.setTextViewText(R.id.w_alto_label,"ALTO "+alto+" - "+ph+"%"); v.setProgressBar(R.id.bar_alto,100,ph,false);
                v.setTextViewText(R.id.w_basso_label,"BASSO "+basso+" - "+pb+"%"); v.setProgressBar(R.id.bar_basso,100,pb,false);
                JSONArray giorni=db.optJSONArray("giorni");
                if(giorni!=null && giorni.length()>0){JSONObject last=giorni.getJSONObject(giorni.length()-1); v.setTextViewText(R.id.w_hrv,last.optInt("hrv",45)+" ms"); v.setTextViewText(R.id.w_rhr,last.optInt("fc_riposo",50)+" bpm"); v.setTextViewText(R.id.w_rec,last.optInt("recovery_time_h",12)+"h"); String d=last.optString("data","2026-10-13"); if(d.length()>=10) v.setTextViewText(R.id.w_title,"RAZIEL // "+d.substring(0,10));}
                SimpleDateFormat tf=new SimpleDateFormat("HH:mm",Locale.US); v.setTextViewText(R.id.w_updated,"UPDATED "+tf.format(new Date()));
                Bitmap bmp=Bitmap.createBitmap(400,80,Bitmap.Config.ARGB_8888); Canvas c2=new Canvas(bmp); Paint p=new Paint(); p.setColor(Color.parseColor("#1a3d1a")); p.setTextSize(16f); c2.drawText("LUN  MAR  MER  GIO  VEN  SAB  DOM",10,50,p); v.setImageViewBitmap(R.id.w_chart,bmp);
                v.setTextViewText(R.id.w_km_row,"WEEK KM/DAY");
              }catch(Exception e){v.setTextViewText(R.id.w_title,"RAZIEL // "+e.getMessage());}
              mgr.updateAppWidget(wid,v);
            }
          }
          ENDOFF
          gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAZIEL-V35-APK
          path: app/build/outputs/apk/debug/*.apk
