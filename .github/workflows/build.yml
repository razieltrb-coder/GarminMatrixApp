name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Install Pillow
        run: pip install Pillow
      - name: Generate project V57.18j - TEXT + DOWNLOAD
        shell: python
        run: |
          import os, textwrap, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw
          sizes = {"mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96, "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192}
          for folder in sizes:
              Path(f"app/src/main/res/{folder}").mkdir(parents=True, exist_ok=True)
          candidates=["app_icon.png","app_icon.jpg","app_icon.webp","icon.png"]
          icon_src=next((n for n in candidates if os.path.exists(n)), None)
          if icon_src:
              try:
                  im=Image.open(icon_src).convert("RGBA")
                  w,h=im.size
                  side=min(w,h)
                  im=im.crop(((w-side)//2,(h-side)//2,(w-side)//2+side,(h-side)//2+side))
                  for folder,size in sizes.items():
                      d=Path(f"app/src/main/res/{folder}")
                      rs=im.resize((size,size), Image.LANCZOS)
                      rs.save(d/"ic_launcher.png",format="PNG")
                      rs.save(d/"ic_launcher_round.png",format="PNG")
              except Exception as e:
                  print(e)
          os.makedirs("app/src/main/java/com/garminmatrix",exist_ok=True)
          os.makedirs("app/src/main/res/xml",exist_ok=True)
          os.makedirs("app/src/main/res/layout",exist_ok=True)
          os.makedirs("app/src/main/assets",exist_ok=True)
          open("settings.gradle","w").write("include ':app'\n")
          open("local.properties","w").write(f"sdk.dir={os.environ['ANDROID_HOME']}\n")
          open("gradle.properties","w").write("android.useAndroidX=true\n")
          open("build.gradle","w").write(textwrap.dedent('''
            buildscript {
                repositories { google(); mavenCentral() }
                dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
            }
            allprojects { repositories { google(); mavenCentral() } }
          '''))
          open("app/build.gradle","w").write(textwrap.dedent('''
            apply plugin: 'com.android.application'
            android {
                namespace 'com.garminmatrix'
                compileSdk 34
                defaultConfig {
                    applicationId "com.garminmatrix"
                    minSdk 24
                    targetSdk 34
                    versionCode 104
                    versionName "V57.18j-RAZMIN-DL-FIX"
                }
            }
            configurations.all {
                resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
            }
            dependencies {
                implementation 'androidx.appcompat:appcompat:1.6.1'
                implementation('androidx.webkit:webkit:1.6.1'){
                    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
                }
                implementation 'androidx.core:core:1.12.0'
            }
          '''))
          open("app/src/main/res/xml/widget_raziel_info.xml","w").write('<?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="320dp" android:minHeight="420dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>')
          open("app/src/main/res/layout/widget_raziel.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content"><ImageView android:id="@+id/w_full" android:layout_width="match_parent" android:layout_height="wrap_content" android:adjustViewBounds="true"/></LinearLayout>')
          open("app/src/main/res/layout/activity_main.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0d1a0d"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp" android:background="#111f11"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZMIN V57.18j FILE IN DL" android:textColor="#5afc7a" android:textStyle="bold"/><TextView android:id="@+id/txt_status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--" android:textColor="#8acf8a"/><TextView android:id="@+id/txt_path" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--" android:textColor="#6b9a6b"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp"><Button android:id="@+id/btn_auto" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="AUTO ONEDRIVE" android:backgroundTint="#00e5ff"/><Button android:id="@+id/btn_import" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="SCEGLI JSON" android:backgroundTint="#5afc7a" android:layout_marginStart="6dp"/></LinearLayout></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>')
          open("app/src/main/AndroidManifest.xml","w").write('<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/><queries><package android:name="com.facebook.stella"/><package android:name="com.whatsapp"/><package android:name="com.whatsapp.w4b"/></queries><application android:allowBackup="true" android:label="RAZMIN" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar" android:requestLegacyExternalStorage="true"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver><provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.provider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/file_provider_paths"/></provider></application></manifest>')
          open("app/src/main/res/xml/file_provider_paths.xml","w").write('<?xml version="1.0" encoding="utf-8"?><paths><cache-path name="raziel_cache" path="."/><external-cache-path name="raziel_external_cache" path="."/><files-path name="raziel_files" path="."/><external-path name="external_files" path="."/></paths>')
          if os.path.exists("index.html"):
              shutil.copyfile("index.html","app/src/main/assets/index.html")
          open("app/src/main/java/com/garminmatrix/MainActivity.java","w").write('''
          package com.garminmatrix;
          import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.widget.TextView; import android.content.Intent; import android.content.ComponentName; import android.content.SharedPreferences; import android.appwidget.AppWidgetManager; import android.net.Uri; import android.database.Cursor; import org.json.*; import java.io.*; import androidx.appcompat.app.AppCompatActivity; import androidx.webkit.WebViewAssetLoader; import androidx.core.content.FileProvider; import android.widget.Toast; import android.content.pm.PackageManager; import android.os.Environment;

          public class MainActivity extends AppCompatActivity {
              WebView wv; TextView st, pathTxt; static final int PICK_JSON=1001; SharedPreferences prefs;
              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);
                  setContentView(R.layout.activity_main);
                  wv=findViewById(R.id.webview); st=findViewById(R.id.txt_status); pathTxt=findViewById(R.id.txt_path);
                  prefs=getSharedPreferences("raziel",MODE_PRIVATE);
                  findViewById(R.id.btn_auto).setOnClickListener(v->autoFromSavedUri());
                  findViewById(R.id.btn_import).setOnClickListener(v->manualImport());
                  WebSettings s=wv.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW); s.setCacheMode(WebSettings.LOAD_NO_CACHE);
                  final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).addPathHandler("/data/", new WebViewAssetLoader.InternalStoragePathHandler(this, getFilesDir())).build();
                  wv.addJavascriptInterface(new Object(){
                      @android.webkit.JavascriptInterface public void shareJsonToWhatsApp(String fileName, String jsonContent){ shareFileOnly(fileName, jsonContent); }
                      @android.webkit.JavascriptInterface public void shareToMetaAI(String fileName, String jsonContent){ shareFileOnly(fileName, jsonContent); }

                      private void shareFileOnly(String fileName, String jsonContent){
                          runOnUiThread(new Runnable(){
                              @Override public void run(){
                                  try{
                                      // 1. Salva in Download/RAZMIN per allegarlo manualmente con +
                                      File dlDir=new File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "RAZMIN");
                                      dlDir.mkdirs();
                                      File dlFile=new File(dlDir, fileName);
                                      FileWriter fwDl=new FileWriter(dlFile); fwDl.write(jsonContent); fwDl.close();

                                      // 2. Salva anche in cache per eventuale share
                                      File cacheFile=new File(getCacheDir(), fileName);
                                      FileWriter fwCache=new FileWriter(cacheFile); fwCache.write(jsonContent); fwCache.close();

                                      String prompt="RAZMIN "+fileName+" ("+(jsonContent.length()/1024)+"KB) - Ho salvato il file in Download/RAZMIN/"+fileName+" - Per favore allegalo con il tasto + e analizza: carico anaerobico/aerobico, HRV, RHR, recupero, forma, ultime 10 attivita. File: "+dlFile.getAbsolutePath();

                                      // 3. Apri Meta AI con SOLO testo - cosi' si apre sicuro
                                      try{
                                          getPackageManager().getPackageInfo("com.facebook.stella",0);
                                          Intent i=new Intent(Intent.ACTION_SEND);
                                          i.setType("text/plain");
                                          i.setPackage("com.facebook.stella");
                                          i.putExtra(Intent.EXTRA_TEXT, prompt);
                                          startActivity(i);
                                          Toast.makeText(MainActivity.this, "Aperto Meta AI + file salvato in Download/RAZMIN/"+fileName+" - premi + per allegarlo", Toast.LENGTH_LONG).show();
                                          return;
                                      }catch(PackageManager.NameNotFoundException ignore){
                                          Toast.makeText(MainActivity.this, "Meta AI non trovata", Toast.LENGTH_SHORT).show();
                                      }

                                      // Fallback chooser testo
                                      Intent fallback=new Intent(Intent.ACTION_SEND);
                                      fallback.setType("text/plain");
                                      fallback.putExtra(Intent.EXTRA_TEXT, prompt);
                                      startActivity(Intent.createChooser(fallback, "Apri Meta AI - file in Download/RAZMIN"));

                                  }catch(Exception e){
                                      e.printStackTrace();
                                      Toast.makeText(MainActivity.this, "Err: "+e.getMessage(), Toast.LENGTH_LONG).show();
                                  }
                              }
                          });
                      }
                  }, "Android");
                  wv.setWebViewClient(new androidx.webkit.WebViewClientCompat(){
                      @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest req){ android.webkit.WebResourceResponse r=loader.shouldInterceptRequest(req.getUrl()); return r!=null?r:super.shouldInterceptRequest(view,req); }
                      @Override public boolean shouldOverrideUrlLoading(WebView view, android.webkit.WebResourceRequest request){ return false; }
                  });
                  openDash();
                  String last=prefs.getString("last_uri",null);
                  if(last!=null){ pathTxt.setText("Ultimo: "+prefs.getString("last_name","OneDrive")); wv.postDelayed(()->autoFromSavedUri(),800); }
              }
              void openDash(){ wv.clearCache(true); wv.loadUrl("https://appassets.androidplatform.net/assets/index.html?nocache="+System.currentTimeMillis()); }
              void autoFromSavedUri(){ String uriStr=prefs.getString("last_uri",null); if(uriStr==null){ st.setText("Nessun file salvato - SCEGLI JSON"); return; } try{ Uri uri=Uri.parse(uriStr); try{ getContentResolver().takePersistableUriPermission(uri, Intent.FLAG_GRANT_READ_URI_PERMISSION); }catch(Exception ignored){} InputStream is=getContentResolver().openInputStream(uri); BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); JSONObject db=new JSONObject(sb.toString()); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); st.setText("AUTO OK basso="+db.optJSONObject("bilancio_carico").optInt("aerobico_basso")); openDash(); updateWidget(); }catch(Exception e){ st.setText("Auto err: "+e.getMessage()); } }
              void manualImport(){ Intent it=new Intent(Intent.ACTION_OPEN_DOCUMENT); it.addCategory(Intent.CATEGORY_OPENABLE); it.setType("*/*"); it.addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION|Intent.FLAG_GRANT_READ_URI_PERMISSION); startActivityForResult(it,PICK_JSON); }
              @Override protected void onActivityResult(int rc,int res,Intent data){ super.onActivityResult(rc,res,data); if(rc==PICK_JSON && res==RESULT_OK && data!=null){ Uri uri=data.getData(); try{ getContentResolver().takePersistableUriPermission(uri, data.getFlags() & (Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_WRITE_URI_PERMISSION)); InputStream is=getContentResolver().openInputStream(uri); BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); JSONObject db=new JSONObject(sb.toString()); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); String name=getFileName(uri); prefs.edit().putString("last_uri",uri.toString()).putString("last_name",name).apply(); st.setText("SALVATO basso="+db.optJSONObject("bilancio_carico").optInt("aerobico_basso")); pathTxt.setText(name); openDash(); updateWidget(); }catch(Exception e){ st.setText("Import err: "+e.getMessage()); } } }
              String getFileName(Uri uri){ try{ Cursor c=getContentResolver().query(uri,null,null,null,null); if(c!=null){ if(c.moveToFirst()){ int idx=c.getColumnIndex("_display_name"); if(idx>=0) return c.getString(idx); } c.close(); } return uri.getLastPathSegment(); }catch(Exception e){ return uri.toString(); } }
              void updateWidget(){ Intent it=new Intent(this,RazielWidgetProvider.class); it.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); it.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(it); }
          }
          ''')

          open("app/src/main/java/com/garminmatrix/RazielWidgetProvider.java","w").write('''
          package com.garminmatrix;
          import android.appwidget.*; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;
          public class RazielWidgetProvider extends AppWidgetProvider {
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){ for(int id:ids) upd(c,m,id); }
              void upd(Context ctx, AppWidgetManager mgr, int wid){
                  RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel);
                  try{
                      JSONObject db=load(ctx);
                      Bitmap bmp = (db==null)? drawNoData() : drawCyber(db);
                      v.setImageViewBitmap(R.id.w_full,bmp);
                      Intent open=new Intent(ctx, MainActivity.class);
                      PendingIntent pi=PendingIntent.getActivity(ctx,0,open,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);
                      v.setOnClickPendingIntent(R.id.w_full,pi);
                      mgr.updateAppWidget(wid,v);
                  }catch(Exception e){ try{ RemoteViews vv=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel); vv.setImageViewBitmap(R.id.w_full,drawNoData()); mgr.updateAppWidget(wid,vv);}catch(Exception ee){} }
              }
              JSONObject load(Context ctx) throws Exception{
                  File f=new File(ctx.getFilesDir(),"database.json");
                  if(f.exists() && f.length()>100){
                      FileInputStream fis=new FileInputStream(f); byte[] data=new byte[(int)f.length()]; fis.read(data); fis.close(); return new JSONObject(new String(data,"UTF-8"));
                  }
                  return null;
              }
              void drawHeartIcon(Canvas c, float x, float y, int color){ Paint p=new Paint(Paint.ANTI_ALIAS_FLAG); p.setColor(color); p.setStyle(Paint.Style.FILL); Path path=new Path(); path.moveTo(x, y+6); path.cubicTo(x-12, y-10, x-28, y+8, x, y+22); path.cubicTo(x+28, y+8, x+12, y-10, x, y+6); c.drawPath(path,p); }
              void drawFlameIcon(Canvas c, float x, float y, int color){ Paint p=new Paint(Paint.ANTI_ALIAS_FLAG); p.setColor(color); p.setStyle(Paint.Style.FILL); Path path=new Path(); path.moveTo(x, y+20); path.cubicTo(x-10, y+10, x-6, y-8, x, y+2); path.cubicTo(x+6, y-8, x+10, y+10, x, y+20); c.drawPath(path,p); }
              void drawDropIcon(Canvas c, float x, float y, int color){ Paint p=new Paint(Paint.ANTI_ALIAS_FLAG); p.setColor(color); p.setStyle(Paint.Style.FILL); Path path=new Path(); path.moveTo(x, y-12); path.cubicTo(x-12, y+2, x-8, y+18, x, y+18); path.cubicTo(x+8, y+18, x+12, y+2, x, y-12); c.drawPath(path,p); }
              void drawGreenHeartHRV(Canvas c, float x, float y){ Paint p=new Paint(Paint.ANTI_ALIAS_FLAG); p.setColor(Color.parseColor("#2ecc71")); p.setStyle(Paint.Style.FILL); Path path=new Path(); path.moveTo(x, y+4); path.cubicTo(x-8, y-6, x-18, y+5, x, y+14); path.cubicTo(x+18, y+5, x+8, y-6, x, y+4); c.drawPath(path,p); }
              void drawRedHeartRHR(Canvas c, float x, float y){ Paint p=new Paint(Paint.ANTI_ALIAS_FLAG); p.setColor(Color.parseColor("#e74c3c")); p.setStyle(Paint.Style.FILL); Path path=new Path(); path.moveTo(x, y+4); path.cubicTo(x-8, y-6, x-18, y+5, x, y+14); path.cubicTo(x+18, y+5, x+8, y-6, x, y+4); c.drawPath(path,p); }
              void drawBedRecupero(Canvas c, float x, float y){ Paint p=new Paint(Paint.ANTI_ALIAS_FLAG); p.setColor(Color.parseColor("#8d6e63")); p.setStyle(Paint.Style.FILL); c.drawRoundRect(new RectF(x-14,y+6,x+14,y+12),3,3,p); c.drawRoundRect(new RectF(x-16,y+2,x+16,y+7),4,4,p); }
              Bitmap drawNoData(){ int W=1080, H=1220; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas cv=new Canvas(bmp); Paint bg=new Paint(); bg.setColor(Color.parseColor("#0a1210")); cv.drawRect(0,0,W,H,bg); Paint border=new Paint(); border.setColor(Color.parseColor("#ff4444")); border.setStyle(Paint.Style.STROKE); border.setStrokeWidth(8); cv.drawRoundRect(new RectF(6,6,W-6,H-6),26,26,border); Paint t1=new Paint(Paint.ANTI_ALIAS_FLAG); t1.setColor(Color.parseColor("#ff4444")); t1.setTextSize(90); t1.setFakeBoldText(true); t1.setTextAlign(Paint.Align.CENTER); Paint t2=new Paint(Paint.ANTI_ALIAS_FLAG); t2.setColor(Color.parseColor("#7dff8a")); t2.setTextSize(40); t2.setTextAlign(Paint.Align.CENTER); cv.drawText("NO DATA",W/2,500,t1); cv.drawText("APRI APP",W/2,600,t2); return bmp; }
              Bitmap drawCyber(JSONObject db){
                  int W=1080, H=1220; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas cv=new Canvas(bmp);
                  Paint bg=new Paint(); bg.setColor(Color.parseColor("#0a1210")); cv.drawRect(0,0,W,H,bg);
                  Paint border=new Paint(); border.setColor(Color.parseColor("#5afc7a")); border.setStyle(Paint.Style.STROKE); border.setStrokeWidth(6); cv.drawRoundRect(new RectF(6,6,W-6,H-6),26,26,border);
                  Paint hdr=new Paint(); hdr.setColor(Color.parseColor("#111d16")); cv.drawRoundRect(new RectF(12,12,W-12,132),20,20,hdr);
                  Paint title=new Paint(Paint.ANTI_ALIAS_FLAG); title.setColor(Color.parseColor("#7dff8a")); title.setTextSize(52); title.setFakeBoldText(true);
                  String date="2026-10-14"; try{ if(db.has("periodo")) date=db.optJSONObject("periodo").optString("a",date); }catch(Exception e){}
                  cv.drawText("RAZMIN // "+date,44,92,title);
                  int ana=0,alto=0,basso=0,hrv=0,rhr=0; double rec=0;
                  try{ JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil!=null){ ana=bil.optInt("anaerobico",0); alto=bil.optInt("aerobico_alto",0); basso=bil.optInt("aerobico_basso",0);} JSONArray giorni=db.optJSONArray("giorni"); if(giorni!=null && giorni.length()>0){ JSONObject last=giorni.getJSONObject(giorni.length()-1); hrv=last.optInt("hrv",0); rhr=last.optInt("fc_riposo",0); if(last.has("tempo_recupero")) rec=last.optDouble("tempo_recupero",0); else if(last.has("recupero")) rec=last.optDouble("recupero",0); else rec=0; if(rec>200) rec=rec/60.0; } }catch(Exception e){}
                  int total=ana+alto+basso; int pAna= total>0?(int)Math.round(ana*100f/total):0; int pAlto= total>0?(int)Math.round(alto*100f/total):0; int pBasso= total>0?(int)Math.round(basso*100f/total):0;
                  Paint pPurple=new Paint(Paint.ANTI_ALIAS_FLAG); pPurple.setColor(Color.parseColor("#a855f7")); Paint pOrange=new Paint(Paint.ANTI_ALIAS_FLAG); pOrange.setColor(Color.parseColor("#ff7a18")); Paint pCyan=new Paint(Paint.ANTI_ALIAS_FLAG); pCyan.setColor(Color.parseColor("#00e5ff"));
                  Paint tAna=new Paint(Paint.ANTI_ALIAS_FLAG); tAna.setColor(Color.parseColor("#a855f7")); tAna.setTextSize(40); tAna.setFakeBoldText(true); Paint tAlto=new Paint(Paint.ANTI_ALIAS_FLAG); tAlto.setColor(Color.parseColor("#ff7a18")); tAlto.setTextSize(40); tAlto.setFakeBoldText(true); Paint tBasso=new Paint(Paint.ANTI_ALIAS_FLAG); tBasso.setColor(Color.parseColor("#00e5ff")); tBasso.setTextSize(40); tBasso.setFakeBoldText(true);
                  drawHeartIcon(cv, 60, 220, Color.parseColor("#a855f7")); cv.drawText("ANAEROBICO",130,250,tAna); cv.drawText(String.valueOf(ana),W-320,250,tAna); cv.drawText(pAna+"%",W-150,250,tAna); cv.drawRoundRect(new RectF(130,270,W-60,296),12,12,new Paint(){{setColor(Color.parseColor("#2a1f4a"));}}); cv.drawRoundRect(new RectF(130,270,130+(W-190)*(pAna/100f),296),12,12,pPurple);
                  drawFlameIcon(cv, 60, 340, Color.parseColor("#ff7a18")); cv.drawText("ALTO",130,370,tAlto); cv.drawText(String.valueOf(alto),W-320,370,tAlto); cv.drawText(pAlto+"%",W-150,370,tAlto); cv.drawRoundRect(new RectF(130,390,W-60,416),12,12,new Paint(){{setColor(Color.parseColor("#3a2a1a"));}}); cv.drawRoundRect(new RectF(130,390,130+(W-190)*(pAlto/100f),416),12,12,pOrange);
