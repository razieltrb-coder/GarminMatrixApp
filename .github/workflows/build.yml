name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Create full Android project
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/garminmatrix
          cp -f index.html app/src/main/assets/ 2>/dev/null || echo "<h1>Garmin Matrix</h1>" > app/src/main/assets/index.html
          cp -f database.json app/src/main/assets/ 2>/dev/null || echo '{"giorni":[]}' > app/src/main/assets/database.json
          cat > settings.gradle << 'EOF'
          include ':app'
          EOF
          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.garminmatrix'
            compileSdk 34
            defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
            buildTypes { release { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Garmin Matrix">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/garminmatrix/MainActivity.kt << 'EOF'
          package com.garminmatrix
          import android.os.Bundle
          import android.webkit.WebView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
              super.onCreate(savedInstanceState)
              val wv = WebView(this); setContentView(wv)
              wv.settings.javaScriptEnabled = true
              wv.settings.allowFileAccess = true
              wv.settings.domStorageEnabled = true
              wv.loadUrl("file:///android_asset/index.html")
            }
          }
          EOF
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GarminMatrix-APK
          path: app/build/outputs/apk/debug/*.apk
