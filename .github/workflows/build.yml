// PRIMA (rotto - dava 0h):
if(last.has("tempo_recupero")) rec=last.optDouble("tempo_recupero",0);
else if(last.has("recupero")) rec=last.optDouble("recupero",0);

// DOPO (fix 72h pulito):
int recAtt = db.optInt("recupero_attuale_ore", -1); // top level 72h
if(recAtt>=0){ rec=recAtt; }
if(rec<=0){
  if(last.has("recupero_reale_ore")) rec=last.optDouble("recupero_reale_ore",0);
  else if(last.has("recupero_orologio_ore")) rec=last.optDouble("recupero_orologio_ore",0);
  else if(last.has("recupero_attuale_ore")) rec=last.optDouble("recupero_attuale_ore",0);
  else if(last.has("tempo_recupero")) rec=last.optDouble("tempo_recupero",0);
  else if(last.has("recupero")) rec=last.optDouble("recupero",0);
}
