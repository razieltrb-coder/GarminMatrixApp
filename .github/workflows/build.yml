name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.4 }
      - name: Create
        run: |
          rm -rf app build.gradle settings.gradle local.properties gradle.properties
          mkdir -p app/src/main/assets app/src/main/java/com/garminmatrix app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable
          if [ -f index.html ]; then cp index.html app/src/main/assets/; echo "DASH COPIATA"; else echo "<html>PLACEHOLDER</html>" > app/src/main/assets/index.html; fi
          echo '{"periodo":{"da":"2026-10-01","a":"2026-10-12"},"bilancio_carico":{"aerobico_alto":1758,"aerobico_basso":124,"anaerobico":135},"giorni":[],"attivita":[]}' > app/src/main/assets/database.json
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle <<'ENDOFF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          ENDOFF
          cat > app/build.gradle <<'ENDOFF'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.garminmatrix'
              compileSdk 34
              defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 65; versionName "V42.1-FIX-IMPORT-LOGIN" }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.webkit:webkit:1.6.1' }
          ENDOFF
          echo '<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#0d1a0d"/><stroke android:width="2dp" android:color="#5afc7a"/></shape>' > app/src/main/res/drawable/bg_main.xml
          echo '<?xml version="1.0"?><shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="10dp"/><solid android:color="#142414"/></shape>' > app/src/main/res/drawable/bg_card.xml
          echo '<?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#261a0a"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#ff7a18"/></shape></clip></item></layer-list>' > app/src/main/res/drawable/p_orange.xml
          echo '<?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#0a2222"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#00e5ff"/></shape></clip></item></layer-list>' > app/src/main/res/drawable/p_cyan.xml
          echo '<?xml version="1.0"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#1e1430"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#a855f7"/></shape></clip></item></layer-list>' > app/src/main/res/drawable/p_purple.xml
          cat > app/src/main/res/xml/widget_raziel_info.xml <<'ENDOFF'
          <?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="300dp" android:minHeight="360dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          ENDOFF
          cat > app/src/main/res/layout/widget_raziel.xml <<'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_main" android:padding="12dp"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal"><TextView android:id="@+id/w_title" android:layout_width="0dp" android:layout_weight="1" android:layout_height="wrap_content" android:text="RAZIEL" android:textColor="#7dff8a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/w_btn_update" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="[AGGIORNA]" android:textColor="#5afc7a" android:textSize="10sp" android:textStyle="bold"/></LinearLayout><TextView android:id="@+id/w_updated" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--:--" android:textColor="#6b9a6b" android:textSize="9sp"/><TextView android:id="@+id/w_hrv" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="HRV -- FC -- VO2 --" android:textColor="#8acf8a" android:textSize="9sp" android:layout_marginTop="4dp"/><ProgressBar android:id="@+id/bar_ana" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="6" android:progressDrawable="@drawable/p_purple" android:layout_marginTop="8dp"/><ProgressBar android:id="@+id/bar_alto" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="88" android:progressDrawable="@drawable/p_orange" android:layout_marginTop="4dp"/><ProgressBar android:id="@+id/bar_basso" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:max="100" android:progress="6" android:progressDrawable="@drawable/p_cyan" android:layout_marginTop="4dp"/><ImageView android:id="@+id/w_chart" android:layout_width="match_parent" android:layout_height="90dp" android:layout_marginTop="10dp"/></LinearLayout>
          ENDOFF
          cat > app/src/main/res/layout/activity_main.xml <<'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0d1a0d"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp" android:background="#111f11"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL V42.1 FIX" android:textColor="#5afc7a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/txt_status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="FIX Import + Login Garmin" android:textColor="#8acf8a" android:textSize="11sp"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp"><Button android:id="@+id/btn_login" android:layout_width="0dp" android:layout_weight="1" android:layout_height="46dp" android:text="LOGIN" android:backgroundTint="#5afc7a"/><Button android:id="@+id/btn_sync" android:layout_width="0dp" android:layout_weight="1.3" android:layout_height="46dp" android:text="SYNC 7GG" android:backgroundTint="#ff7a18" android:layout_marginStart="5dp" android:textSize="10sp"/><Button android:id="@+id/btn_import" android:layout_width="0dp" android:layout_weight="1" android:layout_height="46dp" android:text="IMPORT JSON" android:backgroundTint="#00e5ff" android:layout_marginStart="5dp" android:textSize="10sp"/></LinearLayout><Button android:id="@+id/btn_dash" android:layout_width="match_parent" android:layout_height="40dp" android:text="APRI DASH" android:backgroundTint="#222" android:textColor="#5afc7a" android:layout_marginTop="6dp"/></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>
          ENDOFF
          cat > app/src/main/AndroidManifest.xml <<'ENDOFF'
          <?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/><application android:allowBackup="true" android:label="RAZIEL" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver></application></manifest>
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/MainActivity.java <<'ENDOFF'
          package com.garminmatrix;
          import android.os.Bundle; import android.webkit.WebView; import android.webkit.WebSettings; import android.webkit.WebChromeClient; import android.webkit.WebResourceRequest; import android.widget.TextView; import android.content.Intent; import android.content.ComponentName; import android.appwidget.AppWidgetManager; import android.net.Uri; import android.os.Handler; import org.json.*; import java.io.*; import androidx.appcompat.app.AppCompatActivity; import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends AppCompatActivity {
              WebView wv; TextView st; static final int PICK_JSON=1001; boolean pendingSync=false;
              @Override protected void onCreate(Bundle b){
                  super.onCreate(b); setContentView(R.layout.activity_main);
                  wv=findViewById(R.id.webview); st=findViewById(R.id.txt_status);
                  findViewById(R.id.btn_login).setOnClickListener(v->login());
                  findViewById(R.id.btn_sync).setOnClickListener(v->startSyncFlow());
                  findViewById(R.id.btn_import).setOnClickListener(v->importJson());
                  findViewById(R.id.btn_dash).setOnClickListener(v->{ pendingSync=false; wv.loadUrl("https://appassets.androidplatform.net/assets/index.html"); });
                  WebSettings s=wv.getSettings(); s.setJavaScriptEnabled(true); s.setDomStorageEnabled(true); s.setAllowFileAccess(true); s.setAllowContentAccess(true); s.setAllowFileAccessFromFileURLs(true); s.setAllowUniversalAccessFromFileURLs(true); s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
                  s.setUserAgentString("Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36");
                  android.webkit.CookieManager.getInstance().setAcceptCookie(true); android.webkit.CookieManager.getInstance().setAcceptThirdPartyCookies(wv,true);
                  final WebViewAssetLoader loader=new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
                  wv.addJavascriptInterface(new Bridge(),"Android");
                  wv.setWebViewClient(new androidx.webkit.WebViewClientCompat(){
                      @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest req){ if(req.getUrl().toString().contains("appassets.androidplatform.net")) return loader.shouldInterceptRequest(req.getUrl()); return super.shouldInterceptRequest(view,req); }
                      @Override public void onPageFinished(WebView view,String url){
                          if(url.contains("appassets")){ if(!pendingSync) st.setText("DASH OK"); }
                          else if(url.contains("garmin.com")){
                              st.setText("Garmin caricato - se vedi dashboard Garmin, premi di nuovo SYNC 7GG");
                              if(pendingSync){
                                  pendingSync=false;
                                  new Handler().postDelayed(()->inject7Garmin(),2000);
                              }
                          }
                      }
                  });
                  wv.setWebChromeClient(new WebChromeClient());
                  wv.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }
              void login(){ pendingSync=false; wv.loadUrl("https://connect.garmin.com/signin/?service=https://connect.garmin.com/modern/"); st.setText("Login... inserisci OTP"); }
              void startSyncFlow(){
                  // Se siamo gia su garmin, fai sync diretto, altrimenti vai su garmin e poi sync
                  String cur=wv.getUrl();
                  if(cur!=null && cur.contains("garmin.com")){ inject7Garmin(); }
                  else{ pendingSync=true; st.setText("Apro Garmin per SYNC..."); wv.loadUrl("https://connect.garmin.com/modern/"); }
              }
              void importJson(){ Intent it=new Intent(Intent.ACTION_GET_CONTENT); it.setType("*/*"); it.addCategory(Intent.CATEGORY_OPENABLE); startActivityForResult(Intent.createChooser(it,"Seleziona database.json"),PICK_JSON); }
              @Override protected void onActivityResult(int rc,int res,Intent data){ super.onActivityResult(rc,res,data); if(rc==PICK_JSON && res==RESULT_OK && data!=null){ Uri uri=data.getData(); try{ InputStream is=getContentResolver().openInputStream(uri); if(is==null){ st.setText("Import err: stream null"); return; } BufferedReader r=new BufferedReader(new InputStreamReader(is)); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); String json=sb.toString(); if(json.length()<20){ st.setText("File vuoto"); return; } JSONObject db=new JSONObject(json); File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close(); int nAtt=db.optJSONArray("attivita")!=null?db.optJSONArray("attivita").length():0; int nGiorni=db.optJSONArray("giorni")!=null?db.optJSONArray("giorni").length():0; st.setText("IMPORT OK: "+nAtt+" att + "+nGiorni+" gg - APRI DASH"); pendingSync=false; wv.loadUrl("https://appassets.androidplatform.net/assets/index.html"); Intent it2=new Intent(this,RazielWidgetProvider.class); it2.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); it2.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(it2); }catch(Exception e){ st.setText("Import err "+e.getMessage()); e.printStackTrace(); } } }
              void inject7Garmin(){
                  st.setText("SYNC 7GG in corso su Garmin...");
                  String js="(async()=>{"+
                  "async function g(u){try{let r=await fetch(u,{credentials:'include'}); if(r.status===429){await new Promise(x=>setTimeout(x,3000)); return null;} if(!r.ok) return null; let t=await r.text(); try{return JSON.parse(t);}catch{return null;}}catch{return null;}}"+
                  "async function sleep(ms){return new Promise(r=>setTimeout(r,ms));}"+
                  "try{"+
                  "let dn=null; let p=await g('/modern/proxy/currentuser-service/user/info'); if(!p) p=await g('https://connect.garmin.com/modern/proxy/currentuser-service/user/info'); if(p){dn=p.displayName||p.userName;} if(!dn){let p2=await g('/modern/proxy/userprofile-service/socialProfile'); if(!p2) p2=await g('https://connect.garmin.com/modern/proxy/userprofile-service/socialProfile'); if(p2) dn=p2.displayName;} if(!dn){try{let html=document.documentElement.innerHTML; let m=html.match(/\"displayName\"\\s*:\\s*\"([^\"]+)\"/); if(m) dn=m[1];}catch(e){}} if(!dn){Android.onErr('No displayName - sei su login? Fai LOGIN prima'); return;}"+
                  "Android.onLog('DN '+dn+' - SYNC 7GG start');"+
                  "let today=new Date(); let end=today.toISOString().slice(0,10); let start=new Date(today); start.setDate(start.getDate()-7); let sStr=start.toISOString().slice(0,10);"+
                  "let acts=await g('/modern/proxy/activitylist-service/activities/search/activities?startDate='+sStr+'&endDate='+end+'&start=0&limit=30'); if(!acts) acts=await g('https://connect.garmin.com/modern/proxy/activitylist-service/activities/search/activities?startDate='+sStr+'&endDate='+end+'&start=0&limit=30'); let attivita=[]; if(acts&&Array.isArray(acts)){for(let a of acts){attivita.push({activityId:a.activityId,nome:a.activityName,inizio:a.startTimeLocal,distanza_m:a.distance,durata_s:a.duration,fc_media:a.averageHR,raw:a});}}"+
                  "Android.onLog('Attivita 7gg: '+attivita.length);"+
                  "let giorni=[]; let lastHRV=null, lastRHR=null, lastVO2=null;"+
                  "for(let i=0;i<=7;i++){try{let d=new Date(start); d.setDate(start.getDate()+i); let iso=d.toISOString().slice(0,10); Android.onLog('Giorno '+iso+' '+(i+1)+'/8'); let summary=await g('/modern/proxy/usersummary-service/usersummary/daily/'+dn+'?calendarDate='+iso); if(!summary) summary=await g('https://connect.garmin.com/modern/proxy/usersummary-service/usersummary/daily/'+dn+'?calendarDate='+iso); await sleep(900); let hrv=await g('/modern/proxy/hrv-service/hrv/'+iso); if(!hrv) hrv=await g('https://connect.garmin.com/modern/proxy/hrv-service/hrv/'+iso); await sleep(900); let tr=await g('/modern/proxy/metrics-service/metrics/trainingstatus/aggregated/'+iso); if(!tr) tr=await g('https://connect.garmin.com/modern/proxy/metrics-service/metrics/trainingstatus/aggregated/'+iso); await sleep(900); let hrvVal=null; try{let s=hrv&&hrv.hrvSummary||hrv; if(s){hrvVal=s.lastNightAvg||s.weeklyAvg; if(!hrvVal&&hrv.hrvReadings&&hrv.hrvReadings.length) hrvVal=hrv.hrvReadings[hrv.hrvReadings.length-1].hrvValue;}}catch(e){} let rhr=summary&&summary.restingHeartRate||null; let vo2=null; try{if(tr&&tr.mostRecentVO2Max) vo2=tr.mostRecentVO2Max.generic?.vo2MaxValue||tr.mostRecentVO2Max.running?.vo2MaxValue;}catch(e){} if(hrvVal) lastHRV=hrvVal; if(rhr) lastRHR=rhr; if(vo2) lastVO2=vo2; giorni.push({data:iso,[STRIPPED]"+
                  "let loadFocus=null; try{let ts=await g('/modern/proxy/metrics-service/metrics/trainingstatus/aggregated/'+end); if(!ts) ts=await g('https://connect.garmin.com/modern/proxy/metrics-service/metrics/trainingstatus/aggregated/'+end); if(ts){let bal=ts.mostRecentTrainingLoadBalance||{}; let map=bal.metricsTrainingLoadBalanceDTOMap||{}; let entry=null; for(let k in map){if(map[k].primaryTrainingDevice){entry=map[k]; break;}} if(!entry){let vals=Object.values(map); if(vals.length) entry=vals[0];} if(entry&&entry.monthlyLoadAerobicLow!=null){loadFocus={periodo:'Ultimi 28gg al '+end,anaerobico:Math.round(entry.monthlyLoadAnaerobic),aerobico_alto:Math.round(entry.monthlyLoadAerobicHigh),aerobico_basso:Math.round(entry.monthlyLoadAerobicLow)};}}}catch(e){}"+
                  "if(!loadFocus){try{let old=JSON.parse(Android.getDb()); loadFocus=old.bilancio_carico||old.load_focus||{anaerobico:135,aerobico_alto:1758,aerobico_basso:124};}catch(e){loadFocus={anaerobico:135,aerobico_alto:1758,aerobico_basso:124};}}"+
                  "let existing=null; try{existing=JSON.parse(Android.getDb());}catch(e){}"+
                  "let finalAtt=attivita; let finalGiorni=giorni; if(existing&&existing.attivita&&existing.attivita.length>0){let map={}; for(let a of existing.attivita){if(a.activityId) map[a.activityId]=a;} for(let a of attivita){map[a.activityId]=a;} finalAtt=Object.values(map); finalAtt.sort((a,b)=>new Date(b.inizio||'')-new Date(a.inizio||'')); let gmap={}; for(let g of (existing.giorni||[])){gmap[g.data]=g;} for(let g of giorni){gmap[g.data]=g;} finalGiorni=Object.values(gmap).sort((a,b)=>a.data.localeCompare(b.data));}"+
                  "let db={periodo:{da:sStr,a:end},attivita:finalAtt,giorni:finalGiorni,load_focus:loadFocus,bilancio_carico:loadFocus,hrv_oggi:lastHRV,fc_riposo_oggi:lastRHR,vo2max_oggi:lastVO2}; Android.onFull(JSON.stringify(db));"+
                  "}catch(e){Android.onErr('SYNC ERR '+e.message);}"+
                  "})();";
                  wv.evaluateJavascript(js,null);
              }
              public class Bridge{
                  @android.webkit.JavascriptInterface public String getDb(){ try{ File f=new File(getFilesDir(),"database.json"); if(f.exists()){ BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f))); StringBuilder sb=new StringBuilder(); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); if(sb.length()>10) return sb.toString(); } BufferedReader ar=new BufferedReader(new InputStreamReader(getAssets().open("database.json"))); StringBuilder sb2=new StringBuilder(); String l2; while((l2=ar.readLine())!=null) sb2.append(l2); ar.close(); return sb2.toString(); }catch(Exception e){ return "{\"bilancio_carico\":{\"anaerobico\":135,\"aerobico_alto\":1758,\"aerobico_basso\":124},\"giorni\":[],\"attivita\":[]}"; } }
                  @android.webkit.JavascriptInterface public void onFull(String json){ runOnUiThread(()->{ try{ saveFull(json); }catch(Exception e){ st.setText("Save err "+e.getMessage()); } }); }
                  @android.webkit.JavascriptInterface public void onLog(String m){ runOnUiThread(()-> st.setText(m)); }
                  @android.webkit.JavascriptInterface public void onErr(String err){ runOnUiThread(()-> st.setText(err)); }
              }
              void saveFull(String j){
                  try{
                      JSONObject db=new JSONObject(j);
                      File outf=new File(getFilesDir(),"database.json"); FileWriter fw=new FileWriter(outf); fw.write(db.toString(2)); fw.close();
                      st.setText("SYNC 7GG OK: "+db.optJSONArray("attivita").length()+" att HRV "+db.optDouble("hrv_oggi",0));
                      wv.loadUrl("https://appassets.androidplatform.net/assets/index.html");
                      Intent it=new Intent(this,RazielWidgetProvider.class); it.setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE); int[] ids=AppWidgetManager.getInstance(this).getAppWidgetIds(new ComponentName(this,RazielWidgetProvider.class)); it.putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS,ids); sendBroadcast(it);
                  }catch(Exception e){ st.setText("Full save err "+e.getMessage()); }
              }
          }
          ENDOFF
          cat > app/src/main/java/com/garminmatrix/RazielWidgetProvider.java <<'ENDOFF'
          package com.garminmatrix;
          import android.appwidget.*; import android.content.*; import android.app.PendingIntent; import android.graphics.*; import android.widget.RemoteViews; import org.json.*; import java.text.SimpleDateFormat; import java.util.*; import java.io.*;
          public class RazielWidgetProvider extends AppWidgetProvider {
              @Override public void onUpdate(Context c, AppWidgetManager m, int[] ids){for(int id:ids) upd(c,m,id);}
              void upd(Context ctx, AppWidgetManager mgr, int wid){
                  RemoteViews v=new RemoteViews(ctx.getPackageName(), R.layout.widget_raziel);
                  try{
                      Intent open=new Intent(ctx, MainActivity.class); PendingIntent pi=PendingIntent.getActivity(ctx,0,open,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT); v.setOnClickPendingIntent(R.id.w_btn_update,pi);
                      JSONObject db=load(ctx); SimpleDateFormat tf=new SimpleDateFormat("HH:mm",Locale.US); v.setTextViewText(R.id.w_updated,"SYNC "+tf.format(new Date()));
                      JSONObject bil=db.optJSONObject("bilancio_carico"); if(bil==null) bil=db.optJSONObject("load_focus");
                      if(bil!=null){ v.setProgressBar(R.id.bar_ana,2000,Math.min(bil.optInt("anaerobico",0),2000),false); v.setProgressBar(R.id.bar_alto,2000,Math.min(bil.optInt("aerobico_alto",0),2000),false); v.setProgressBar(R.id.bar_basso,500,Math.min(bil.optInt("aerobico_basso",0),500),false); }
                      String hrvTxt="HRV "+(db.has("hrv_oggi")?String.format(Locale.US,"%.0f",db.optDouble("hrv_oggi")):"--")+" FC "+(db.has("fc_riposo_oggi")?String.format(Locale.US,"%.0f",db.optDouble("fc_riposo_oggi")):"--")+" VO2 "+(db.has("vo2max_oggi")?String.format(Locale.US,"%.1f",db.optDouble("vo2max_oggi")):"--"); v.setTextViewText(R.id.w_hrv,hrvTxt);
                      v.setImageViewBitmap(R.id.w_chart, chart(db.optJSONArray("attivita")));
                  }catch(Exception e){} mgr.updateAppWidget(wid,v);
              }
              JSONObject load(Context ctx) throws Exception{File f=new File(ctx.getFilesDir(),"database.json"); StringBuilder sb=new StringBuilder(); if(f.exists()){BufferedReader r=new BufferedReader(new InputStreamReader(new FileInputStream(f))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());} else{BufferedReader r=new BufferedReader(new InputStreamReader(ctx.getAssets().open("database.json"))); String l; while((l=r.readLine())!=null) sb.append(l); r.close(); return new JSONObject(sb.toString());}}
              Bitmap chart(JSONArray att){int W=700,H=90; Bitmap bmp=Bitmap.createBitmap(W,H,Bitmap.Config.ARGB_8888); Canvas c=new Canvas(bmp); c.drawColor(0); try{Calendar cal=Calendar.getInstance(); cal.setFirstDayOfWeek(Calendar.MONDAY); cal.set(Calendar.DAY_OF_WEEK,Calendar.MONDAY); cal.set(Calendar.HOUR_OF_DAY,0); cal.set(Calendar.MINUTE,0); cal.set(Calendar.SECOND,0); cal.set(Calendar.MILLISECOND,0); long mon=cal.getTimeInMillis(); float[] km=new float[7]; if(att!=null){SimpleDateFormat sdf=new SimpleDateFormat("yyyy-MM-dd'T'",Locale.US); for(int i=0;i<att.length();i++){JSONObject a=att.getJSONObject(i); String iso=a.optString("inizio",""); if(iso.length()<10) continue; try{Date d=null; try{d=sdf.parse(iso);}catch(Exception e){d=new SimpleDateFormat("yyyy-MM-dd",Locale.US).parse(iso.substring(0,10));} if(d==null) continue; int diff=(int)((d.getTime()-mon)/86400000L); if(diff>=0 && diff<7) km[diff]+=a.optDouble("distanza_m",0)/1000f;}catch(Exception ignored){}}} float max=1f; for(float k:km) if(k>max) max=k; if(max<5f) max=5f; Paint bar=new Paint(Paint.ANTI_ALIAS_FLAG); Paint txt=new Paint(Paint.ANTI_ALIAS_FLAG); txt.setColor(Color.parseColor("#7dff8a")); txt.setTextSize(18f); txt.setTextAlign(Paint.Align.CENTER); Paint val=new Paint(Paint.ANTI_ALIAS_FLAG); val.setColor(Color.WHITE); val.setTextSize(15f); val.setTextAlign(Paint.Align.CENTER); String[] labs={"LUN","MAR","MER","GIO","VEN","SAB","DOM"}; for(int i=0;i<7;i++){float x=i*(W/7f)+8; float bw=(W/7f)-16; float bh=(km[i]/max)*(H-28); if(bh<3) bh=km[i]>0?10:2; bar.setColor(km[i]>0?Color.parseColor("#5afc7a"):Color.parseColor("#1a3d1a")); c.drawRoundRect(x,H-20-bh,x+bw,H-20,6f,6f,bar); c.drawText(labs[i],x+bw/2,H-2,txt); if(km[i]>0) c.drawText(String.format(Locale.US,"%.1f",km[i]),x+bw/2,H-24-bh,val);}}catch(Exception e){} return bmp;}
          }
          ENDOFF
          gradle assembleDebug
