name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build
        run: |
          python3 << 'PY'
          import os
          os.makedirs("app/src/main/java/com/garminmatrix", exist_ok=True)
          os.makedirs("app/src/main/res/xml", exist_ok=True)
          os.makedirs("app/src/main/res/layout", exist_ok=True)
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/assets", exist_ok=True)
          open("settings.gradle","w").write("include ':app'\n")
          open("local.properties","w").write(f"sdk.dir={os.environ['ANDROID_HOME']}\n")
          open("gradle.properties","w").write("android.useAndroidX=true\n")
          open("build.gradle","w").write("buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.2.2' } } allprojects { repositories { google(); mavenCentral() } }\n")
          open("app/build.gradle","w").write("apply plugin: 'com.android.application'\nandroid { namespace 'com.garminmatrix'; compileSdk 34; defaultConfig { applicationId \"com.garminmatrix\"; minSdk 24; targetSdk 34; versionCode 72; versionName \"V47-CLONE-100\" } compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } } dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.webkit:webkit:1.6.1' }\n")
          open("app/src/main/res/drawable/bg_main.xml","w").write('<shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="20dp"/><solid android:color="#0d1a0d"/><stroke android:width="2dp" android:color="#5afc7a"/></shape>')
          open("app/src/main/res/drawable/bg_card.xml","w").write('<shape xmlns:android="http://schemas.android.com/apk/res/android"><corners android:radius="10dp"/><solid android:color="#142414"/></shape>')
          open("app/src/main/res/drawable/p_orange.xml","w").write('<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#261a0a"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#ff7a18"/></shape></clip></item></layer-list>')
          open("app/src/main/res/drawable/p_cyan.xml","w").write('<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#0a2222"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#00e5ff"/></shape></clip></item></layer-list>')
          open("app/src/main/res/drawable/p_purple.xml","w").write('<layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:id="@android:id/background"><shape><corners android:radius="6dp"/><solid android:color="#1e1430"/></shape></item><item android:id="@android:id/progress"><clip><shape><corners android:radius="6dp"/><solid android:color="#a855f7"/></shape></clip></item></layer-list>')
          open("app/src/main/res/xml/widget_raziel_info.xml","w").write('<?xml version="1.0"?><appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="300dp" android:minHeight="360dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget_raziel" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>')
          open("app/src/main/res/layout/widget_raziel.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_main" android:padding="12dp"><TextView android:id="@+id/w_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL" android:textColor="#7dff8a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/w_updated" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--:--" android:textColor="#6b9a6b" android:textSize="9sp"/><TextView android:id="@+id/w_hrv" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="HRV --" android:textColor="#8acf8a" android:textSize="9sp"/><ProgressBar android:id="@+id/bar_ana" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:progressDrawable="@drawable/p_purple"/><ProgressBar android:id="@+id/bar_alto" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:progressDrawable="@drawable/p_orange"/><ProgressBar android:id="@+id/bar_basso" style="?android:attr/progressBarStyleHorizontal" android:layout_width="match_parent" android:layout_height="8dp" android:progressDrawable="@drawable/p_cyan"/><ImageView android:id="@+id/w_chart" android:layout_width="match_parent" android:layout_height="90dp"/></LinearLayout>')
          open("app/src/main/res/layout/activity_main.xml","w").write('<?xml version="1.0" encoding="utf-8"?><LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="#0d1a0d"><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:padding="12dp" android:background="#111f11"><TextView android:layout_width="match_parent" android:layout_height="wrap_content" android:text="RAZIEL V47 CLONE 100%" android:textColor="#5afc7a" android:textSize="13sp" android:textStyle="bold"/><TextView android:id="@+id/txt_status" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="FULL CLONE" android:textColor="#8acf8a" android:textSize="11sp"/><TextView android:id="@+id/txt_path" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="--" android:textColor="#6b9a6b" android:textSize="9sp"/><LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:layout_marginTop="8dp"><Button android:id="@+id/btn_auto" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="AUTO ONEDRIVE" android:backgroundTint="#00e5ff"/><Button android:id="@+id/btn_import" android:layout_width="0dp" android:layout_weight="1" android:layout_height="48dp" android:text="SCEGLI FILE" android:backgroundTint="#5afc7a" android:layout_marginStart="6dp"/></LinearLayout></LinearLayout><WebView android:id="@+id/webview" android:layout_width="match_parent" android:layout_height="match_parent"/></LinearLayout>')
          open("app/src/main/AndroidManifest.xml","w").write('<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://schemas.android.com/apk/res/android"><uses-permission android:name="android.permission.INTERNET"/><application android:allowBackup="true" android:label="RAZIEL" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><receiver android:name=".RazielWidgetProvider" android:exported="true"><intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter><meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_raziel_info"/></receiver></application></manifest>')
          html = r"""<!DOCTYPE html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          *{margin:0;padding:0;box-sizing:border-box}body{background:#080f08;color:#cfe9cf;font-family:monospace;padding:4px}
         .topbar{display:flex;justify-content:space-between;align-items:center;background:#0a1a0a;border:1px solid #1e4a1e;border-radius:8px;padding:6px 10px;font-size:10px;color:#5afc7a;margin-bottom:6px}
         .topbar b{color:#7dff8a}
         .btn{border:1px solid #5afc7a;background:#132913;color:#5afc7a;border-radius:12px;padding:3px 10px;font-size:9px}
         .section{color:#4dff4d;font-size:10px;font-weight:bold;margin:12px 0 6px 2px;display:flex;align-items:center;gap:4px}
         .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:6px}
         .grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:6px}
         .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:6px}
         .grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:6px}
         .card{background:#0d1e0d;border:1px solid #1a3a1a;border-radius:8px;padding:7px 8px;position:relative;overflow:hidden}
         .card.hdr{font-size:8px;color:#5a8a5a;display:flex;align-items:center;gap:3px;margin-bottom:3px;text-transform:uppercase}
         .card.val{font-size:18px;font-weight:bold;color:#eaffea;line-height:1.1}.card.sub{font-size:8px;color:#6b9a6b;margin-top:2px}
         .barrow{display:flex;align-items:center;gap:6px;margin-top:4px}.bar{flex:1;height:8px;background:#132913;border-radius:4px;overflow:hidden}.bar div{height:100%}
         .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
          canvas{width:100%;height:84px;display:block;margin-top:4px}
         .bigchart canvas{height:110px}
         .legend{display:flex;gap:8px;font-size:7px;justify-content:center;margin:4px 0}
         .legend span{display:flex;align-items:center;gap:2px}
         .act{border-bottom:1px solid #162916;padding:6px 0;display:flex;justify-content:space-between;font-size:10px}
         .act.ico{width:18px;height:18px;background:#1a3a1a;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;margin-right:6px}
         .coach{background:#111;border:1px solid #222;border-radius:10px;padding:10px;margin-top:8px}
         .coachbox{height:110px;background:#070707;border-radius:8px;margin:8px 0}
         .coachinput{display:flex;gap:6px}.coachinput input{flex:1;background:#0f0f0f;border:1px solid #222;border-radius:14px;padding:6px 10px;color:#777;font-size:10px}.coachinput button{background:#2a5a2a;color:#8f8;border:0;border-radius:10px;padding:4px 12px;font-size:10px}
          </style></head><body>
          <div class="topbar"><div>GARMIN DASHBOARD // RAZ/IL - <span id="t_date">2026-10-12</span> - FC <span id="t_rhr">50</span> BPM - 7 giorni</div><div style="display:flex;gap:4px"><div style="font-size:8px;border:1px solid #2a5a2a;border-radius:10px;padding:2px 6px" id="t_info">2026-10-12</div><div class="btn">Aggiorna dati</div></div></div>
          <div class="section">● Forma & Training Status</div>
          <div class="grid4">
            <div class="card"><div class="hdr">💥 SOVRACCARICO</div><div class="val" id="v_acwr">1.13</div><div class="sub">Rapporto Acuto/Cronico</div></div>
            <div class="card"><div class="hdr">⚡ PRONTEZZA</div><div class="val" id="v_ready">25</div><div class="sub">Training Readiness</div></div>
            <div class="card"><div class="hdr">📊 BILANCIO CARICO</div><div class="val" id="v_bil">Ottimale</div><div class="sub" id="v_bil_sub">Bilancio Carico</div></div>
            <div class="card"><div class="hdr">💜 VO2_MAX</div><div class="val" id="v_vo2">48</div><div class="sub">Stimato ultimo 7gg</div></div>
          </div>
          <div class="grid2">
            <div class="card bigchart"><div class="hdr">VO2_MAX - ULTIMI 7 GIORNI</div><canvas id="ch_vo2"></canvas></div>
            <div class="card bigchart"><div class="hdr">● BILANCIO DEL CARICO</div><canvas id="ch_bil"></canvas></div>
          </div>
          <div class="card" style="margin-bottom:6px"><div class="hdr" style="color:#4dff4d" id="bil28_title">● BILANCIO DEL CARICO - Ultimi 28 giorni al 2026-10-12</div><div style="font-size:8px;color:#5a8a5a;margin-bottom:6px">Fonte: Garmin API V3 - metodo: TrainingLoadBalanceOTOMp</div>
            <div class="barrow"><span class="dot" style="background:#a855f7"></span><span style="font-size:9px;flex:0 0 90px">Anaerobico</span><div class="bar"><div id="b_ana" style="background:#a855f7;width:10%"></div></div><span style="font-size:9px;color:#a855f7" id="n_ana">135</span></div>
            <div class="barrow"><span class="dot" style="background:#ff7a18"></span><span style="font-size:9px;flex:0 0 90px">Aerobico alto</span><div class="bar"><div id="b_alto" style="background:#ff7a18;width:90%"></div></div><span style="font-size:9px;color:#ff7a18" id="n_alto">1758</span></div>
            <div class="barrow"><span class="dot" style="background:#00e5ff"></span><span style="font-size:9px;flex:0 0 90px">Aerobico basso</span><div class="bar"><div id="b_basso" style="background:#00e5ff;width:12%"></div></div><span style="font-size:9px;color:#00e5ff" id="n_basso">124</span></div>
            <div style="font-size:8px;color:#ff7a18;margin-top:6px">● AEROBIC_LOW_SHORTAGE</div>
          </div>
          <div class="section">● Salute & Recovery</div>
          <div class="grid5">
            <div class="card"><div class="hdr">😴 SLEEP SCORE</div><div class="val" id="v_sleep">57</div><div class="sub" id="s_sleep">57h Top: 91 il 10-06</div></div>
            <div class="card"><div class="hdr" style="color:#4dff4d">💚 HRV</div><div class="val" id="v_hrv">45 ms</div><div class="sub" id="s_hrv">Top: 55 il 10-09</div></div>
            <div class="card"><div class="hdr">❤️ FC RIPOSO</div><div class="val" id="v_rhr">50 bpm</div><div class="sub" id="s_rhr">Top: 50 il 10-11</div></div>
            <div class="card"><div class="hdr">🔋 BODY BATTERY</div><div class="val" id="v_bb">53 / 10</div><div class="sub">Top: 95 / Max / Min oggi</div></div>
            <div class="card"><div class="hdr">😰 STRESS</div><div class="val" id="v_stress">28</div><div class="sub">12.75 punti - 2.88h avg</div></div>
          </div>
          <div class="grid2">
            <div class="card"><div class="hdr">😴 SLEEP SCORE - ULTIMI 7</div><canvas id="ch_sleep"></canvas></div>
            <div class="card"><div class="hdr">💚 HRV - ULTIMI 7</div><canvas id="ch_hrv"></canvas></div>
            <div class="card"><div class="hdr">❤️ FC A RIPOSO - ULTIMI 7</div><canvas id="ch_rhr"></canvas></div>
            <div class="card"><div class="hdr">😰 STRESS - ULTIMI 7</div><canvas id="ch_str"></canvas></div>
            <div class="card"><div class="hdr">💚 BODY BATTERY MAX - ULTIMI 7</div><canvas id="ch_bb"></canvas></div>
            <div class="card"><div class="hdr">🌙 ORE SONNO - ULTIMI 7</div><canvas id="ch_sonno"></canvas></div>
          </div>
          <div class="section">● Overview - Volume settimanale</div>
          <div class="grid6">
            <div class="card"><div class="hdr">🏃 CORSA</div><div class="val" style="font-size:14px" id="vol_corsa">3.1h</div></div>
            <div class="card"><div class="hdr">🏔️ TRAIL RUN</div><div class="val" style="font-size:14px" id="vol_trail">0h</div></div>
            <div class="card"><div class="hdr">🥾 ESCURSIONISMO</div><div class="val" style="font-size:14px">0h</div></div>
            <div class="card"><div class="hdr">🚴 BICI</div><div class="val" style="font-size:14px">0h</div></div>
            <div class="card"><div class="hdr">🛶 KAYAK</div><div class="val" style="font-size:14px">0h</div></div>
            <div class="card"><div class="hdr">🏊 NUOTO</div><div class="val" style="font-size:14px">0h</div></div>
          </div>
          <div class="card"><div class="hdr">VOLUME SETTIMANALE - PER DISCIPLINA (KM)</div><div class="legend"><span><span class="dot" style="background:#ff4444"></span>Corsa</span><span><span class="dot" style="background:#44ff44"></span>Trail</span><span><span class="dot" style="background:#44ddff"></span>Bici</span><span><span class="dot" style="background:#aaffaa"></span>Escurs</span><span><span class="dot" style="background:#8888ff"></span>Kayak</span><span><span class="dot" style="background:#0088ff"></span>Nuoto</span></div><canvas id="ch_vol" style="height:190px"></canvas></div>
          <div class="section">● Distanza & Record - TEMPI REALI</div>
          <div class="grid5" style="grid-template-columns:repeat(5,1fr)">
            <div class="card"><div class="hdr">⚡ KM PIÙ VELOCE</div><div class="val" style="font-size:12px" id="r_pace">4:05</div><div class="sub">2024-07-10 Isola di Capo Rizzuto Co</div></div>
            <div class="card"><div class="hdr">🔥 5 KM PIÙ VELOCE</div><div class="val" style="font-size:12px" id="r_5k">31:21</div><div class="sub">2025-06-25 Corsa su tapis roulant</div></div>
            <div class="card"><div class="hdr">🏃 10 KM PIÙ VELOCE</div><div class="val" style="font-size:12px" id="r_10k">57:29</div><div class="sub">2025-06-11 Trail - Corsa finale med</div></div>
            <div class="card"><div class="hdr">🏅 MEZZA MARATONA</div><div class="val" style="font-size:12px">--</div><div class="sub">Mai fatto</div></div>
            <div class="card"><div class="hdr">👑 MARATONA</div><div class="val" style="font-size:12px">--</div><div class="sub">Mai fatto</div></div>
          </div>
          <div class="grid4" style="grid-template-columns:1fr 1fr 1fr 1fr">
            <div class="card"><div class="hdr">🏃 CORSA PIÙ LUNGA IN KM</div><div class="val" style="font-size:12px" id="r_long">15.03 km</div><div class="sub">Trail - Lungo in zona 2 - 2025-09-28</div></div>
            <div class="card"><div class="hdr">⛰️ DISLIVELLO + ALTO CORSA</div><div class="val" style="font-size:12px" id="r_elev">571 m</div><div class="sub">Caccomo Trail Running - 2025-07-17</div></div>
            <div class="card"><div class="hdr">📍 USCITA PIÙ LUNGA IN KM</div><div class="val" style="font-size:12px" id="r_month">57.48 km</div><div class="sub">Trabia Gioia boscata Gimmia - 2023-09-10</div></div>
            <div class="card"><div class="hdr">🏔️ DISLIVELLO + GIORNO BICI</div><div class="val" style="font-size:12px" id="r_bike">1379 m</div><div class="sub">Trabia Mountain bike - 2023-10-22</div></div>
          </div>
          <div class="section">● Ultime 10 Attività</div>
          <div class="card"><div id="acts"></div></div>
          <div class="coach"><div style="font-size:11px;font-weight:bold">💬 Chat col tuo Coach AI</div><div class="coachbox" id="coachbox"></div><div class="coachinput"><input placeholder="Es: come sto andando? devo fare più fondo?"><button>Invia</button></div></div>
          <script>
          async function load(){
            try{
              let db = await (await fetch('https://appassets.androidplatform.net/data/database.json?v='+Date.now())).json();
              let giorni=db.giorni||[]; let last=giorni.length?giorni[giorni.length-1]:{}; let last7=giorni.slice(-7);
              let bil=db.bilancio_carico||{}; let ana=bil.anaerobico||135, alto=bil.aerobico_alto||1758, basso=bil.aerobico_basso||124;
              document.getElementById('t_date').innerText=db.periodo?.a||'2026-10-12'; document.getElementById('t_info').innerText=db.periodo?.a||'2026-10-12';
              document.getElementById('bil28_title').innerText='● BILANCIO DEL CARICO - Ultimi 28 giorni al '+(db.periodo?.a||'2026-10-12');
              document.getElementById('v_acwr').innerText=last.acwr||1.13; document.getElementById('v_ready').innerText=last.readiness||25; document.getElementById('v_vo2').innerText=last.vo2max||48;
              document.getElementById('v_bil').innerText='Ottimale'; document.getElementById('n_ana').innerText=ana; document.getElementById('n_alto').innerText=alto; document.getElementById('n_basso').innerText=basso;
              let maxB=Math.max(ana,alto,basso,1); document.getElementById('b_ana').style.width=(ana/maxB*100)+'%'; document.getElementById('b_alto').style.width=(alto/maxB*100)+'%'; document.getElementById('b_basso').style.width=(basso/maxB*100)+'%';
              document.getElementById('v_sleep').innerText=last.sleep_score||57; document.getElementById('v_hrv').innerText=(last.hrv||45)+' ms'; document.getElementById('v_rhr').innerText=(last.fc_riposo||50)+' bpm'; document.getElementById('v_bb').innerText=(last.body_battery_max||53)+' / '+(last.body_battery_min||10); document.getElementById('v_stress').innerText=last.stress_avg||28;
              document.getElementById('t_rhr').innerText=last.fc_riposo||50;
              function scale(c){let dpr=2; c.width=c.clientWidth*dpr; c.height=c.clientHeight*dpr; return c.getContext('2d');}
              function drawLine(id, vals, col, fill){let c=document.getElementById(id); if(!c)return; let ctx=scale(c); let W=c.width,H=c.height; ctx.clearRect(0,0,W,H); let max=Math.max(...vals,1), min=Math.min(...vals); if(max==min)max=min+5; ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath(); vals.forEach((v,i)=>{let x=30+i*(W-50)/(vals.length-1||1); let y=H-20-(v-min)/(max-min||1)*(H-40); if(i==0)ctx.moveTo(x,y); else ctx.lineTo(x,y);}); ctx.stroke(); if(fill){ctx.fillStyle=col+'33'; ctx.lineTo(W-20,H-20); ctx.lineTo(30,H-20); ctx.closePath(); ctx.fill();} ctx.fillStyle='#5a8a5a'; ctx.font='10px monospace'; vals.forEach((_,i)=>{if(id.includes('vo2')||id.includes('bil'))return;});}
              function drawBar(id, vals, col){let c=document.getElementById(id); if(!c)return; let ctx=scale(c); let W=c.width,H=c.height; ctx.clearRect(0,0,W,H); let max=Math.max(...vals,1); vals.forEach((v,i)=>{let bw=(W-40)/vals.length-6; let x=20+i*(bw+6); let h=(v/max)*(H-30); ctx.fillStyle=col; ctx.fillRect(x,H-20-h,bw,h);});}
              drawLine('ch_vo2', last7.map(g=>g.vo2max||48), '#44ff44', true);
              // bilancio acuto cronico
              (function(){let c=document.getElementById('ch_bil'); let ctx=scale(c); let W=c.width,H=c.height; ctx.clearRect(0,0,W,H); ctx.fillStyle='#44ff44'; ctx.fillRect(W*0.15,H*0.3, W*0.2, H*0.5); ctx.fillStyle='#44ddff'; ctx.fillRect(W*0.6,H*0.1, W*0.25, H*0.7); ctx.fillStyle='#5a8a5a'; ctx.font='10px monospace'; ctx.fillText('Acuto',W*0.18,H-5); ctx.fillText('Cronico',W*0.62,H-5);})();
              drawBar('ch_sleep', last7.map(g=>g.sleep_score||60), '#ffcc00');
              drawLine('ch_hrv', last7.map(g=>g.hrv||40), '#44ff44', true);
              drawLine('ch_rhr', last7.map(g=>g.fc_riposo||43), '#ff4444');
              drawLine('ch_str', last7.map(g=>g.stress_avg||20), '#ff8800');
              drawLine('ch_bb', last7.map(g=>g.body_battery_max||60), '#44ff44', true);
              drawBar('ch_sonno', last7.map(g=>g.sleep_hours||6), '#aa88ff');
              // volume settimanale
              (function(){let c=document.getElementById('ch_vol'); let ctx=scale(c); let W=c.width,H=c.height; ctx.clearRect(0,0,W,H); let att=db.attivita||[]; let map={}; att.forEach(a=>{let d=(a.inizio||'').slice(0,7); if(d.startsWith('2025-')) return; let key=(a.inizio||'').slice(0,10); if(!map[key])map[key]={corsa:0,trail:0,bici:0,escurs:0}; let n=(a.nome||'').toLowerCase(); let cat='corsa'; if(n.includes('trail'))cat='trail'; else if(n.includes('bici')||n.includes('bike'))cat='bici'; else if(n.includes('escurs'))cat='escurs'; map[key][cat]+=(a.durata_s||1800)/60;}); let keys=Object.keys(map).slice(-11); let maxV=50; keys.forEach((k,i)=>{let x=20+i*(W-30)/keys.length; let d=map[k]; let y=H-20; let h1=(d.corsa/maxV)*(H-40); ctx.fillStyle='#ff4444'; ctx.fillRect(x,y-h1,6,h1); let h2=(d.bici/maxV)*(H-40); ctx.fillStyle='#44ddff'; ctx.fillRect(x,y-h1-h2,6,h2); let h3=(d.escurs/maxV)*(H-40); ctx.fillStyle='#aaffaa'; ctx.fillRect(x,y-h1-h2-h3,6,h3); let h4=(d.trail/maxV)*(H-40); ctx.fillStyle='#44ff44'; ctx.fillRect(x+7,y-h4,5,h4);});})();
              // ultime 10
              let acts=db.attivita||[]; document.getElementById('acts').innerHTML=acts.slice(0,10).map(a=>{let d=(a.inizio||'').slice(5,10).replace('-','/'); let name=a.nome||'Corsa'; let km=(a.distanza_m/1000).toFixed(2)+'km'; let mins=Math.round((a.durata_s||0)/60)+'min'; return '<div class="act"><div><span class="ico">🏃</span>'+d+' - Running - '+name+'</div><div>'+km+' - '+mins+'</div></div>';}).join('');
              // vol
              let totH=0; (db.attivita||[]).forEach(a=>{if((a.inizio||'').slice(0,10)>=new Date(Date.now()-7*86400000).toISOString().slice(0,10)) totH+=(a.durata_s||0)/3600;}); document.getElementById('vol_corsa').innerText=totH.toFixed(1)+'h';
            }catch(e){document.body.innerHTML+='<div style="color:red">ERR '+e.message+'</div>';}
          }
          load();
          </script></body></html>
