name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Create project
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          rm -rf app build .gradle
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/garminmatrix
          [ -f index.html ] && cp index.html app/src/main/assets/ || echo '<html><body><h1>Garmin Matrix</h1></body></html>' > app/src/main/assets/index.html
          [ -f database.json ] && cp database.json app/src/main/assets/ || echo '{}' > app/src/main/assets/database.json
          if [ -n "$GEMINI_KEY" ]; then
            echo "Inietto GEMINI key OK len=${#GEMINI_KEY}"
            sed -i "s|__GEMINI_KEY__|${GEMINI_KEY}|g" app/src/main/assets/index.html
          else
            echo "Nessun secret trovato - APK chiedera key manualmente"
            sed -i "s|__GEMINI_KEY__||g" app/src/main/assets/index.html
          fi
          echo "include ':app'" > settings.gradle
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          cat > build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          android {
            namespace 'com.garminmatrix'
            compileSdk 34
            defaultConfig { applicationId "com.garminmatrix"; minSdk 24; targetSdk 34; versionCode 13; versionName "1.6-fix-prompt" }
          }
          dependencies { 
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.6.1'
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:allowBackup="true" android:label="Garmin Matrix" android:usesCleartextTraffic="true" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/garminmatrix/MainActivity.java << 'EOF'
          package com.garminmatrix;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebChromeClient;
          import android.webkit.JsPromptResult;
          import android.webkit.JsResult;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.webkit.WebViewAssetLoader;
          public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              WebView wv = new WebView(this);
              setContentView(wv);
              WebView.setWebContentsDebuggingEnabled(true);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setJavaScriptCanOpenWindowsAutomatically(true);
              s.setAllowFileAccess(true);
              s.setAllowContentAccess(true);
              s.setAllowFileAccessFromFileURLs(true);
              s.setAllowUniversalAccessFromFileURLs(true);
              s.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder().addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this)).build();
              wv.setWebViewClient(new androidx.webkit.WebViewClientCompat() {
                @Override public android.webkit.WebResourceResponse shouldInterceptRequest(WebView view, android.webkit.WebResourceRequest req) { return loader.shouldInterceptRequest(req.getUrl()); }
              });
              wv.setWebChromeClient(new WebChromeClient() {
                @Override public boolean onJsPrompt(WebView view, String url, String message, String defaultValue, JsPromptResult result) {
                  result.confirm(defaultValue);
                  return true;
                }
              });
              wv.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }
          }
          EOF
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GarminMatrix-APK
          path: app/build/outputs/apk/debug/*.apk
